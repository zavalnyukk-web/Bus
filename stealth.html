  .go { font:inherit; font-size:18px; font-weight:700; padding:12px 28px; border:0; border-radius:12px; background:var(--y); color:#2a2200; cursor:pointer; }
  .snd { font:inherit; font-size:12px; font-weight:700; padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff; cursor:pointer; white-space:nowrap; }

</style>
</head>

    if (open) { g.strokeStyle = "rgba(47,179,107," + (0.5 + 0.4 * Math.sin(tm * 6)) + ")"; g.lineWidth = 3; g.strokeRect(e[0] - 4, e[1] - 4, e[2] + 8, e[3] + 8); }
    g.fillStyle = "#c0a265"; OBST.forEach(function (o) { g.fillRect(o[0], o[1], o[2], o[3]); });
    g.fillStyle = "#2a3b44"; WALLS.forEach(function (w) { if (OBST.indexOf(w) < 0) g.fillRect(w[0], w[1], w[2], w[3]); });
    items.forEach(function (it) { if (it.got) return; g.fillStyle = "rgba(255,230,120,.35)"; g.beginPath(); g.arc(it.x, it.y, 15 + Math.sin(tm * 4) * 2, 0, 7); g.fill(); g.font = "18px system-ui"; g.textAlign = "center"; g.fillText(it.e, it.x, it.y + 6); g.textAlign = "left"; });
    guards.forEach(function (gd) {
      var rays = 26, half = gd.d.fov / 2, pts = [];
      for (var i = 0; i <= rays; i++) { var a = gd.a - half + gd.d.fov * i / rays, t = cast(gd.x, gd.y, a, gd.d.rng); pts.push([gd.x + Math.cos(a) * t, gd.y + Math.sin(a) * t]); }
      g.fillStyle = gd.al > 0.3 ? "rgba(255,60,50," + (0.18 + gd.al * 0.25) + ")" : "rgba(255,235,90,.22)";
      g.beginPath(); g.moveTo(gd.x, gd.y); pts.forEach(function (p) { g.lineTo(p[0], p[1]); }); g.closePath(); g.fill();
    });
    guards.forEach(function (gd) {
      g.fillStyle = "rgba(0,0,0,.25)"; g.beginPath(); g.arc(gd.x + 2, gd.y + 3, 10, 0, 7); g.fill();
      g.fillStyle = gd.d.col; g.beginPath(); g.arc(gd.x, gd.y, 10, 0, 7); g.fill();
      if (gd.d.img && head.complete && head.naturalWidth) { g.save(); g.beginPath(); g.arc(gd.x, gd.y, 8, 0, 7); g.clip(); g.drawImage(head, gd.x - 9, gd.y - 10, 18, 22); g.restore(); }
      g.strokeStyle = "#fff"; g.lineWidth = 2; g.beginPath(); g.moveTo(gd.x, gd.y); g.lineTo(gd.x + Math.cos(gd.a) * 14, gd.y + Math.sin(gd.a) * 14); g.stroke();
      g.font = "14px system-ui"; g.textAlign = "center"; g.fillText(gd.d.e, gd.x, gd.y - 14);
      if (gd.al > 0.35) { g.fillStyle = "#ff3030"; g.font = "bold 20px system-ui"; g.fillText("!", gd.x, gd.y - 28); } g.textAlign = "left";
    });
    g.fillStyle = "rgba(0,0,0,.25)"; g.beginPath(); g.arc(P.x + 2, P.y + 3, 8, 0, 7); g.fill();
    g.fillStyle = "#2fa86a"; g.beginPath(); g.arc(P.x, P.y, 8, 0, 7); g.fill();
    g.fillStyle = "#c0392b"; g.beginPath(); g.arc(P.x - Math.cos(P.a) * 6, P.y - Math.sin(P.a) * 6, 4.5, 0, 7); g.fill();
    g.fillStyle = "#f2c9a0"; g.beginPath(); g.arc(P.x + Math.cos(P.a) * 3, P.y + Math.sin(P.a) * 3, 4, 0, 7); g.fill();
    if (sneak) { g.fillStyle = "#fff"; g.font = "11px system-ui"; g.textAlign = "center"; g.fillText("🤫", P.x, P.y - 12); g.textAlign = "left"; }
    g.restore();
    hud();
  }
  function hud() {
    var k = 0; g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(6, 6, items.length * 24 + 8, 28);
    g.font = "17px system-ui"; items.forEach(function (it) { g.globalAlpha = it.got ? 1 : 0.3; g.fillText(it.e, 10 + k * 24, 27); k++; }); g.globalAlpha = 1;
    var sc = 0.1, mw = BOUNDS[2] * sc, mh = BOUNDS[3] * sc, ox = W - mw - 6, oy = 6;
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(ox - 2, oy - 2, mw + 4, mh + 4);
    FLOORS.forEach(function (f) { g.fillStyle = "#9aa8a0"; g.fillRect(ox + (f[0] - BOUNDS[0]) * sc, oy + (f[1] - BOUNDS[1]) * sc, f[2] * sc, f[3] * sc); });
    var e = exitRect(); g.fillStyle = "#2fb36b"; g.fillRect(ox + (e[0] - BOUNDS[0]) * sc - 1, oy + (e[1] - BOUNDS[1]) * sc - 1, 5, 5);
    items.forEach(function (it) { if (!it.got) { g.fillStyle = "#ffd23f"; g.fillRect(ox + (it.x - BOUNDS[0]) * sc - 1, oy + (it.y - BOUNDS[1]) * sc - 1, 3, 3); } });
    guards.forEach(function (gd) { g.fillStyle = "#ff3040"; g.beginPath(); g.arc(ox + (gd.x - BOUNDS[0]) * sc, oy + (gd.y - BOUNDS[1]) * sc, 2.2, 0, 7); g.fill(); });
    g.fillStyle = "#4fc3ff"; g.beginPath(); g.arc(ox + (P.x - BOUNDS[0]) * sc, oy + (P.y - BOUNDS[1]) * sc, 2.5, 0, 7); g.fill();
    if (meter > 0.02) { g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(70, H - 24, W - 140, 12); g.fillStyle = meter > 0.6 ? "#ff3030" : "#ffb020"; g.fillRect(72, H - 22, (W - 144) * meter, 8); }
    if (msgT > 0 && msg) { g.font = "bold 13px system-ui"; var tw = Math.min(W - 24, g.measureText(msg).width + 20); g.globalAlpha = Math.min(1, msgT * 2); g.fillStyle = "rgba(0,0,0,.72)"; g.fillRect((W - tw) / 2, H - 56, tw, 26); g.fillStyle = "#fff"; g.textAlign = "center"; g.fillText(msg, W / 2, H - 38, W - 30); g.textAlign = "left"; g.globalAlpha = 1; }
    if (joy && joy.m > 6) { var r = cv.getBoundingClientRect(), s = W / r.width, jx = (joy.x - r.left) * s, jy = (joy.y - r.top) * s; g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 2; g.beginPath(); g.arc(jx, jy, 30, 0, 7); g.stroke(); g.fillStyle = "rgba(255,255,255,.4)"; var m = Math.min(30, joy.m * s); g.beginPath(); g.arc(jx + joy.dx / joy.m * m, jy + joy.dy / joy.m * m, 12, 0, 7); g.fill(); }
  }

  /* ---------- керування ---------- */
  var KM = { ArrowLeft: "L", ArrowRight: "R", ArrowUp: "U", ArrowDown: "D", a: "L", d: "R", w: "U", s: "D", A: "L", D: "R", W: "U", S: "D" };
  addEventListener("keydown", function (e) { var k = KM[e.key]; if (k) { keys[k] = true; e.preventDefault(); } if (e.key === "Shift" || e.key === " ") { sneak = true; $("sn").classList.add("on"); } });
  addEventListener("keyup", function (e) { var k = KM[e.key]; if (k) keys[k] = false; if (e.key === "Shift" || e.key === " ") { sneak = false; $("sn").classList.remove("on"); } });
  cv.addEventListener("pointerdown", function (e) { joy = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, m: 0 }; try { cv.setPointerCapture(e.pointerId); } catch (x) {} SFXLIB.ac(); });
  cv.addEventListener("pointermove", function (e) { if (!joy) return; var dx = e.clientX - joy.x, dy = e.clientY - joy.y, m = Math.hypot(dx, dy); if (m > 40) { joy.x = e.clientX - dx / m * 40; joy.y = e.clientY - dy / m * 40; dx = e.clientX - joy.x; dy = e.clientY - joy.y; m = 40; } joy.dx = dx; joy.dy = dy; joy.m = m; });
  function endj() { joy = null; } cv.addEventListener("pointerup", endj); cv.addEventListener("pointercancel", endj);
  $("sn").addEventListener("click", function () { sneak = !sneak; this.classList.toggle("on", sneak); });
  SFXLIB.bind($("snd"));

  var last = 0;
  function frame(t0) { var dt = Math.min(0.05, (t0 - last) / 1000 || 0.016); last = t0; update(dt); render(); requestAnimationFrame(frame); }
  load(Math.min(saved, LV.length - 1)); cam.x = P.x; cam.y = P.y; intro();
  requestAnimationFrame(frame);
  window.__s = {
    tick: function (dt) { update(dt); render(); },
    go: function (l) { load(l); st = "play"; $("ov").hidden = true; },
    put: function (x, y) { P.x = x; P.y = y; },
    ok: okPos, floors: FLOORS, walls: WALLS, lv: LV, exits: EXITS, bounds: BOUNDS,
    get s() { return { st: st, P: P, got: got, meter: meter, guards: guards.map(function (q) { return { x: q.x, y: q.y, al: q.al }; }) }; },
    keys: keys, sneak: function (v) { sneak = v; }
  };
})();
