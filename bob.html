  .go { font:inherit; font-size:18px; font-weight:700; padding:12px 28px; border:0; border-radius:12px; background:var(--y); color:#2a2200; cursor:pointer; }
  .go2 { font:inherit; font-size:13px; font-weight:600; padding:7px 14px; border:1px solid rgba(255,255,255,.35); border-radius:10px; background:transparent; color:#fff; cursor:pointer; }

  .sneak { font:inherit; font-size:16px; font-weight:700; padding:12px 18px; border:2px solid rgba(255,255,255,.35); border-radius:14px; background:rgba(255,255,255,.1); color:#fff; touch-action:none; }

    $("h").textContent = L.name; $("lvl").textContent = "Рівень " + (lvl + 1) + " з " + LV.length; $("txt").textContent = L.intro; $("go").textContent = "Почати місію";
    $("again").hidden = !(lvl > 0 && !started); $("ov").hidden = false;
    $("go").onclick = function () { SFXLIB.ac(); $("ov").hidden = true; st = "play"; if (!started) { started = true; try { if (window.trackPlay) window.trackPlay("bob"); } catch (e) {} } };
  }

  /* ---------- малювання ---------- */
  function render() {
    var cx = Math.max(0, Math.min(MW * T - W, P.x * T - W / 2)), cy = Math.max(0, Math.min(MH * T - H, P.y * T - H / 2 - 30));
    g.fillStyle = "#1a1f2b"; g.fillRect(0, 0, W, H);
    var c0 = Math.floor(cx / T), r0 = Math.floor(cy / T), c1 = Math.min(MW - 1, c0 + Math.ceil(W / T) + 1), r1 = Math.min(MH - 1, r0 + Math.ceil(H / T) + 1);
    for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
      var t = MAP[r][c], x = c * T - cx, y = r * T - cy;
      if (t === "#") { g.fillStyle = "#3a4150"; g.fillRect(x, y, T, T); g.fillStyle = "#4a5266"; g.fillRect(x, y, T, 3); }
      else if (t === "G") { g.fillStyle = "#3f7d3f"; g.fillRect(x, y, T, T); g.fillStyle = "#4f8f4a"; g.fillRect(x + 4, y + 6, 6, 3); g.fillRect(x + 16, y + 17, 6, 3); }
      else { g.fillStyle = FLOOR[t] || "#ccc"; g.fillRect(x, y, T, T); if (t === "c" || t === "d") { g.fillStyle = "rgba(120,80,30,.12)"; g.fillRect(x, y + T - 1, T, 1); } else if (t !== "E" && t !== "o") { g.fillStyle = "rgba(0,0,0,.06)"; g.fillRect(x, y, T, 1); g.fillRect(x, y, 1, T); }
        if (t === "s") { g.fillStyle = "rgba(0,0,0,.18)"; for (var i = 1; i < 5; i++) g.fillRect(x, y + i * 6, T, 2); }
        if (t === "E") { g.fillStyle = exitOpen ? "#fff" : "rgba(0,0,0,.35)"; g.font = "18px sans-serif"; g.textAlign = "center"; g.fillText("🚪", x + T / 2, y + 20); g.textAlign = "left"; if (!exitOpen) { g.fillStyle = "#d62839"; g.fillRect(x, y, T, 4); } } }
    }
    g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 2; g.strokeRect(34 * T - cx, 24 * T - cy, 18 * T, 14 * T); g.beginPath(); g.arc(43 * T - cx, 31 * T - cy, 2.2 * T, 0, 7); g.stroke();
    g.font = "bold 11px system-ui,sans-serif"; g.textAlign = "center"; g.fillStyle = "rgba(60,40,10,.55)";
    LABELS.forEach(function (l) { g.fillText(l[2], l[0] * T - cx, l[1] * T - cy + 4); }); g.textAlign = "left";
    loot.forEach(function (it) { if (it.got) return; var x = it.x * T - cx, y = it.y * T - cy + Math.sin(tm * 4 + it.x) * 2; g.fillStyle = "rgba(255,230,120,.5)"; g.beginPath(); g.arc(x, y, 13, 0, 7); g.fill(); g.font = "18px sans-serif"; g.textAlign = "center"; g.fillText(it.e, x, y + 6); g.textAlign = "left"; });
    gs.forEach(function (e) {
      var col = e.mode === "chase" ? "255,40,50" : (e.meter > 0.05 ? "255,160,40" : "255,235,90");
      var n = 22, pts = [[e.x * T - cx, e.y * T - cy]], rng = e.range;
      for (var k = 0; k <= n; k++) { var a = e.a - e.fov + (2 * e.fov) * k / n, d = 0; while (d < rng && !opaque(Math.floor(e.x + Math.cos(a) * d), Math.floor(e.y + Math.sin(a) * d))) d += 0.2; pts.push([(e.x + Math.cos(a) * d) * T - cx, (e.y + Math.sin(a) * d) * T - cy]); }
      g.fillStyle = "rgba(" + col + ",.26)"; g.beginPath(); pts.forEach(function (p, i) { if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); }); g.closePath(); g.fill();
    });
    gs.forEach(function (e) {
      var x = e.x * T - cx, y = e.y * T - cy;
      g.fillStyle = "rgba(0,0,0,.25)"; g.beginPath(); g.ellipse(x, y + 10, 11, 5, 0, 0, 7); g.fill();
      g.fillStyle = e.k.c; g.beginPath(); g.arc(x, y, 12, 0, 7); g.fill(); g.strokeStyle = "#222"; g.lineWidth = 2; g.stroke();
      if (e.k.head && head.complete && head.naturalWidth) { g.save(); g.beginPath(); g.arc(x, y, 11, 0, 7); g.clip(); g.drawImage(head, x - 12, y - 14, 24, 30); g.restore(); }
      else { g.font = "15px sans-serif"; g.textAlign = "center"; g.fillText(e.k.e, x, y + 5); g.textAlign = "left"; }
      g.fillStyle = "#222"; g.beginPath(); g.arc(x + Math.cos(e.a) * 9, y + Math.sin(e.a) * 9, 2.5, 0, 7); g.fill();
      if (e.mode === "chase") { g.fillStyle = "#ff2a38"; g.font = "bold 22px sans-serif"; g.textAlign = "center"; g.fillText("!", x, y - 18); g.textAlign = "left"; }
      else if (e.meter > 0.05) { g.fillStyle = "#ffb02e"; g.fillRect(x - 12, y - 20, 24 * Math.min(1, e.meter), 4); g.strokeStyle = "#222"; g.lineWidth = 1; g.strokeRect(x - 12, y - 20, 24, 4); }
    });
    var px = P.x * T - cx, py = P.y * T - cy, sn = sneaking();
    g.fillStyle = "rgba(0,0,0,.25)"; g.beginPath(); g.ellipse(px, py + 9, 9, 4, 0, 0, 7); g.fill();
    g.globalAlpha = sn ? 0.72 : 1; g.fillStyle = "#e08a2c"; g.beginPath(); g.arc(px, py, sn ? 9 : 11, 0, 7); g.fill(); g.strokeStyle = "#5a3210"; g.lineWidth = 2; g.stroke();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(px + Math.cos(P.a) * 5 - 3, py + Math.sin(P.a) * 5 - 2, 2.2, 0, 7); g.arc(px + Math.cos(P.a) * 5 + 3, py + Math.sin(P.a) * 5 - 2, 2.2, 0, 7); g.fill();
    g.fillStyle = "#222"; g.fillRect(px - 8, py - 12, 16, 4); g.globalAlpha = 1;
    // HUD
    var ms = 2, mx = W - MW * ms - 6, my = 6; g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(mx - 2, my - 2, MW * ms + 4, MH * ms + 4);
    for (var rr = 0; rr < MH; rr++) for (var cc = 0; cc < MW; cc++) { var tt = MAP[rr][cc]; if (tt === "#") continue; g.fillStyle = tt === "G" ? "#2f5f2f" : (tt === "E" ? (exitOpen ? "#2fb36b" : "#d62839") : "#c9ccd2"); g.fillRect(mx + cc * ms, my + rr * ms, ms, ms); }
    loot.forEach(function (it) { if (!it.got) { g.fillStyle = "#ffd23f"; g.fillRect(mx + it.x * ms - 1, my + it.y * ms - 1, 3, 3); } });
    gs.forEach(function (e) { if (Math.hypot(e.x - P.x, e.y - P.y) < 12 || e.mode === "chase") { g.fillStyle = "#ff3040"; g.fillRect(mx + e.x * ms - 1, my + e.y * ms - 1, 3, 3); } });
    g.fillStyle = "#4fc3ff"; g.fillRect(mx + P.x * ms - 1.5, my + P.y * ms - 1.5, 4, 4);
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(6, 6, 26 * loot.length + 6, 28);
    loot.forEach(function (it, i) { g.globalAlpha = it.got ? 1 : 0.3; g.font = "18px sans-serif"; g.fillText(it.e, 9 + i * 26, 27); }); g.globalAlpha = 1;
    if (sn) { g.fillStyle = "rgba(95,176,143,.9)"; g.font = "bold 11px system-ui"; g.fillText("🤫 тихо", 8, 50); }
    if (msgT > 0 && msg) {
      g.font = "bold 14px system-ui,sans-serif"; var words = msg.split(" "), lines = [], cur = "";
      words.forEach(function (w) { var t2 = cur ? cur + " " + w : w; if (g.measureText(t2).width > W - 50 && cur) { lines.push(cur); cur = w; } else cur = t2; }); lines.push(cur);
      var bh = lines.length * 18 + 14; g.globalAlpha = Math.min(1, msgT * 2); g.fillStyle = "rgba(0,0,0,.75)"; g.fillRect(16, H - bh - 12, W - 32, bh); g.fillStyle = "#fff"; g.textAlign = "center";
      lines.forEach(function (l, i) { g.fillText(l, W / 2, H - bh - 12 + 21 + i * 18); }); g.textAlign = "left"; g.globalAlpha = 1;
    }
    if (grace > 0 && st === "play") { g.fillStyle = "#ffd23f"; g.font = "bold 36px system-ui"; g.textAlign = "center"; g.fillText(Math.ceil(grace), W / 2, 96); g.textAlign = "left"; }
    if (joy) { g.strokeStyle = "rgba(255,255,255,.4)"; g.lineWidth = 3; g.beginPath(); g.arc(joy.ox, joy.oy, 42, 0, 7); g.stroke(); g.fillStyle = "rgba(255,255,255,.35)"; g.beginPath(); g.arc(joy.ox + joy.x * 40, joy.oy + joy.y * 40, 18, 0, 7); g.fill(); }
  }

  /* ---------- керування ---------- */
  var KM = { ArrowLeft: "L", ArrowRight: "R", ArrowUp: "U", ArrowDown: "D", a: "L", d: "R", w: "U", s: "D", A: "L", D: "R", W: "U", S: "D" };
  addEventListener("keydown", function (e) { if (KM[e.key]) { keys[KM[e.key]] = true; e.preventDefault(); } else if (e.key === "Shift" || e.key === " ") { keys[e.key] = true; e.preventDefault(); } });
  addEventListener("keyup", function (e) { if (KM[e.key]) keys[KM[e.key]] = false; else if (e.key === "Shift" || e.key === " ") keys[e.key] = false; });
  function pt(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
  cv.addEventListener("pointerdown", function (e) { var p = pt(e); joy = { id: e.pointerId, ox: p[0], oy: p[1], x: 0, y: 0, m: 0 }; try { cv.setPointerCapture(e.pointerId); } catch (x) {} SFXLIB.ac(); });
  cv.addEventListener("pointermove", function (e) { if (!joy || joy.id !== e.pointerId) return; var p = pt(e), dx = p[0] - joy.ox, dy = p[1] - joy.oy, d = Math.hypot(dx, dy), m = Math.min(1, d / 40); joy.m = m; joy.x = d ? dx / d * m : 0; joy.y = d ? dy / d * m : 0; });
  function jend(e) { if (joy && joy.id === e.pointerId) joy = null; }
  cv.addEventListener("pointerup", jend); cv.addEventListener("pointercancel", jend);
  $("sneak").addEventListener("click", function () { sneakBtn = !sneakBtn; this.classList.toggle("on", sneakBtn); });
  SFXLIB.bind($("snd"));
  $("again").onclick = function () { load(0); intro(); };
  var last = 0;
  function frame(t) { var dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t; update(dt); render(); requestAnimationFrame(frame); }
  load(Math.min(saved, LV.length - 1)); intro(); requestAnimationFrame(frame);
  window.__b = {
    tick: function (dt) { update(dt); render(); },
    get s() { return { st: st, lvl: lvl, P: P, got: got, total: loot.length, exitOpen: exitOpen, gs: gs.map(function (e) { return { x: e.x, y: e.y, mode: e.mode, meter: e.meter }; }), loot: loot }; },
    go: function (l) { load(l); st = "play"; $("ov").hidden = true; }, put: function (x, y, a) { P.x = x; P.y = y; if (a !== undefined) P.a = a; }, grace: function (v) { grace = v; }, keys: keys, LV: LV
  };
})();
