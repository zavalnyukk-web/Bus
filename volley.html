<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f2238">
<title>Кунівські куниці: волейбол 6×6</title>
<style>
  :root { --gold:#E8B923; --navy:#0f2238; --ink:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; background:#08121f; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; touch-action:none; }
  body { display:flex; flex-direction:column; align-items:center; padding:8px 12px 12px; gap:8px; }
  header { width:100%; max-width:460px; display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:14px; font-weight:700; }
  header a { color:var(--gold); text-decoration:none; }
  .wrap { position:relative; width:min(100%, 460px, calc((100vh - 210px) * 360 / 440)); aspect-ratio:360/440; min-width:260px; }
  @supports (height:100dvh) { .wrap { width:min(100%, 460px, calc((100dvh - 210px) * 360 / 440)); } }
  canvas { position:absolute; inset:0; width:100%; height:100%; border-radius:14px; display:block; }
  .ov { position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:10px; text-align:center; padding:14px; background:rgba(5,12,22,.92); border-radius:14px; overflow:auto; }
  .ov[hidden] { display:none; }
  .ov > img { width:64px; height:64px; border-radius:50%; object-fit:cover; }
  .ov h1 { margin:0; font-size:20px; color:var(--gold); } .ov p { margin:0; font-size:13px; line-height:1.4; max-width:300px; }
  .lvl { font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .go { font:inherit; font-size:16px; font-weight:700; padding:11px 22px; border:0; border-radius:12px; background:var(--gold); color:#241a00; cursor:pointer; }
  .go.sec { background:#14304d; color:#fff; border:1px solid #2c4a6b; }
  .ctl { width:100%; max-width:460px; display:grid; grid-template-columns:1fr 1fr 1.2fr 1fr 1.3fr; gap:6px; }
  .ctl button { font:inherit; font-size:20px; padding:14px 4px; border-radius:12px; border:1px solid #2c4a6b; background:#14304d; color:#fff; cursor:pointer; touch-action:none; position:relative; overflow:hidden; }
  .ctl button.on, .ctl button:active { background:#1f4a78; }
  .ctl .jump { background:var(--gold); color:#241a00; border-color:var(--gold); font-weight:700; font-size:14px; }
  .ctl .hit { background:#2d7dd2; border-color:#2d7dd2; font-weight:700; font-size:14px; }
  .ctl .skill { background:#5a2d7a; border-color:#7d3fa8; font-weight:700; font-size:13px; }
  .ctl .skill.cd { opacity:.55; }
  .ctl .skill .bar { position:absolute; left:0; bottom:0; height:3px; background:var(--gold); transition:width .1s linear; }
  .snd { font:inherit; font-size:12px; font-weight:700; padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff; cursor:pointer; white-space:nowrap; }
  .hb { display:flex; gap:5px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .trophy { font-size:12px; color:var(--gold); white-space:nowrap; }
  .tourbadge { font-size:11px; padding:3px 7px; border-radius:6px; background:#14304d; border:1px solid #2c4a6b; color:#fff; white-space:nowrap; }
  .team { width:100%; max-width:460px; display:flex; justify-content:space-between; gap:4px; font-size:10.5px; }
  .chip { flex:1; padding:4px 3px; border-radius:8px; background:#12283f; border:1px solid #23405e; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip.act { outline:2px solid var(--gold); }
  .chip b { display:block; font-size:11px; }
  .chip small { opacity:.75; font-size:9.5px; }
  .pick { display:grid; grid-template-columns:1fr 1fr; gap:6px; width:100%; max-width:360px; max-height:300px; overflow-y:auto; }
  .card { background:#12283f; border:2px solid #23405e; border-radius:10px; padding:6px 7px; text-align:left; cursor:pointer; font-size:11px; line-height:1.25; position:relative; }
  .card.sel { border-color:var(--gold); background:#1c3a5c; }
  .card.super { border-color:#E8B923; box-shadow:0 0 8px rgba(232,185,35,.45); }
  .card b { display:block; font-size:12px; margin-bottom:1px; }
  .card small { opacity:.8; display:block; }
  .card .masktag { display:inline-block; margin-top:2px; padding:1px 5px; border-radius:5px; font-size:9.5px; font-weight:700; }
  .tabs { display:flex; gap:5px; margin-bottom:4px; flex-wrap:wrap; justify-content:center; }
  .tabs button { font:inherit; font-size:11px; padding:5px 9px; border-radius:8px; border:1px solid #2c4a6b; background:#14304d; color:#fff; cursor:pointer; }
  .tabs button.on { background:var(--gold); color:#241a00; border-color:var(--gold); font-weight:700; }
  .row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .panel { width:100%; max-width:340px; max-height:230px; overflow:auto; text-align:left; display:flex; flex-direction:column; gap:6px; }
  .item { background:#12283f; border:1px solid #23405e; border-radius:8px; padding:7px 9px; font-size:12px; line-height:1.35; }
  .item b { font-size:13px; }
  .item.done { border-color:var(--gold); background:#1c3a5c; }
  .item .meta { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:3px; }
  .item .meta button { font:inherit; font-size:11px; padding:4px 10px; border-radius:6px; border:0; background:var(--gold); color:#241a00; font-weight:700; cursor:pointer; }
  .item .meta button:disabled { background:#2c4a6b; color:#9ab; cursor:not-allowed; }
  .bar2 { height:5px; background:#0a1729; border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar2 > i { display:block; height:100%; background:var(--gold); }
  .maskpick { display:grid; grid-template-columns:1fr 1fr; gap:5px; width:100%; max-width:340px; }
  .maskopt { padding:5px 7px; border-radius:7px; background:#12283f; border:1px solid #23405e; font-size:11px; cursor:pointer; text-align:left; }
  .maskopt.sel { border-color:var(--gold); background:#1c3a5c; }
  .maskopt.locked { opacity:.4; cursor:not-allowed; }
  .mvp-row { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-radius:8px; background:#12283f; border:1px solid #23405e; font-size:12px; }
  .mvp-row.gold { border-color:var(--gold); background:#1c3a5c; }
  .mvp-row .pts { color:var(--gold); font-weight:700; }
  .tourgrid { display:grid; grid-template-columns:1fr; gap:8px; width:100%; max-width:300px; }
  .tourbtn { padding:12px 14px; border-radius:12px; border:2px solid #2c4a6b; background:#14304d; color:#fff; font:inherit; font-size:14px; font-weight:700; cursor:pointer; text-align:left; display:flex; justify-content:space-between; align-items:center; }
  .tourbtn.on { border-color:var(--gold); background:#1c3a5c; }
  .tourbtn small { display:block; font-size:11px; opacity:.75; font-weight:400; margin-top:2px; }
</style>
</head>
<body>
<header>
  <a href="./">← На сайт</a>
  <span id="lvlname" style="font-size:12px"></span>
  <span class="hb">
    <span class="tourbadge" id="tourbadge">👥</span>
    <span class="trophy" id="trophy">🏆 0</span>
    <button class="snd" id="vw" type="button" aria-label="Вигляд">3D</button>
    <button class="snd" id="voice" type="button" aria-label="Озвучка імен">🔊</button>
    <button class="snd" id="snd" type="button" aria-label="Звук"></button>
  </span>
</header>
<div class="wrap">
  <canvas id="c" width="360" height="440" aria-label="Гра у волейбол 6 на 6"></canvas>
  <div class="ov" id="ov">
    <div id="ovContent"></div>
    <div class="row" id="ovBtns"></div>
  </div>
</div>
<div class="team" id="team"></div>
<div class="ctl">
  <button id="bl" type="button" aria-label="Вліво">◀</button>
  <button id="bj" class="jump" type="button">Стрибок</button>
  <button id="bh" class="hit" type="button">Удар</button>
  <button id="bs" class="skill" type="button">Скіл<span class="bar" id="cdbar" style="width:0"></span></button>
  <button id="br" type="button" aria-label="Вправо">▶</button>
</div>
<script src="sfx.js"></script>
<script src="diff.js"></script>
<script src="config.js"></script>
<script src="track.js"></script>
<script>
(function () {
  "use strict";
  var cv = document.getElementById("c"), g = cv.getContext("2d");
  var W = 360, H = 440, FLOOR = 392, NETX = 180, NETTOP = 286;
  var $ = function (i) { return document.getElementById(i); };
  function save(k, v) { try { localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }

  /* ---------- ГРАВЦІ ---------- */
  var PLAYERS = [
    { id:"shyshkina", n:"Шишкіна Віталіна", team:"girls" },
    { id:"zav_d", n:"Завальнюк Дарина", team:"girls", super:true, superSkill:"lightning" },

  ];

  var MASKS = [
    { id:"wind",   n:"Вітер",   c:"#4ad9a4", skill:"dash",     sd:"Ривок",        d:"швидкість +25%",         cool:180, need:0 },
    { id:"thunder",n:"Грім",    c:"#d94a4a", skill:"block",    sd:"Блок",         d:"сила удару +30%",        cool:240, need:0 },
    { id:"mountain",n:"Гора",   c:"#8a4ad9", skill:"superjump",sd:"Суперстрибок", d:"стрибок +25%",           cool:200, need:0 },
    { id:"moon",   n:"Місяць",  c:"#4a90d9", skill:"ace",      sd:"Ейс",          d:"точність +40%",          cool:260, need:0 },
    { id:"fire",   n:"Вогонь",  c:"#e8842e", skill:"boom",     sd:"Вибух",        d:"сила +15%, швид. +10%",  cool:220, need:0 },
    { id:"star",   n:"Зоря",    c:"#e8b923", skill:"tp",       sd:"Телепорт",     d:"швид. +15%, стриб. +15%",cool:200, need:0 },
    { id:"lion",   n:"Лев",     c:"#c9a227", skill:"roar",     sd:"Рев",          d:"суперники завмирають",   cool:300, need:2 },
    { id:"wave",   n:"Хвиля",   c:"#2d9dd2", skill:"wave",     sd:"Хвиля",        d:"м'яч по дузі",           cool:240, need:3 },
    { id:"phoenix",n:"Фенікс",  c:"#ff6b35", skill:"rebirth",  sd:"Відродження",  d:"наступний удар +50%",    cool:280, need:4 },
    { id:"frost",  n:"Крига",   c:"#7fd4e8", skill:"freeze",   sd:"Заморозка",    d:"суперники -50% швид.",   cool:300, need:5 },
    { id:"tornado",n:"Смерч",   c:"#8a8a9e", skill:"whirl",    sd:"Вихор",        d:"м'яч крутиться",         cool:260, need:6 },
    { id:"crystal",n:"Кристал", c:"#a0e8ff", skill:"crystal",  sd:"Кристал",      d:"щит усій команді",       cool:340, need:7 },
    { id:"dragon", n:"Дракон",  c:"#e84a4a", skill:"dragon",   sd:"Подих дракона",d:"вогняний удар",          cool:320, need:9 },
    { id:"lightning",n:"Блискавка",c:"#ffe15a",skill:"lightning",sd:"Блискавка", d:"суперсила ⚡",           cool:360, need:0, superOnly:true }
  ];

  var CHALLENGES = [
    { id:"streak5",  n:"Забий 5 очок поспіль",              goal:5, rew:2, key:"streak" },
    { id:"clean",    n:"Виграй матч без програних очок",    goal:1, rew:3, key:"clean" },
    { id:"skills10", n:"Використай 10 скілів за день",      goal:10,rew:1, key:"skills" },
    { id:"combo5",   n:"Зроби 5 комбо ×3+",                 goal:5, rew:2, key:"combo" },
    { id:"allmasks", n:"Виграй матч, використавши 6 різних масок", goal:1, rew:3, key:"allmasks" },
    { id:"eachskill",n:"Використай 13 різних типів скілів", goal:13,rew:2, key:"types" }
  ];
  var ACHS = [
    { id:"firstwin", n:"Перша перемога",       d:"Виграй перший матч",        goal:1,  key:"wins" },
    { id:"wins10",   n:"10 перемог",            d:"Виграй 10 матчів",          goal:10, key:"wins" },
    { id:"wins25",   n:"25 перемог",            d:"Виграй 25 матчів",          goal:25, key:"wins" },
    { id:"allunlock",n:"Колекціонер",           d:"Відкрий усі 13 масок",      goal:13, key:"unlocked" },
    { id:"maxupg",   n:"Майстер масок",         d:"Прокачай будь-яку маску до 3", goal:1, key:"maxupg" },
    { id:"combo10",  n:"Комбо-майстер",         d:"Зроби 10 комбо ×3+",        goal:10, key:"comboTotal" },
    { id:"champion", n:"Чемпіон турніру",       d:"Пройди всі 3 матчі",        goal:1,  key:"champion" },
    { id:"dailymaster",n:"Денний герой",        d:"Виконай 3 щоденні виклики", goal:3,  key:"dailyDone" }
  ];

  var OPP0 = [
    { name:"Сусіди-новачки", speed:1.7, err:40, jump:0.55, color:"#4a90d9", txt:"Розминка! Перші суперники ще вчаться грати." },
    { name:"Збірна району",  speed:2.3, err:26, jump:0.8,  color:"#d94a4a", txt:"Серйозніші суперники швидше біжать до м’яча." },
    { name:"Чемпіони області", speed:2.9, err:14, jump:1,  color:"#8a4ad9", txt:"Фінал! Суперник майже не помиляється." }
  ];
  var OPP = [], TARGET = 7, DIFFX = { sp:1, er:1, jp:1 };

  var lineup = [];
  var totalWins = 0, upgrades = {}, achDone = {}, champDone = false;
  var todayKey, dailyState, stats = { comboTotal: 0, rating: {} };
  var tournament = "mix";
  var tourData = { girls: { level:0, wins:0 }, boys: { level:0, wins:0 }, mix: { level:0, wins:0 } };
  var voiceOn = true;

  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
  function initDaily() {
    todayKey = todayStr();
    dailyState = load("bus.volley.daily", null);
    if (!dailyState || dailyState.date !== todayKey) {
      var pool = CHALLENGES.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 3);
      dailyState = { date: todayKey, ids: pool.map(function(c){return c.id;}), prog: {}, done: {}, claimed: {}, dailyDone: 0 };
      save("bus.volley.daily", dailyState);
    }
  }
  function dailyChallenge(id) { return CHALLENGES.filter(function(c){return c.id===id;})[0]; }
  function dailyAdd(key, add) {
    if (!dailyState) return;
    dailyState.ids.forEach(function (id) {
      var c = dailyChallenge(id); if (!c || c.key !== key) return;
      if (dailyState.done[id]) return;
      dailyState.prog[id] = Math.min(c.goal, (dailyState.prog[id] || 0) + add);
      if (dailyState.prog[id] >= c.goal) dailyState.done[id] = true;
    });
    save("bus.volley.daily", dailyState);
  }
  function dailySet(key, value) {
    if (!dailyState) return;
    dailyState.ids.forEach(function (id) {
      var c = dailyChallenge(id); if (!c || c.key !== key) return;
      if (dailyState.done[id]) return;
      dailyState.prog[id] = Math.min(c.goal, value);
      if (dailyState.prog[id] >= c.goal) dailyState.done[id] = true;
    });
    save("bus.volley.daily", dailyState);
  }
  function claimDaily(id) {
    var c = dailyChallenge(id); if (!c || !dailyState.done[id] || dailyState.claimed[id]) return;
    dailyState.claimed[id] = true; dailyState.dailyDone = (dailyState.dailyDone || 0) + 1;
    totalWins += c.rew; save("bus.volley.wins", totalWins); save("bus.volley.daily", dailyState);
    trophyHud(); checkAch(); SFXLIB.seq([660, 880, 1200], 0.1);
    renderDaily();
  }

  function initStats() {
    stats = load("bus.volley.stats2", { comboTotal: 0, rating: {} });
    if (!stats.rating) stats.rating = {};
    upgrades = load("bus.volley.upgrades", {});
    achDone = load("bus.volley.ach", {});
    champDone = !!load("bus.volley.champ", false);
    tourData = load("bus.volley.tours", tourData);
    if (!tourData.girls) tourData = { girls: { level:0, wins:0 }, boys: { level:0, wins:0 }, mix: { level:0, wins:0 } };
    tournament = load("bus.volley.tour", "mix");
  }
  function upgLevel(id) { return upgrades[id] || 0; }
  function upgCost(l) { return l === 0 ? 3 : l === 1 ? 6 : 0; }

  function checkAch() {
    var unlockedCount = MASKS.filter(function(m){return !m.superOnly && totalWins >= m.need;}).length;
    var maxUpg = MASKS.some(function (m) { return upgLevel(m.id) >= 3; });
    var dailyDone = dailyState ? Object.keys(dailyState.done || {}).filter(function(k){return dailyState.done[k];}).length : 0;
    var ctx = { wins: totalWins, unlocked: unlockedCount, maxupg: maxUpg ? 1 : 0, comboTotal: stats.comboTotal || 0, champion: champDone ? 1 : 0, dailyDone: dailyDone };
    ACHS.forEach(function (a) {
      if (achDone[a.id]) return;
      if ((ctx[a.key] || 0) >= a.goal) { achDone[a.id] = true; save("bus.volley.ach", achDone); SFXLIB.seq([880, 1100, 1400], 0.1); }
    });
  }

  function applyDiff() {
    TARGET = DIFF.pick ? DIFF.pick(5, 7, 9) : 7;
    OPP = OPP0.map(function (b) {
      var L = {}; for (var k in b) L[k] = b[k];
      L.speed = b.speed * DIFFX.sp; L.err = b.err * DIFFX.er; L.jump = Math.min(1, b.jump * DIFFX.jp);
      return L;
    });
  }
  applyDiff();
  var head = new Image(); head.src = "kunytsi-head.jpg";
  var lvl = 0, saved = 0, sy = 0, so = 0, run = false, acc = 0, last = 0, wait = 0, msg = "", msgT = 0;
  var particles = [], flashes = [], combo = 0, comboT = 0, rally = 0;
  var active = 0, you = [], opp = [], ball = { x:90, y:150, vx:0, vy:0, spin:0 };
  var keys = { l:0, r:0 }, jumpReq = 0, hitReq = 0, skillReq = 0, view3d = true;
  var aiErr = 0, oppFreeze = 0, oppSlow = 0, teamShield = 0, nextHitBoost = 0;
  var cleanMatch = true, matchSkillUsed = {}, matchMasksUsed = {}, skillTypesToday = {};
  var mvpScores = {};

  try {
    var ls = load("bus.volley.lineup2", null);
    if (Array.isArray(ls) && ls.length === 6) lineup = ls;
  } catch (e) {}
  initStats(); initDaily();
  skillTypesToday = load("bus.volley.skilltypes." + todayKey, {});

  if (!lineup || lineup.length !== 6) {
    lineup = [
      { playerId:"zav_d", maskId:"lightning" },
      { playerId:"shyshkina", maskId:"wind" },
      { playerId:"honchar", maskId:"thunder" },
      { playerId:"ivchuk", maskId:"moon" },
      { playerId:"kondrat", maskId:"fire" },
      { playerId:"zav_v", maskId:"lightning" }
    ];
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function maskUnlocked(m) { return !m.superOnly && totalWins >= m.need; }
  function maskById(id) { return MASKS.filter(function(m){return m.id===id;})[0]; }
  function playerById(id) { return PLAYERS.filter(function(p){return p.id===id;})[0]; }
  function tourLabel() { return tournament === "girls" ? "👧 Дівчата" : tournament === "boys" ? "👦 Хлопці" : "👥 Мікс"; }

  function speakName(name) {
    if (!voiceOn) return;
    try {
      if (window.speechSynthesis) {
        var u = new SpeechSynthesisUtterance(name);
        u.lang = "uk-UA"; u.rate = 1.05; u.pitch = 1.05; u.volume = 0.7;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      } else {
        SFXLIB.tone(700, 0.1, "sine", 0.12);
      }
    } catch (e) {}
  }

  function mkPlayer(x, side, idx, entry) {
    var mask = maskById(entry.maskId) || MASKS[0];
    var player = playerById(entry.playerId) || PLAYERS[idx];
    var role = ROLES[idx];
    return { x:x, y:FLOOR, vx:0, vy:0, side:side, idx:idx, mask:mask, role:role, player:player,
      cool:0, hitFlash:0, skCd:0, shield:0, dash:0, upg:upgLevel(mask.id),
      super:!!player.super };
  }
  function reset(server) {
    you = []; opp = [];
    var xs = [70,130,120,40,90,160], os = [290,230,240,320,270,200];
    for (var i = 0; i < 6; i++) you.push(mkPlayer(xs[i], "you", i, lineup[i]));
    for (var j = 0; j < 6; j++) opp.push(mkPlayer(os[j], "opp", j, { playerId:PLAYERS[j].id, maskId:MASKS[j%MASKS.length].id }));
    active = 2;
    ball = { x: server === "you" ? you[2].x : opp[2].x, y:150, vx:0, vy:0, spin:0 };
    wait = 70; rally = 0; aiErr = 0; combo = 0; comboT = 0;
    oppFreeze = 0; oppSlow = 0; teamShield = 0;
  }
  function hud() { $("lvlname").textContent = "Матч " + (lvl + 1) + "/" + OPP.length + ": " + OPP[lvl].name; }
  function trophyHud() { $("trophy").textContent = "🏆 " + totalWins; }
  function tourHud() { $("tourbadge").textContent = tourLabel(); }
  function newMatch(l) {
    lvl = l; sy = 0; so = 0; cleanMatch = true; matchSkillUsed = {}; matchMasksUsed = {};
    mvpScores = {};
    lineup.forEach(function (e) { mvpScores[e.playerId] = 0; });
    reset("you"); hud(); trophyHud(); tourHud(); teamBar(); draw();
  }
  function teamBar() {
    var bar = $("team"); bar.innerHTML = "";
    you.forEach(function (p, i) {
      var d = document.createElement("div"); d.className = "chip" + (i === active ? " act" : "");
      d.innerHTML = "<b style='color:" + p.mask.c + "'>" + p.player.n.split(" ")[0] + "</b><small>" + p.player.n.split(" ").slice(1).join(" ") + "</small>";
      bar.appendChild(d);
    });
  }
  function burst(x, y, col, n) { for (var i = 0; i < n; i++) particles.push({ x:x, y:y, vx:rand(-3,3), vy:rand(-4,1), life:rand(18,34), col:col }); }
  function flash(x, y, col, r) { flashes.push({ x:x, y:y, r:r||18, life:12, col:col }); }
  function addMVP(p, n) { if (p && p.player && mvpScores[p.player.id] != null) mvpScores[p.player.id] += n; }

  function captainAura() { for (var i = 0; i < you.length; i++) if (you[i].role.id === "captain") return you[i].role.aura; return 1; }
  function superBonus(p) { return p.super ? 1.25 : 1; }
  function roleSpeed(p)   { return (p.role.speed || 1) * superBonus(p); }
  function rolePower(p)   { return (p.role.power || 1) * superBonus(p); }
  function roleJump(p)    { return (p.role.jump || 1) * superBonus(p); }
  function roleAim(p)     { return (p.role.aim || 1) * superBonus(p); }
  function roleCd(p)      { return (p.role.cd || 1); }
  function upgPower(p)    { return 1 + p.upg * 0.15; }
  function upgCd(p)       { return 1 - p.upg * 0.10; }

  function stepPlayer(p, ctl, speed, left) {
    if (p.side === "opp" && oppFreeze > 0) ctl = 0;
    if (p.side === "opp" && oppSlow > 0) speed *= 0.5;
    var lo = left ? 12 : NETX + 14, hi = left ? NETX - 14 : W - 12;
    p.vx = ctl * speed; p.x = clamp(p.x + p.vx, lo, hi);
    if (p.y < FLOOR || p.vy < 0) {
      p.vy += 0.52; p.y += p.vy;
      if (p.y >= FLOOR) { p.y = FLOOR; p.vy = 0; }
    }
    if (p.cool > 0) p.cool--;
    if (p.hitFlash > 0) p.hitFlash--;
    if (p.skCd > 0) p.skCd--;
    if (p.shield > 0) p.shield--;
    if (p.dash > 0) { p.x = clamp(p.x + p.vx * 2.2, lo, hi); p.dash--; }
  }
  function skillSpeed(p) { var b = (p.mask.skill === "speed" || p.mask.skill === "dash") ? 1.25 : (p.mask.skill === "fire" || p.mask.skill === "star" ? 1.1 : 1); return b * roleSpeed(p); }
  function skillJump(p)  { var b = (p.mask.skill === "jump" || p.mask.skill === "superjump") ? 1.25 : (p.mask.skill === "star" ? 1.15 : 1); return b * roleJump(p); }
  function skillPower(p) { var b = (p.mask.skill === "power" || p.mask.skill === "block") ? 1.3 : (p.mask.skill === "fire" ? 1.15 : 1); return b * rolePower(p) * upgPower(p); }
  function skillAim(p)   { var b = (p.mask.skill === "aim" || p.mask.skill === "ace") ? 1.4 : 1; return b * roleAim(p); }

  function hitPlayer(p) {
    var dx = ball.x - p.x, dy = ball.y - (p.y - 6), d = Math.hypot(dx, dy);
    if (d < 34 + 11 && dy < 10 && p.cool <= 0) {
      var nx = dx / (d || 1), ny = dy / (d || 1);
      ball.x = p.x + nx * (34 + 11); ball.y = (p.y - 6) + ny * (34 + 11);
      var rvx = ball.vx - p.vx, rvy = ball.vy - p.vy, dot = rvx * nx + rvy * ny;
      if (dot < 0) { ball.vx -= 1.9 * dot * nx; ball.vy -= 1.9 * dot * ny; }
      ball.vy -= 2.2 * skillPower(p);
      if (p.shield > 0 || (p.side === "you" && teamShield > 0)) { ball.vx *= 1.15; ball.vy = -Math.abs(ball.vy) * 1.1; }
      var sp = Math.hypot(ball.vx, ball.vy), maxSp = 11 * skillPower(p);
      if (sp > maxSp) { ball.vx *= maxSp / sp; ball.vy *= maxSp / sp; }
      ball.spin += p.vx * 0.15 * skillAim(p);
      if (p.side === "you" && nextHitBoost > 0) { ball.vx *= 1.5; ball.vy *= 1.5; nextHitBoost = 0; flash(ball.x, ball.y, "#ff6b35", 34); }
      p.cool = 6; p.hitFlash = 8;
      burst(ball.x, ball.y, p.mask.c, 6); flash(ball.x, ball.y, p.mask.c, 20);
      SFXLIB.tone(180 + Math.random() * 90, 0.08, "triangle", 0.16, 0, 90);
      SFXLIB.noise(0.04, 0.1, 1500);
      rally++;
      if (p.side === "opp") aiErr = rand(-1, 1) * OPP[lvl].err * 0.35;
      if (p.side === "you") {
        addMVP(p, 2);
        combo++; comboT = 90;
        if (combo === 3 || (combo > 3 && combo % 3 === 0)) {
          dailyAdd("combo", 1);
          stats.comboTotal = (stats.comboTotal || 0) + 1;
          save("bus.volley.stats2", stats); checkAch();
        }
      }
    }
  }

  function predict() {
    var x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy;
    for (var i = 0; i < 260; i++) {
      vy += 0.28; x += vx; y += vy;
      if (x < 11 || x > W - 11) { vx = -vx; x = clamp(x, 11, W - 11); }
      if (y >= FLOOR - 20) return x;
    }
    return x;
  }
  function ai() {
    var O = OPP[lvl], best = null, bd = 1e9;
    var tgt = (ball.x > NETX - 10 || (ball.vx > 0 && ball.x > NETX - 70)) ? predict() + 14 + aiErr : 280;
    tgt = clamp(tgt, NETX + 20, W - 16);
    for (var i = 0; i < opp.length; i++) { var d = Math.abs(opp[i].x - tgt); if (d < bd) { bd = d; best = opp[i]; } }
    opp.forEach(function (p) {
      if (p === best) {
        var ctl = Math.abs(tgt - p.x) > 4 ? (tgt > p.x ? 1 : -1) : 0;
        if (p.y >= FLOOR && ball.x > NETX && Math.abs(ball.x - p.x) < 70 && ball.y > FLOOR - 150 && ball.y < FLOOR - 30 && ball.vy > -1 && Math.random() < O.jump * 0.18) p.vy = -9.5 * skillJump(p);
        stepPlayer(p, ctl, O.speed * skillSpeed(p), false);
      } else {
        var home = NETX + 30 + (p.idx * 22) % (W - NETX - 60);
        var c2 = Math.abs(home - p.x) > 6 ? (home > p.x ? 1 : -1) : 0;
        stepPlayer(p, c2, O.speed * 0.45 * skillSpeed(p), false);
      }
    });
  }

  function useSkill() {
    var ap = you[active];
    if (!ap || ap.skCd > 0) return false;
    var cdMul = upgCd(ap) * roleCd(ap) / captainAura();
    ap.skCd = Math.floor(ap.mask.cool * cdMul);
    var s = ap.mask.skill;
    matchSkillUsed[ap.mask.id] = true; matchMasksUsed[ap.mask.id] = true;
    dailyAdd("skills", 1);
    skillTypesToday[ap.mask.skill] = true;
    save("bus.volley.skilltypes." + todayKey, skillTypesToday);
    dailySet("types", Object.keys(skillTypesToday).length);
    addMVP(ap, 1);
    var pw = upgPower(ap) * (ap.super ? 1.25 : 1);
    if (s === "dash") {
      ap.dash = 18; ap.vx = (keys.r - keys.l || (ball.x > ap.x ? 1 : -1)) * 3;
      burst(ap.x, ap.y - 20, ap.mask.c, 12); SFXLIB.tone(700, 0.12, "sawtooth", 0.16);
    } else if (s === "block") {
      ap.shield = 90; flash(ap.x, ap.y - 20, ap.mask.c, 34); SFXLIB.tone(220, 0.18, "square", 0.18);
    } else if (s === "superjump") {
      if (ap.y >= FLOOR) ap.vy = -13.5 * pw;
      burst(ap.x, ap.y, ap.mask.c, 10); SFXLIB.tone(520, 0.14, "triangle", 0.16);
    } else if (s === "ace") {
      var dir = ball.x < NETX ? 1 : -1;
      ball.vx = dir * 12 * pw; ball.vy = -9; ball.spin += dir * 0.8;
      burst(ball.x, ball.y, ap.mask.c, 14); flash(ball.x, ball.y, ap.mask.c, 30);
      SFXLIB.tone(880, 0.12, "sine", 0.18);
    } else if (s === "boom") {
      var bx = ap.x, by = ap.y - 20;
      opp.forEach(function (o) { if (Math.hypot(o.x - bx, o.y - by) < 110) { o.x += (o.x < bx ? -30 : 30); o.vy = -4; } });
      if (Math.hypot(ball.x - bx, ball.y - by) < 130) { ball.vx = (ball.x < NETX ? 1 : -1) * 10 * pw; ball.vy = -10; }
      burst(bx, by, "#ffb347", 26); flash(bx, by, "#ffb347", 60);
      SFXLIB.tone(140, 0.25, "sawtooth", 0.22);
    } else if (s === "tp") {
      ap.x = clamp(ball.x + (ball.x < NETX ? 24 : -24), 14, W - 14);
      burst(ap.x, ap.y - 20, ap.mask.c, 16); flash(ap.x, ap.y - 20, ap.mask.c, 30);
      SFXLIB.tone(1200, 0.1, "sine", 0.16);
    } else if (s === "roar") {
      oppFreeze = Math.floor(80 * pw); burst(ap.x, ap.y - 30, "#c9a227", 24); flash(ap.x, ap.y - 20, "#c9a227", 90);
      SFXLIB.tone(110, 0.4, "sawtooth", 0.3);
    } else if (s === "wave") {
      var d2 = ball.x < NETX ? 1 : -1;
      ball.vx = d2 * 9 * pw; ball.vy = -12; ball.spin += d2 * 1.2;
      burst(ball.x, ball.y, "#2d9dd2", 16); flash(ball.x, ball.y, "#2d9dd2", 34);
      SFXLIB.tone(560, 0.18, "sine", 0.18);
    } else if (s === "rebirth") {
      nextHitBoost = Math.ceil(1.5 * pw); flash(ap.x, ap.y - 20, "#ff6b35", 40); burst(ap.x, ap.y - 20, "#ff6b35", 20);
      SFXLIB.tone(640, 0.2, "sine", 0.2);
    } else if (s === "freeze") {
      oppSlow = Math.floor(180 * pw); burst(W - 60, FLOOR - 60, "#7fd4e8", 30); flash(W - 60, FLOOR - 60, "#7fd4e8", 100);
      SFXLIB.tone(340, 0.3, "sine", 0.2);
    } else if (s === "whirl") {
      ball.spin += (ball.x < NETX ? 1 : -1) * 2.5 * pw; ball.vx *= 1.15;
      burst(ball.x, ball.y, "#8a8a9e", 18); flash(ball.x, ball.y, "#8a8a9e", 34);
      SFXLIB.tone(720, 0.15, "triangle", 0.18);
    } else if (s === "crystal") {
      teamShield = Math.floor(120 * pw); you.forEach(function (p) { flash(p.x, p.y - 20, "#a0e8ff", 34); });
      SFXLIB.tone(1500, 0.15, "sine", 0.18); SFXLIB.tone(1200, 0.15, "sine", 0.15, 0.15);
    } else if (s === "dragon") {
      var d3 = ball.x < NETX ? 1 : -1;
      ball.vx = d3 * 14 * pw; ball.vy = -10; ball.spin += d3 * 0.6;
      burst(ball.x, ball.y, "#e84a4a", 30); flash(ball.x, ball.y, "#e84a4a", 60);
      SFXLIB.tone(90, 0.4, "sawtooth", 0.3); SFXLIB.noise(0.3, 0.25, 400);
    } else if (s === "lightning") {
      for (var i = 0; i < 14; i++) {
        var lx = NETX + 20 + Math.random() * (W - NETX - 40);
        flashes.push({ x:lx, y:FLOOR - 60 - Math.random() * 100, r:10 + Math.random()*30, life:14, col:"#ffe15a" });
      }
      opp.forEach(function (o) { o.vy = -6; o.x = clamp(o.x + (Math.random() - 0.5) * 40, NETX + 20, W - 16); });
      if (ball.x > NETX) { ball.vx = 14 * pw; ball.vy = -11; }
      burst(W - 60, FLOOR - 100, "#ffe15a", 40);
      SFXLIB.tone(1200, 0.3, "sawtooth", 0.3); SFXLIB.noise(0.3, 0.3, 2000);
    }
    return true;
  }

  function update() {
    var ap = you[active];
    if (ap && ap.skCd > 0) {
      var full = Math.floor(ap.mask.cool * upgCd(ap) * roleCd(ap) / captainAura());
      var pct = 1 - ap.skCd / full;
      $("cdbar").style.width = (pct * 100) + "%"; $("bs").classList.toggle("cd", ap.skCd > 0);
    } else if (ap) { $("cdbar").style.width = "0%"; $("bs").classList.toggle("cd", false); }

    if (oppFreeze > 0) oppFreeze--;
    if (oppSlow > 0) oppSlow--;
    if (teamShield > 0) teamShield--;

    if (wait > 0) { wait--; stepPlayer(you[active], keys.r - keys.l, 4.6 * skillSpeed(you[active]), true); return; }
    if (skillReq) { skillReq = 0; useSkill(); }
    if (jumpReq && ap.y >= FLOOR) { ap.vy = -9.5 * skillJump(ap); }
    jumpReq = 0;

    stepPlayer(ap, keys.r - keys.l, 4.6 * skillSpeed(ap), true);
    you.forEach(function (p) {
      if (p === ap) return;
      var home = 60 + (p.idx * 30) % (NETX - 60);
      var c = Math.abs(home - p.x) > 8 ? (home > p.x ? 1 : -1) : 0;
      stepPlayer(p, c, 2.2 * skillSpeed(p), true);
    });
    ai();

    if (hitReq) {
      hitReq = 0;
      var dx = ball.x - ap.x, dy = ball.y - ap.y;
      if (Math.hypot(dx, dy) < 90) {
        var dir = ball.x < NETX ? 1 : -1;
        ball.vx = dir * (7.5 * skillPower(ap)) + ap.vx * 0.5;
        ball.vy = -8.5 * skillJump(ap) - rand(0, 2);
        ball.spin += dir * 0.4 * skillAim(ap);
        if (nextHitBoost > 0) { ball.vx *= 1.5; ball.vy *= 1.5; nextHitBoost = 0; }
        burst(ball.x, ball.y, ap.mask.c, 10); flash(ball.x, ball.y, ap.mask.c, 26);
        SFXLIB.tone(420, 0.1, "square", 0.18);
        ap.cool = 10; addMVP(ap, 1);
      }
    }

    ball.vy += 0.28; ball.x += ball.vx; ball.y += ball.vy;
    ball.vx *= 0.999; ball.spin *= 0.985; ball.vx += ball.spin * 0.06;
    if (ball.x < 11) { ball.x = 11; ball.vx = Math.abs(ball.vx) * 0.9; }
    if (ball.x > W - 11) { ball.x = W - 11; ball.vx = -Math.abs(ball.vx) * 0.9; }
    if (ball.y > NETTOP - 11 && Math.abs(ball.x - NETX) < 14) {
      if (ball.y < NETTOP + 6) { ball.vy = -Math.abs(ball.vy) * 0.8; ball.y = NETTOP - 11; }
      else { ball.vx = (ball.x < NETX ? -1 : 1) * Math.max(1.5, Math.abs(ball.vx) * 0.8); ball.x = NETX + (ball.x < NETX ? -1 : 1) * 14; }
    }
    you.forEach(hitPlayer); opp.forEach(hitPlayer);

    if (ball.y >= FLOOR + 6) {
      var winner = ball.x < NETX ? "opp" : "you";
      if (winner === "you") {
        sy++; combo = 0; dailySet("streak", sy);
        var scorer = you.filter(function(p){return Math.abs(p.x - ball.x) < 80;}).sort(function(a,b){return Math.abs(a.x-ball.x)-Math.abs(b.x-ball.x);})[0];
        if (scorer) addMVP(scorer, 3);
      } else {
        so++; combo = 0; cleanMatch = false;
        if (you.some(function(p){return p.mask.id==="phoenix";})) { nextHitBoost = 1; flash(W/2, H/2, "#ff6b35", 100); }
      }
      SFXLIB.noise(0.18, 0.3, 500); burst(ball.x, FLOOR, "#fff", 14);
      if (sy >= TARGET) { win(); return; }
      if (so >= TARGET) { lose(); return; }
      msg = winner === "you" ? "Очко куницям!" : "Очко суперникам"; msgT = 70;
      reset(winner);
    }
    particles.forEach(function (p) { p.vy += 0.18; p.x += p.vx; p.y += p.vy; p.life--; });
    particles = particles.filter(function (p) { return p.life > 0; });
    flashes.forEach(function (f) { f.life--; f.r += 2; });
    flashes = flashes.filter(function (f) { return f.life > 0; });
    if (comboT > 0) comboT--; else combo = 0;
  }

  /* ---------- draw ---------- */
  function slime(s, col, isYou) {
    var SR = 24;
    g.save(); g.beginPath(); g.arc(s.x, s.y, SR, Math.PI, 0); g.closePath(); g.clip();
    var sg = g.createRadialGradient(s.x - 10, s.y - 20, 3, s.x, s.y - 6, SR + 4);
    sg.addColorStop(0, "rgba(255,255,255,.4)"); sg.addColorStop(0.4, col); sg.addColorStop(1, "rgba(0,0,0,.4)");
    g.fillStyle = col; g.fillRect(s.x - SR, s.y - SR, SR * 2, SR);
    g.fillStyle = sg; g.fillRect(s.x - SR, s.y - SR, SR * 2, SR);
    if (isYou && head.complete && head.naturalWidth) g.drawImage(head, s.x - SR, s.y - SR, SR * 2, SR * 2);
    g.restore();
    g.strokeStyle = "rgba(0,0,0,.4)"; g.lineWidth = 2; g.beginPath(); g.arc(s.x, s.y, SR, Math.PI, 0); g.closePath(); g.stroke();
    if (isYou && s.super) {
      g.strokeStyle = "#E8B923"; g.globalAlpha = .45 + .35*Math.sin(performance.now()/150); g.lineWidth = 3;
      g.beginPath(); g.arc(s.x, s.y - 4, 30, 0, 7); g.stroke(); g.globalAlpha = 1;
    } else if (isYou && you.some(function(p){return p.role.id==="captain";})) {
      g.strokeStyle = "#E8B923"; g.globalAlpha = .3 + .2*Math.sin(performance.now()/200); g.lineWidth = 2;
      g.beginPath(); g.arc(s.x, s.y - 4, 32, 0, 7); g.stroke(); g.globalAlpha = 1;
    }
    if (s.shield > 0 || (isYou && teamShield > 0)) { g.strokeStyle = "#a0e8ff"; g.lineWidth = 2; g.globalAlpha = .5 + .3*Math.sin(performance.now()/80); g.beginPath(); g.arc(s.x, s.y - 10, 34, 0, 7); g.stroke(); g.globalAlpha = 1; }
    if (!isYou) { var ex = s.x - 8, ey = s.y - 16; g.fillStyle = "#fff"; g.beginPath(); g.arc(ex, ey, 5, 0, 7); g.fill(); g.fillStyle = "#111"; g.beginPath(); g.arc(ex + clamp((ball.x - ex) / 40, -2, 2) * 2, ey + clamp((ball.y - ey) / 40, -2, 2) * 2, 2.4, 0, 7); g.fill(); }
    if (s === you[active]) { g.strokeStyle = "#E8B923"; g.lineWidth = 2; g.setLineDash([4, 4]); g.beginPath(); g.arc(s.x, s.y - 4, 34, Math.PI, 0); g.stroke(); g.setLineDash([]); }
  }
  function drawBall() {
    var bg = g.createRadialGradient(ball.x - 4, ball.y - 4, 2, ball.x, ball.y, 11); bg.addColorStop(0, "#fff"); bg.addColorStop(1, "#c9d3dc");
    g.fillStyle = bg; g.beginPath(); g.arc(ball.x, ball.y, 11, 0, 7); g.fill();
    g.strokeStyle = "#E8B923"; g.lineWidth = 2; g.beginPath(); g.arc(ball.x, ball.y, 10, 0.3, 2.4); g.stroke();
    g.strokeStyle = "#2d7dd2"; g.beginPath(); g.arc(ball.x, ball.y, 10, 3.4, 5.5); g.stroke();
  }
  function drawHud() {
    g.textAlign = "center"; g.font = "bold 28px system-ui,sans-serif";
    g.fillStyle = "#E8B923"; g.fillText(sy, 140, 46); g.fillStyle = "#fff"; g.fillText(":", 180, 45); g.fillStyle = OPP[lvl].color; g.fillText(so, 220, 46);

    var FY = 250, i, k;

      }
    }

    var lg = g.createRadialGradient(90, -10, 5, 90, -10, 160); lg.addColorStop(0, "rgba(255,240,200,.35)"); lg.addColorStop(1, "rgba(255,240,200,0)"); g.fillStyle = lg; g.fillRect(0, 0, W, FY);

    var fg = g.createLinearGradient(0, FY, 0, H); fg.addColorStop(0, "#8a5424"); fg.addColorStop(1, "#c98340"); g.fillStyle = fg;
    g.beginPath(); g.moveTo(0, FY); g.lineTo(W, FY); g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
    g.strokeStyle = "rgba(60,30,10,.35)"; g.lineWidth = 1; g.beginPath();
    for (k = -9; k <= 9; k++) { g.moveTo(180 + k * 18, FY); g.lineTo(180 + k * 52, H); }

    g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 3; g.beginPath(); g.moveTo(70, FY + 14); g.lineTo(290, FY + 14); g.lineTo(400, H - 4); g.lineTo(-40, H - 4); g.closePath(); g.stroke();
    g.beginPath(); g.moveTo(180, FY + 14); g.lineTo(180, H - 4); g.stroke();

    g.fillStyle = "#9aa7b4"; g.fillRect(NETX + 7, NETTOP + 8, 3, FLOOR - 26 - NETTOP - 8);
    g.fillStyle = "rgba(255,255,255,.14)"; g.beginPath(); g.moveTo(NETX - 8, NETTOP - 4); g.lineTo(NETX + 8, NETTOP + 8); g.lineTo(NETX + 8, NETTOP + 70); g.lineTo(NETX - 8, NETTOP + 58); g.closePath(); g.fill();
    g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 1; g.beginPath();
    for (k = 0; k <= 4; k++) { var nx = NETX - 8 + k * 4; g.moveTo(nx, NETTOP - 4 + k * 3); g.lineTo(nx, NETTOP + 58 + k * 3); }
    for (k = 1; k < 6; k++) { g.moveTo(NETX - 8, NETTOP - 4 + k * 10); g.lineTo(NETX + 8, NETTOP + 8 + k * 10); }
    g.stroke();
    g.fillStyle = "#fff"; g.beginPath(); g.moveTo(NETX - 8, NETTOP - 7); g.lineTo(NETX + 8, NETTOP + 5); g.lineTo(NETX + 8, NETTOP + 9); g.lineTo(NETX - 8, NETTOP - 3); g.closePath(); g.fill();

    function sh(x, rx, a) { g.fillStyle = "rgba(0,0,0," + a + ")"; g.beginPath(); g.ellipse(x, FLOOR + 6, rx, rx * 0.28, 0, 0, 7); g.fill(); }

    function draw3dPlayer(p, isYou) {

    var bg = g.createRadialGradient(ball.x - 4, ball.y - 5, 1, ball.x, ball.y, 12); bg.addColorStop(0, "#ffffff"); bg.addColorStop(0.6, "#e3e9ef"); bg.addColorStop(1, "#98a6b5"); g.fillStyle = bg; g.beginPath(); g.arc(ball.x, ball.y, 11, 0, 7); g.fill();
    g.strokeStyle = "#E8B923"; g.lineWidth = 2; g.beginPath(); g.arc(ball.x, ball.y, 10, 0.3 + ball.x / 40, 2.3 + ball.x / 40); g.stroke();
    g.strokeStyle = "#2d7dd2"; g.beginPath(); g.arc(ball.x, ball.y, 10, 3.4 + ball.x / 40, 5.3 + ball.x / 40); g.stroke();

    var pg = g.createLinearGradient(NETX - 12, 0, NETX - 5, 0); pg.addColorStop(0, "#c9d3dc"); pg.addColorStop(1, "#7d8996"); g.fillStyle = pg; g.fillRect(NETX - 12, NETTOP - 6, 6, FLOOR + 30 - NETTOP + 6);
    g.fillStyle = "rgba(0,0,0,.3)"; g.beginPath(); g.ellipse(NETX - 9, FLOOR + 30, 12, 4, 0, 0, 7); g.fill();

    else if (teamTab === "boys") pool.filter(function(p){return p.team==="boys";}).forEach(renderPlayer);
    else {
      if (!lineup.length) { pick.innerHTML = "<p>Склад порожній. Додай гравців.</p>"; }
      else lineup.forEach(function (entry) {
        var p = playerById(entry.playerId); var m = maskById(entry.maskId);
        if (!p) return;
        var d = document.createElement("div"); d.className = "card sel" + (p.super ? " super" : "");
        d.innerHTML = "<b>" + (p.super ? "⚡ " : "") + p.n + "</b><small>" + (p.team==="girls"?"👧":"👦") + " · " + m.n + "</small>";
        d.onclick = function () {
          lineup = lineup.filter(function(e){return e.playerId !== p.id;});
          save("bus.volley.lineup2", lineup); showTeamSelect(pendingGo);
        };
        pick.appendChild(d);
      });
    }

    $("go2").onclick = function () {
      if (lineup.length !== 6) { SFXLIB.tone(200, 0.2, "square", 0.2); return; }
      save("bus.volley.lineup2", lineup);
      pendingGo && pendingGo();
    };
  }

  function loop(now) {
    if (!run) return;
    acc += Math.min(50, now - last); last = now;
    while (acc >= 1000 / 60) { acc -= 1000 / 60; update(); if (!run) return; }
    draw(); requestAnimationFrame(loop);
  }
  function show(l, h, txt, btn) {
    $("ovContent").innerHTML = '<img src="kunytsi-logo.jpg" alt=""><div class="lvl">' + l + '</div><h1>' + h + '</h1><p>' + txt + '</p>';
    $("ovBtns").innerHTML = '<button class="go" id="go" type="button">' + btn + '</button>';
    $("ov").hidden = false;
    $("go").onclick = onGo;
    DIFF.coachFor($("ov"), /Чемпіони/.test(h) ? "final" : /Перемога/.test(h) ? "win" : /програно/.test(h) ? "lose" : "start");
  }
  function win() {
    run = false; draw();
    totalWins++; save("bus.volley.wins", totalWins);
    tourData[tournament].wins = (tourData[tournament].wins || 0) + 1;
    save("bus.volley.tours", tourData);
    if (cleanMatch) dailyAdd("clean", 1);
    if (Object.keys(matchSkillUsed).length >= 6) dailyAdd("allmasks", 1);
    trophyHud(); checkAch();
    SFXLIB.seq(lvl + 1 < OPP.length ? [523, 659, 784, 1047] : [523, 523, 523, 659, 784, 659, 784, 1047], 0.13);
    var finishWin = function () {
      if (lvl + 1 < OPP.length) { saved = Math.max(saved, lvl + 1); save("bus.volley.level", String(saved)); show("Рахунок " + sy + ":" + so, "Перемога!", "Куниці виграли матч! Далі: " + OPP[lvl + 1].name + ". Перемог: " + totalWins, "Наступний матч"); $("go").dataset.n = "next"; }
      else { saved = 0; save("bus.volley.level", "0"); champDone = true; save("bus.volley.champ", true); checkAch(); show("Рахунок " + sy + ":" + so, "Чемпіони!", "Кунівські куниці виграли турнір! Перемог: " + totalWins, "Грати ще раз"); $("go").dataset.n = "again"; }
    };
    showMvpScreen(finishWin);
  }
  function lose() {
    run = false; draw(); SFXLIB.seq([392, 330, 262, 196], 0.2);
    var finishLose = function () {
      show("Рахунок " + sy + ":" + so, "Матч програно", "Нічого, куниці не здаються! Спробуйте ще раз.", "Реванш");
      $("go").dataset.n = "retry";
    };
    showMvpScreen(finishLose);
  }
  function start() {
    if (window.trackPlay) trackPlay("volley");
    SFXLIB.tone(1400, 0.25, "sine", 0.1);
    $("ov").hidden = true; run = true; acc = 0; last = performance.now(); teamBar();
    setTimeout(function () { if (you[active]) speakName(you[active].player.n); }, 400);
    requestAnimationFrame(loop);
  }

  function onGo() {
    var n = $("go").dataset.n; $("go").dataset.n = "";
    var go = function () {
      if (n === "next") newMatch(lvl + 1); else if (n === "again") newMatch(0); else newMatch(lvl);
      start();
    };
    showTournamentSelect(go);
  }

  function hold(id, k) {
    var b = $(id);
    b.addEventListener("pointerdown", function (e) { keys[k] = 1; b.classList.add("on"); b.setPointerCapture && b.setPointerCapture(e.pointerId); e.preventDefault(); });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (ev) { b.addEventListener(ev, function () { keys[k] = 0; b.classList.remove("on"); }); });
  }
  function nextActive() {
    active = (active + 1) % you.length; teamBar();
    SFXLIB.tone(880, 0.06, "sine", 0.08);
    flash(you[active].x, you[active].y - 20, you[active].mask.c, 22);
    speakName(you[active].player.n);
  }

  var vwLabel = function () { $("vw").textContent = view3d ? "3D" : "2D"; };
  var voiceLabel = function () { $("voice").textContent = voiceOn ? "🔊" : "🔇"; };
  try { var vv = localStorage.getItem("bus.game.view"); if (vv) view3d = vv === "3d"; } catch (e) {}
  try { var vo = localStorage.getItem("bus.volley.voice"); if (vo != null) voiceOn = vo === "1"; } catch (e) {}
  $("vw").onclick = function () { view3d = !view3d; save("bus.game.view", view3d ? "3d" : "2d"); vwLabel(); draw(); };
  $("voice").onclick = function () { voiceOn = !voiceOn; save("bus.volley.voice", voiceOn ? "1" : "0"); voiceLabel(); if (voiceOn) speakName("Голос увімкнено"); };
  vwLabel(); voiceLabel();
  SFXLIB.bind($("snd"));
  DIFF.mount($("ov"), $("go"));
  DIFF.on(function () { applyDiff(); });

  hold("bl", "l"); hold("br", "r");
  $("bj").addEventListener("pointerdown", function (e) { jumpReq = 1; e.preventDefault(); });
  $("bh").addEventListener("pointerdown", function (e) { hitReq = 1; e.preventDefault(); });
  $("bs").addEventListener("pointerdown", function (e) { skillReq = 1; e.preventDefault(); });
  cv.addEventListener("pointerdown", function (e) {
    if (!run) return;
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    if (Math.abs(x - you[active].x) < 40 || x > W / 2) nextActive();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a") keys.l = 1;
    else if (e.key === "ArrowRight" || e.key === "d") keys.r = 1;
    else if (e.key === "ArrowUp" || e.key === " " || e.key === "w") { jumpReq = 1; e.preventDefault(); }
    else if (e.key === "e" || e.key === "Enter") { hitReq = 1; e.preventDefault(); }
    else if (e.key === "f" || e.key === "Shift") { skillReq = 1; e.preventDefault(); }
    else if (e.key === "Tab" || e.key === "q") { e.preventDefault(); nextActive(); }
  });
  document.addEventListener("keyup", function (e) { if (e.key === "ArrowLeft" || e.key === "a") keys.l = 0; else if (e.key === "ArrowRight" || e.key === "d") keys.r = 0; });

  var l0 = saved > 0 && saved < OPP.length ? saved : 0;
  trophyHud(); tourHud();
  newMatch(l0);
  show("Турнір · " + tourLabel(), "Кунівські куниці: 6×6", "Обери турнір і збери команду з дівчат та/або хлопців. ⚡ Завальнюк Дарина та Завальнюк Вікторія мають суперсилу. Перемог: " + totalWins, "Обрати турнір");
  window.__v = { s: function () { return { sy:sy, so:so, run:run, ball:ball, active:active, you:you, lineup:lineup, wins:totalWins, tournament:tournament, tours:tourData, mvp:mvpScores, rating:stats.rating }; }, skill: useSkill };
})();
</script>
</body>
</html>
