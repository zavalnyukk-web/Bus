<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f2238">
<title>Кунівські куниці: волейбол</title>
<style>
  :root { --gold:#E8B923; --navy:#0f2238; --ink:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; background:#08121f; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; touch-action:none; }
  body { display:flex; flex-direction:column; align-items:center; padding:8px 12px 12px; gap:8px; }
  header { width:100%; max-width:460px; display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:14px; font-weight:700; }
  header a { color:var(--gold); text-decoration:none; }
  .wrap { position:relative; width:min(100%, 460px, calc((100vh - 210px) * 360 / 440)); aspect-ratio:360/440; min-width:260px; }
  @supports (height:100dvh) { .wrap { width:min(100%, 460px, calc((100dvh - 210px) * 360 / 440)); } }
  canvas { position:absolute; inset:0; width:100%; height:100%; border-radius:14px; display:block; touch-action:none; }
  .ov { position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:10px; text-align:center; padding:14px; background:rgba(5,12,22,.92); border-radius:14px; overflow:auto; }
  .ov[hidden] { display:none; }
  .ov > img { width:64px; height:64px; border-radius:50%; object-fit:cover; }
  .ov h1 { margin:0; font-size:20px; color:var(--gold); } .ov p { margin:0; font-size:13px; line-height:1.4; max-width:300px; }
  .lvl { font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .go { font:inherit; font-size:16px; font-weight:700; padding:11px 22px; border:0; border-radius:12px; background:var(--gold); color:#241a00; cursor:pointer; }
  .go.sec { background:#14304d; color:#fff; border:1px solid #2c4a6b; }
  .ctl { width:100%; max-width:460px; display:grid; grid-template-columns:1fr 1fr 1.2fr 1fr 1.3fr; gap:6px; }
  .ctl button { font:inherit; font-size:20px; padding:14px 4px; border-radius:12px; border:1px solid #2c4a6b; background:#14304d; color:#fff; cursor:pointer; touch-action:none; position:relative; overflow:hidden; }
  .ctl button.on, .ctl button:active { background:#1f4a78; }
  .ctl .jump { background:var(--gold); color:#241a00; border-color:var(--gold); font-weight:700; font-size:14px; }
  .ctl .hit { background:#2d7dd2; border-color:#2d7dd2; font-weight:700; font-size:14px; }
  .ctl .skill { background:#5a2d7a; border-color:#7d3fa8; font-weight:700; font-size:13px; }
  .ctl .skill.cd { opacity:.55; }
  .ctl .skill .bar { position:absolute; left:0; bottom:0; height:3px; background:var(--gold); transition:width .1s linear; }
  .snd { font:inherit; font-size:12px; font-weight:700; padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff; cursor:pointer; white-space:nowrap; }
  .hb { display:flex; gap:5px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .trophy { font-size:12px; color:var(--gold); white-space:nowrap; }
  .tourbadge { font-size:11px; padding:3px 7px; border-radius:6px; background:#14304d; border:1px solid #2c4a6b; color:#fff; white-space:nowrap; }
  .team { width:100%; max-width:460px; display:flex; justify-content:space-between; gap:4px; font-size:10.5px; }
  .chip { flex:1; padding:4px 3px; border-radius:8px; background:#12283f; border:1px solid #23405e; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; touch-action:manipulation; }
  .chip.act { outline:2px solid var(--gold); }
  .chip b { display:block; font-size:11px; }
  .chip small { opacity:.75; font-size:9.5px; }
  .pick { display:grid; grid-template-columns:1fr 1fr; gap:6px; width:100%; max-width:360px; max-height:300px; overflow-y:auto; }
  .card { background:#12283f; border:2px solid #23405e; border-radius:10px; padding:6px 7px; text-align:left; cursor:pointer; font-size:11px; line-height:1.25; position:relative; }
  .card.sel { border-color:var(--gold); background:#1c3a5c; }
  .card.super { border-color:#E8B923; box-shadow:0 0 8px rgba(232,185,35,.45); }
  .card b { display:block; font-size:12px; margin-bottom:1px; }
  .card small { opacity:.8; display:block; }
  .card .masktag { display:inline-block; margin-top:2px; padding:1px 5px; border-radius:5px; font-size:9.5px; font-weight:700; }
  .card .ord { position:absolute; top:4px; right:6px; font-size:10px; font-weight:700; color:var(--gold); background:#0a1729; padding:1px 5px; border-radius:6px; }
  .tabs { display:flex; gap:5px; margin-bottom:4px; flex-wrap:wrap; justify-content:center; }
  .tabs button { font:inherit; font-size:11px; padding:5px 9px; border-radius:8px; border:1px solid #2c4a6b; background:#14304d; color:#fff; cursor:pointer; }
  .tabs button.on { background:var(--gold); color:#241a00; border-color:var(--gold); font-weight:700; }
  .row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .panel { width:100%; max-width:340px; max-height:230px; overflow:auto; text-align:left; display:flex; flex-direction:column; gap:6px; }
  .item { background:#12283f; border:1px solid #23405e; border-radius:8px; padding:7px 9px; font-size:12px; line-height:1.35; }
  .item b { font-size:13px; }
  .item.done { border-color:var(--gold); background:#1c3a5c; }
  .item .meta { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:3px; }
  .item .meta button { font:inherit; font-size:11px; padding:4px 10px; border-radius:6px; border:0; background:var(--gold); color:#241a00; font-weight:700; cursor:pointer; }
  .item .meta button:disabled { background:#2c4a6b; color:#9ab; cursor:not-allowed; }
  .bar2 { height:5px; background:#0a1729; border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar2 > i { display:block; height:100%; background:var(--gold); }
  .maskpick { display:grid; grid-template-columns:1fr 1fr; gap:5px; width:100%; max-width:340px; }
  .maskopt { padding:5px 7px; border-radius:7px; background:#12283f; border:1px solid #23405e; font-size:11px; cursor:pointer; text-align:left; }
  .maskopt.sel { border-color:var(--gold); background:#1c3a5c; }
  .maskopt.locked { opacity:.4; cursor:not-allowed; }
  .mvp-row { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-radius:8px; background:#12283f; border:1px solid #23405e; font-size:12px; }
  .mvp-row.gold { border-color:var(--gold); background:#1c3a5c; }
  .mvp-row .pts { color:var(--gold); font-weight:700; }
  .tourgrid { display:grid; grid-template-columns:1fr; gap:8px; width:100%; max-width:300px; }
  .tourbtn { padding:12px 14px; border-radius:12px; border:2px solid #2c4a6b; background:#14304d; color:#fff; font:inherit; font-size:14px; font-weight:700; cursor:pointer; text-align:left; display:flex; justify-content:space-between; align-items:center; }
  .tourbtn.on { border-color:var(--gold); background:#1c3a5c; }
  .tourbtn small { display:block; font-size:11px; opacity:.75; font-weight:400; margin-top:2px; }
  .modebar { display:flex; gap:6px; justify-content:center; margin-bottom:6px; flex-wrap:wrap; }
  .modebar button { font:inherit; font-size:12px; font-weight:700; padding:6px 14px; border-radius:8px; border:1px solid #2c4a6b; background:#14304d; color:#fff; cursor:pointer; }
  .modebar button.on { background:var(--gold); color:#241a00; border-color:var(--gold); }
  .hint { font-size:11px; opacity:.75; line-height:1.35; max-width:300px; }
</style>
</head>
<body>
<header>
  <a href="./">← На сайт</a>
  <span id="lvlname" style="font-size:12px"></span>
  <span class="hb">
    <span class="tourbadge" id="tourbadge">👥 6×6</span>

    <button class="snd" id="vw" type="button" aria-label="Вигляд">3D</button>

</header>
<div class="wrap">

  </div>
</div>
<div class="team" id="team"></div>
<div class="ctl">

  <button id="bj" class="jump" type="button">Стрибок</button>
  <button id="bh" class="hit" type="button">Удар</button>
  <button id="bs" class="skill" type="button">Скіл<span class="bar" id="cdbar" style="width:0"></span></button>
  <button id="br" type="button" aria-label="Вправо">▶</button>
</div>
<script src="sfx.js"></script>
<script src="diff.js"></script>
<script src="config.js"></script>

<script>
(function () {

  var PLAYERS = [

    { id:"thunder",n:"Грім",    c:"#d94a4a", skill:"block",    sd:"Блок",         d:"сила удару +30%",        cool:240, need:0 },
    { id:"mountain",n:"Гора",   c:"#8a4ad9", skill:"superjump",sd:"Суперстрибок", d:"стрибок +25%",           cool:200, need:0 },
    { id:"moon",   n:"Місяць",  c:"#4a90d9", skill:"ace",      sd:"Ейс",          d:"точність +40%",          cool:260, need:0 },
    { id:"fire",   n:"Вогонь",  c:"#e8842e", skill:"boom",     sd:"Вибух",        d:"сила +15%, швид. +10%",  cool:220, need:0 },
    { id:"star",   n:"Зоря",    c:"#e8b923", skill:"tp",       sd:"Телепорт",     d:"швид. +15%, стриб. +15%",cool:200, need:0 },
    { id:"lion",   n:"Лев",     c:"#c9a227", skill:"roar",     sd:"Рев",          d:"суперники завмирають",   cool:300, need:2 },
    { id:"wave",   n:"Хвиля",   c:"#2d9dd2", skill:"wave",     sd:"Хвиля",        d:"м'яч по дузі",           cool:240, need:3 },
    { id:"phoenix",n:"Фенікс",  c:"#ff6b35", skill:"rebirth",  sd:"Відродження",  d:"наступний удар +50%",    cool:280, need:4 },
    { id:"frost",  n:"Крига",   c:"#7fd4e8", skill:"freeze",   sd:"Заморозка",    d:"суперники -50% швид.",   cool:300, need:5 },
    { id:"tornado",n:"Смерч",   c:"#8a8a9e", skill:"whirl",    sd:"Вихор",        d:"м'яч крутиться",         cool:260, need:6 },
    { id:"crystal",n:"Кристал", c:"#a0e8ff", skill:"crystal",  sd:"Кристал",      d:"щит усій команді",       cool:340, need:7 },
    { id:"dragon", n:"Дракон",  c:"#e84a4a", skill:"dragon",   sd:"Подих дракона",d:"вогняний удар",          cool:320, need:9 },
    { id:"lightning",n:"Блискавка",c:"#ffe15a",skill:"lightning",sd:"Блискавка", d:"суперсила ⚡",           cool:360, need:0, superOnly:true }
  ];

  var CHALLENGES = [
    { id:"streak5",  n:"Забий 5 очок поспіль",              goal:5, rew:2, key:"streak" },
    { id:"clean",    n:"Виграй матч без програних очок",    goal:1, rew:3, key:"clean" },

    { id:"combo5",   n:"Зроби 5 комбо ×3+",                 goal:5, rew:2, key:"combo" },
    { id:"allmasks", n:"Виграй матч, використавши 6 різних масок", goal:1, rew:3, key:"allmasks" },
    { id:"eachskill",n:"Використай 13 різних типів скілів", goal:13,rew:2, key:"types" }
  ];
  var ACHS = [
    { id:"firstwin", n:"Перша перемога",       d:"Виграй перший матч",        goal:1,  key:"wins" },
    { id:"wins10",   n:"10 перемог",            d:"Виграй 10 матчів",          goal:10, key:"wins" },
    { id:"wins25",   n:"25 перемог",            d:"Виграй 25 матчів",          goal:25, key:"wins" },
    { id:"allunlock",n:"Колекціонер",           d:"Відкрий усі 13 масок",      goal:13, key:"unlocked" },

    { id:"combo10",  n:"Комбо-майстер",         d:"Зроби 10 комбо ×3+",        goal:10, key:"comboTotal" },
    { id:"champion", n:"Чемпіон турніру",       d:"Пройди всі 3 матчі",        goal:1,  key:"champion" },
    { id:"dailymaster",n:"Денний герой",        d:"Виконай 3 щоденні виклики", goal:3,  key:"dailyDone" }
  ];

  var OPP0 = [
    { name:"Сусіди-новачки", speed:1.7, err:40, jump:0.55, color:"#4a90d9", txt:"Розминка! Перші суперники ще вчаться грати." },
    { name:"Збірна району",  speed:2.3, err:26, jump:0.8,  color:"#d94a4a", txt:"Серйозніші суперники швидше біжать до м’яча." },
    { name:"Чемпіони області", speed:2.9, err:14, jump:1,  color:"#8a4ad9", txt:"Фінал! Суперник майже не помиляється." }
  ];
  var OPP = [], TARGET = 7, DIFFX = { sp:1, er:1, jp:1 };

  var lineup = [];
  var totalWins = 0, upgrades = {}, achDone = {}, champDone = false;
  var todayKey, dailyState, stats = { comboTotal: 0, rating: {} };
  var tournament = "mix";
  var teamSize = 6;
  var tourData = { girls: { level:0, wins:0 }, boys: { level:0, wins:0 }, mix: { level:0, wins:0 } };
  var voiceOn = true;

  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
  function initDaily() {
    todayKey = todayStr();
    dailyState = load("bus.volley.daily", null);
    if (!dailyState || dailyState.date !== todayKey) {
      var pool = CHALLENGES.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 3);
      dailyState = { date: todayKey, ids: pool.map(function(c){return c.id;}), prog: {}, done: {}, claimed: {}, dailyDone: 0 };
      save("bus.volley.daily", dailyState);
    }
  }
  function dailyChallenge(id) { return CHALLENGES.filter(function(c){return c.id===id;})[0]; }
  function dailyAdd(key, add) {
    if (!dailyState) return;
    dailyState.ids.forEach(function (id) {
      var c = dailyChallenge(id); if (!c || c.key !== key) return;
      if (dailyState.done[id]) return;
      dailyState.prog[id] = Math.min(c.goal, (dailyState.prog[id] || 0) + add);
      if (dailyState.prog[id] >= c.goal) dailyState.done[id] = true;
    });
    save("bus.volley.daily", dailyState);
  }
  function dailySet(key, value) {
    if (!dailyState) return;
    dailyState.ids.forEach(function (id) {
      var c = dailyChallenge(id); if (!c || c.key !== key) return;
      if (dailyState.done[id]) return;
      dailyState.prog[id] = Math.min(c.goal, value);
      if (dailyState.prog[id] >= c.goal) dailyState.done[id] = true;
    });
    save("bus.volley.daily", dailyState);
  }
  function claimDaily(id) {
    var c = dailyChallenge(id); if (!c || !dailyState.done[id] || dailyState.claimed[id]) return;
    dailyState.claimed[id] = true; dailyState.dailyDone = (dailyState.dailyDone || 0) + 1;
    totalWins += c.rew; save("bus.volley.wins", totalWins); save("bus.volley.daily", dailyState);
    trophyHud(); checkAch(); SFXLIB.seq([660, 880, 1200], 0.1);
    renderDaily();
  }

  function initStats() {
    stats = load("bus.volley.stats2", { comboTotal: 0, rating: {} });
    if (!stats.rating) stats.rating = {};
    upgrades = load("bus.volley.upgrades", {});
    achDone = load("bus.volley.ach", {});
    champDone = !!load("bus.volley.champ", false);
    tourData = load("bus.volley.tours", tourData);
    if (!tourData.girls) tourData = { girls: { level:0, wins:0 }, boys: { level:0, wins:0 }, mix: { level:0, wins:0 } };
    tournament = load("bus.volley.tour", "mix");
    teamSize = load("bus.volley.teamsize", 6);
    if ([1,3,6].indexOf(teamSize) < 0) teamSize = 6;
  }
  function upgLevel(id) { return upgrades[id] || 0; }
  function upgCost(l) { return l === 0 ? 3 : l === 1 ? 6 : 0; }

  function checkAch() {
    var unlockedCount = MASKS.filter(function(m){return !m.superOnly && totalWins >= m.need;}).length;
    var maxUpg = MASKS.some(function (m) { return upgLevel(m.id) >= 3; });
    var dailyDone = dailyState ? Object.keys(dailyState.done || {}).filter(function(k){return dailyState.done[k];}).length : 0;
    var ctx = { wins: totalWins, unlocked: unlockedCount, maxupg: maxUpg ? 1 : 0, comboTotal: stats.comboTotal || 0, champion: champDone ? 1 : 0, dailyDone: dailyDone };
    ACHS.forEach(function (a) {
      if (achDone[a.id]) return;
      if ((ctx[a.key] || 0) >= a.goal) { achDone[a.id] = true; save("bus.volley.ach", achDone); SFXLIB.seq([880, 1100, 1400], 0.1); }
    });

  function applyDiff() {
    TARGET = teamSize === 1 ? 5 : teamSize === 3 ? 5 : (DIFF.pick ? DIFF.pick(5, 7, 9) : 7);
    OPP = OPP0.map(function (b) {
      var L = {}; for (var k in b) L[k] = b[k];
      L.speed = b.speed * DIFFX.sp; L.err = b.err * DIFFX.er; L.jump = Math.min(1, b.jump * DIFFX.jp);
