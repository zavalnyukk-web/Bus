<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F6F5C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Автобус Кунівського ліцею</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#0F1D1A; --muted:#62716B; --line:#DDE3E0;
  --green:#1F6F5C; --green-soft:#E3F0EB; --bus:#F5B800; --bus-ink:#1B1600; --live:#1FA463;
  --casing:#FFFFFF; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0C1311; --card:#141D1A; --ink:#E9F0EC; --muted:#94A39C; --line:#25312C;
    --green:#4DBA9A; --green-soft:#17332B; --casing:#0C1311; color-scheme: dark; }
}
* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--bg); color:var(--ink); font:15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
.top { background:var(--card); border-bottom:1px solid var(--line); padding:12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); }
.top-in { max-width:1120px; margin:0 auto; display:flex; align-items:center; gap:12px; }
.logo { width:52px; height:40px; border-radius:10px; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; flex:none; }
.top h1 { font-size:17px; line-height:1.2; margin:0; font-weight:700; }
.top p { margin:0; font-size:13px; color:var(--muted); }
.page { max-width:1120px; margin:0 auto; padding:16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); display:grid; gap:16px; grid-template-columns:1fr; }
@media (min-width:900px) { .page { grid-template-columns: minmax(0,1.4fr) minmax(320px,1fr); align-items:start; } .mapwrap { position:sticky; top:16px; } }
/* на телефоні спершу статус і час прибуття, потім карта */
@media (max-width:899px) {
  .panel { display:contents; }
  .notice { order:1; } .status { order:2; } .mycard { order:3; } .mapwrap { order:4; } .seg { order:5; } .listcard { order:6; } .note { order:7; }
  #map { height:min(48vh, 420px); min-height:300px; }
}
.mapwrap { position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:var(--card); }
#map { height:min(62vh, 560px); min-height:340px; z-index:0; }
.badge { position:absolute; left:12px; top:12px; z-index:500; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600; color:var(--muted); }
.badge.demo { color:var(--bus-ink); background:var(--bus); border-color:var(--bus); }
.panel { display:grid; gap:14px; min-width:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; }
.status { padding:16px; display:grid; gap:10px; }
.pill { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--muted); }
.pill i { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; }
.pill.on { color:var(--live); }
.pill.on i { background:var(--live); box-shadow:0 0 0 0 rgba(31,164,99,.5); animation:ping 1.8s infinite; }
@keyframes ping { 70% { box-shadow:0 0 0 8px rgba(31,164,99,0); } 100% { box-shadow:0 0 0 0 rgba(31,164,99,0); } }
@media (prefers-reduced-motion: reduce) { .pill.on i { animation:none; } }
.big { font-size:22px; line-height:1.2; font-weight:700; margin:0; text-wrap:balance; }
.sub { margin:0; color:var(--muted); }
.mine { margin:0; padding:10px 12px; border-radius:10px; background:var(--green-soft); font-size:14px; }
.mine strong { font-weight:600; }
.seg { display:flex; gap:4px; padding:4px; background:var(--bg); border:1px solid var(--line); border-radius:12px; }
.seg button { flex:1; font:inherit; font-weight:600; font-size:14px; color:var(--muted); background:transparent; border:0; border-radius:9px; padding:9px 12px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }
.list { list-style:none; margin:0; padding:8px 0; }
.list li { position:relative; }
.row { width:100%; display:grid; grid-template-columns:54px 22px 1fr; align-items:center; gap:6px; padding:9px 16px; background:transparent; border:0; color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
.row .t { font-variant-numeric:tabular-nums; font-weight:600; }
.row .m { position:relative; height:100%; display:grid; place-items:center; }
.row .m::before { content:""; position:absolute; left:50%; top:-20px; bottom:-20px; width:2px; margin-left:-1px; background:var(--line); }
li:first-child .row .m::before { top:50%; }
li:last-child .row .m::before { bottom:50%; }
.row .m b { position:relative; width:12px; height:12px; border-radius:50%; background:var(--card); border:3px solid var(--green); }
.row.school .m b { background:var(--green); }
.row.done { color:var(--muted); }
.row.done .m b { border-color:var(--line); background:var(--line); }
.row.next { background:var(--green-soft); }
.row.next .m b { border-color:var(--bus-ink); background:var(--bus); width:16px; height:16px; }
.row.sel .n { text-decoration:underline; text-underline-offset:3px; }
.row .tag { font-size:11px; font-weight:600; color:var(--muted); margin-left:6px; text-transform:uppercase; letter-spacing:.04em; }
.row:focus-visible, .seg button:focus-visible { outline:2px solid var(--green); outline-offset:-2px; }
.note { font-size:12.5px; color:var(--muted); margin:0; }
.stop-tip { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px; font:600 12px Inter, sans-serif; box-shadow:0 1px 3px rgba(0,0,0,.2); padding:2px 7px; }
.stop-tip::before { display:none; }
.leaflet-container { font-family:Inter, system-ui, sans-serif; background:var(--bg); }
.busmark { filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); }

.notice { padding:12px 14px; border-radius:14px; background:var(--bus); color:var(--bus-ink); font-weight:600; display:grid; gap:2px; }
.notice small { font-weight:500; opacity:.8; }
.delay { font-size:13px; font-weight:600; }
.delay.late { color:#B4560A; } .delay.ok { color:var(--live); } .delay.early { color:var(--green); }
@media (prefers-color-scheme: dark) { .delay.late { color:#F0A25A; } }
.mycard { padding:16px; display:grid; gap:10px; }
.mycard h2 { margin:0; font-size:15px; font-weight:700; }
.field { width:100%; font:inherit; font-size:15px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.res { margin:0; font-size:14px; }
.res b { font-weight:700; }
.btn { font:inherit; font-weight:600; font-size:14px; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; background:var(--green); color:#fff; }
.btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
.btns { display:flex; gap:8px; flex-wrap:wrap; }
.hint { margin:0; font-size:12.5px; color:var(--muted); }
.field:focus-visible, .btn:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo" aria-hidden="true"><svg width="34" height="20" viewBox="0 0 60 34"><path d="M3 9 Q3 4 8 4 H43 Q46 4 48 7 L56 17 Q57 18.5 57 20 V27 Q57 28.5 55.5 28.5 H4.5 Q3 28.5 3 27 Z" fill="#F5B800" stroke="#1B1600" stroke-width="2" stroke-linejoin="round"/><rect x="7" y="9" width="9" height="8" rx="1" fill="#1B1600"/><rect x="18" y="9" width="9" height="8" rx="1" fill="#1B1600"/><rect x="29" y="9" width="9" height="8" rx="1" fill="#1B1600"/><path d="M41 9 H45 Q46.5 9 47.5 10.5 L52 17 H41 Z" fill="#1B1600"/><rect x="3" y="20.5" width="54" height="2.6" fill="#1B1600"/><rect x="53" y="22" width="3" height="3" rx="1" fill="#fff"/><circle cx="15" cy="29" r="5" fill="#1B1600"/><circle cx="15" cy="29" r="1.8" fill="#bbb"/><circle cx="44" cy="29" r="5" fill="#1B1600"/><circle cx="44" cy="29" r="1.8" fill="#bbb"/></svg></div>
  <div><h1>Шкільний автобус</h1><p>Кунівський ліцей · БАЗ А079</p></div>
</div></header>

<main class="page">
  <div class="mapwrap">
    <div id="map" role="region" aria-label="Карта маршруту"></div>
    <div class="badge" id="badge" hidden></div>
  </div>
  <div class="panel">
    <div class="notice" id="notice" role="status" hidden><span id="noticetxt"></span><small id="noticetime"></small></div>
    <section class="card status" aria-live="polite">
      <span class="pill" id="pill"><i></i><span id="pilltxt">Перевіряю…</span></span>
      <p class="big" id="big">Завантажую маршрут</p>
      <p class="sub" id="sub"></p>
      <p class="delay" id="delay" hidden></p>
    </section>
    <section class="card mycard">
      <h2>Моя зупинка</h2>
      <select class="field" id="mystop" aria-label="Оберіть свою зупинку"></select>
      <p class="res" id="mine">Оберіть зупинку, і сайт покаже, коли до неї приїде автобус.</p>
      <div class="btns">
        <button type="button" class="btn" id="notifybtn" hidden>Сповістити, коли автобус буде поруч</button>
        <button type="button" class="btn" id="installbtn" hidden>Додати на головний екран</button>
      </div>
      <p class="hint" id="notifyhint" hidden></p>
      <p class="hint" id="installhint" hidden></p>
    </section>
    <div class="seg" role="group" aria-label="Рейс">
      <button id="tab-am" aria-pressed="true">Ранок</button>
      <button id="tab-pm" aria-pressed="false">Після уроків</button>
    </div>
    <section class="card listcard"><ul class="list" id="list"></ul></section>
    <p class="note">Позиція автобуса оновлюється кожні кілька секунд, поки рейс триває. Час у розкладі орієнтовний.</p>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var STOPS = {
    S: { n: "Кунівський ліцей", ll: [50.2445463, 26.363379], school: true },
    M: { n: "Межиріч (Стійло)", ll: [50.263439, 26.4431041] },
    K: { n: "Кам'янка", ll: [50.2579, 26.4373] },
    A: { n: "Антонівка", ll: [50.2541094, 26.4139625] },
    B: { n: "Болотківці", ll: [50.2583845, 26.3775641] },
    D: { n: "Долочче", ll: [50.2207911, 26.327576] },
    V: { n: "Вілія", ll: [50.1965789, 26.298524] }
  };
  var SCHED = {
    am: [["M","07:25"],["K","07:28"],["A","07:32"],["S","07:40"],["B","07:50"],["S","08:00"],["V","08:22"],["D","08:40"],["S","08:53"]],
    pm: [["A","13:37"],["K","13:42"],["M","13:45"],["S","13:55"],["D","14:10"],["S","14:20"],["B","14:50"],["S","15:25"],["A","15:30"],["K","15:32"],["M","15:35"],["S","15:50"],["D","16:00"],["V","16:16"],["S","16:40"]]
  };
  var DEMO = /^#demo/.test(location.hash), DEMO_LATE = location.hash === "#demo-late" ? 6 : 0;
  var $ = function (id) { return document.getElementById(id); };
  function toMin(s) { var p = s.split(":"); return +p[0] * 60 + +p[1]; }
  function fmt(m) { m = Math.floor(m + 1e-6); var h = Math.floor(m / 60), mm = m % 60; return (h < 10 ? "0" : "") + h + ":" + (mm < 10 ? "0" : "") + mm; }
  function kmTxt(m) { return (m / 1000).toFixed(1).replace(".", ",") + " км"; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }

  /* карта */
  var map = L.map("map", { zoomControl: true, attributionControl: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
  var all = Object.keys(STOPS).map(function (c) { return STOPS[c].ll; });
  map.fitBounds(L.latLngBounds(all).pad(0.18));
  var routeLayer = L.layerGroup().addTo(map), stopLayer = L.layerGroup().addTo(map);
  Object.keys(STOPS).forEach(function (c) {
    var s = STOPS[c];
    L.circleMarker(s.ll, { radius: s.school ? 9 : 7, color: "#1F6F5C", weight: 3, fillColor: s.school ? "#1F6F5C" : "#fff", fillOpacity: 1 })
      .bindTooltip(s.n, { permanent: true, direction: "right", offset: [9, 0], className: "stop-tip" }).addTo(stopLayer);
  });
  var busSvg = '<svg class="busmark" width="58" height="34" viewBox="0 0 60 34"><path d="M3 9 Q3 4 8 4 H43 Q46 4 48 7 L56 17 Q57 18.5 57 20 V27 Q57 28.5 55.5 28.5 H4.5 Q3 28.5 3 27 Z" fill="#F5B800" stroke="#1B1600" stroke-width="2" stroke-linejoin="round"/><rect x="7" y="9" width="9" height="8" rx="1" fill="#1B1600"/><rect x="18" y="9" width="9" height="8" rx="1" fill="#1B1600"/><rect x="29" y="9" width="9" height="8" rx="1" fill="#1B1600"/><path d="M41 9 H45 Q46.5 9 47.5 10.5 L52 17 H41 Z" fill="#1B1600"/><rect x="3" y="20.5" width="54" height="2.6" fill="#1B1600"/><rect x="53" y="22" width="3" height="3" rx="1" fill="#fff"/><circle cx="15" cy="29" r="5" fill="#1B1600"/><circle cx="15" cy="29" r="1.8" fill="#bbb"/><circle cx="44" cy="29" r="5" fill="#1B1600"/><circle cx="44" cy="29" r="1.8" fill="#bbb"/></svg>';
  var busIcon = L.divIcon({ html: busSvg, className: "", iconSize: [58, 34], iconAnchor: [29, 17] });
  var bus = null, busPos = null, anim = null, ring = null;

  /* дороги: відрізки між зупинками через OSRM, зберігаються в пам'яті браузера */
  var CKEY = "bus.routes.v4", cache = {};
  try { cache = JSON.parse(localStorage.getItem(CKEY) || "{}"); } catch (e) { cache = {}; }
  function saveCache() { try { localStorage.setItem(CKEY, JSON.stringify(cache)); } catch (e) {} }
  var SERVERS = ["https://router.project-osrm.org/route/v1/driving/", "https://routing.openstreetmap.de/routed-car/route/v1/driving/"];
  function fetchLeg(a, b) {
    var k = a + ">" + b, rk = b + ">" + a;
    if (cache[k]) return Promise.resolve(cache[k]);
    if (cache[rk]) return Promise.resolve(cache[rk].slice().reverse());
    var A = STOPS[a].ll, B = STOPS[b].ll;
    var path = A[1] + "," + A[0] + ";" + B[1] + "," + B[0] + "?overview=full&geometries=geojson";
    function tryServer(i) {
      if (i >= SERVERS.length) return Promise.resolve(null);
      return fetch(SERVERS[i] + path).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) {
        if (!j.routes || !j.routes[0]) throw 0;
        return j.routes[0].geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
      }).catch(function () { return tryServer(i + 1); });
    }
    return tryServer(0).then(function (pts) { if (pts) { cache[k] = pts; saveCache(); } return pts; });
  }
  function km(a, b) {
    var R = 6371, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function mkLeg(pts) {
    var cum = [0];
    for (var i = 1; i < pts.length; i++) cum.push(cum[i - 1] + km(pts[i - 1], pts[i]) * 1000);
    return { pts: pts, cum: cum, len: cum[cum.length - 1] };
  }
  var legsData = { am: null, pm: null }, routed = { am: false, pm: false };
  function loadKey(key) {
    var seq = SCHED[key], res = [], p = Promise.resolve();
    for (var i = 0; i < seq.length - 1; i++) (function (i) {
      p = p.then(function () { return fetchLeg(seq[i][0], seq[i + 1][0]).then(function (pts) { res[i] = pts; }); });
    })(i);
    return p.then(function () {
      var ok = true;
      legsData[key] = res.map(function (pts, i) {
        if (!pts) { ok = false; pts = [STOPS[seq[i][0]].ll, STOPS[seq[i + 1][0]].ll]; }
        return mkLeg(pts);
      });
      routed[key] = ok;
    });
  }
  function drawRoute() {
    var legs = legsData[st.key]; if (!legs) return;
    var seq = SCHED[st.key], seen = {};
    routeLayer.clearLayers();
    legs.forEach(function (leg, i) {
      var k = [seq[i][0], seq[i + 1][0]].sort().join("");
      if (seen[k]) return; seen[k] = 1;
      var opt = routed[st.key] ? {} : { dashArray: "6 8" };
      L.polyline(leg.pts, { color: "#fff", weight: 9, opacity: 0.95, lineCap: "round", lineJoin: "round" }).addTo(routeLayer);
      L.polyline(leg.pts, L.extend({ color: "#1F6F5C", weight: 5, opacity: 0.95, lineCap: "round", lineJoin: "round" }, opt)).addTo(routeLayer);
    });
    stopLayer.eachLayer(function (l) { l.bringToFront(); });
    if (bus) bus.setZIndexOffset(1000);
  }

  var st = { key: new Date().getHours() < 11 ? "am" : "pm", mine: store("bus.mine"), live: null, notice: null, est: null };
  if (st.mine && !STOPS[st.mine]) st.mine = null;

  /* час */
  var demoT = null;
  function nowMin() {
    if (DEMO) return demoT === null ? toMin(SCHED[st.key][0][1]) : demoT;
    var d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  }
  function activeKey() { return DEMO ? st.key : (nowMin() < 11 * 60 ? "am" : "pm"); }

  /* положення автобуса на маршруті: де він, скільки лишилось і наскільки він відстає */
  function projectOnLeg(ll, leg) {
    var pts = leg.pts, kx = 111320 * Math.cos(ll[0] * Math.PI / 180), ky = 110540, best = 1e18, bf = 0, bp = pts[0];
    for (var i = 0; i < pts.length - 1; i++) {
      var ax = (pts[i][1] - ll[1]) * kx, ay = (pts[i][0] - ll[0]) * ky, bx = (pts[i + 1][1] - ll[1]) * kx, by = (pts[i + 1][0] - ll[0]) * ky;
      var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy, t = l2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
      var px = ax + t * dx, py = ay + t * dy, d = px * px + py * py;
      if (d < best) { best = d; bp = [ll[0] + py / ky, ll[1] + px / kx]; bf = leg.cum[i] + t * (leg.cum[i + 1] - leg.cum[i]); }
    }
    return { d: Math.sqrt(best), f: leg.len ? bf / leg.len : 0, pt: bp };
  }
  function estimate(ll) {
    var key = activeKey(), legs = legsData[key];
    if (!legs || !routed[key] || !ll) return null;
    var n = nowMin(), seq = SCHED[key], best = null;
    legs.forEach(function (leg, i) {
      var p = projectOnLeg(ll, leg); if (p.d > 150) return;
      var t0 = toMin(seq[i][1]), t1 = toMin(seq[i + 1][1]), e = t0 + p.f * (t1 - t0), diff = Math.abs(e - n);
      if (!best || diff < best.diff) best = { key: key, leg: i, f: p.f, pt: p.pt, expected: e, diff: diff, delay: n - e };
    });
    return best;
  }
  function remainM(est, j) {
    var legs = legsData[est.key], m = legs[est.leg].len * (1 - est.f);
    for (var k = est.leg + 1; k < j; k++) m += legs[k].len;
    return m;
  }
  function snap(ll) {
    var legs = legsData[activeKey()]; if (!legs || !routed[activeKey()]) return ll;
    var best = null;
    legs.forEach(function (leg) { var p = projectOnLeg(ll, leg); if (!best || p.d < best.d) best = p; });
    return best && best.d < 60 ? best.pt : ll;
  }
  function moveBus(ll) {
    if (!bus) { bus = L.marker(ll, { icon: busIcon, zIndexOffset: 1000, keyboard: false }).addTo(map); busPos = ll; return; }
    var from = busPos, to = ll, t0 = performance.now(), dur = DEMO ? 120 : 3500;
    if (anim) cancelAnimationFrame(anim);
    (function step(now) {
      if (!bus) return;
      var f = Math.min(1, (now - t0) / dur);
      busPos = [from[0] + (to[0] - from[0]) * f, from[1] + (to[1] - from[1]) * f];
      bus.setLatLng(busPos);
      if (f < 1) anim = requestAnimationFrame(step);
    })(t0);
  }
  function removeBus() { if (anim) { cancelAnimationFrame(anim); anim = null; } if (bus) { map.removeLayer(bus); bus = null; busPos = null; } }

  function viewNext() {
    var seq = SCHED[st.key];
    if (st.live && st.est && st.est.key === st.key) return Math.min(st.est.leg + 1, seq.length - 1);
    var n = nowMin();
    for (var j = 0; j < seq.length; j++) if (toMin(seq[j][1]) >= n) return j;
    return -1;
  }

  function drawList() {
    var seq = SCHED[st.key], ni = viewNext(), ul = $("list");
    ul.innerHTML = "";
    seq.forEach(function (r, idx) {
      var li = document.createElement("li"), b = document.createElement("button");
      b.type = "button";
      b.className = "row" + (STOPS[r[0]].school ? " school" : "") + ((ni === -1 || idx < ni) ? " done" : "") + (idx === ni ? " next" : "") + (st.mine === r[0] ? " sel" : "");
      b.innerHTML = '<span class="t"></span><span class="m"><b></b></span><span class="n"></span>';
      b.children[0].textContent = r[1];
      b.children[2].textContent = STOPS[r[0]].n;
      b.onclick = function () { if (STOPS[r[0]].school) return; setMine(r[0]); };
      li.appendChild(b); ul.appendChild(li);
    });
    $("tab-am").setAttribute("aria-pressed", st.key === "am");
    $("tab-pm").setAttribute("aria-pressed", st.key === "pm");
  }

  function delayInfo(est) {
    if (!est) return null;
    var d = est.delay, a = Math.round(Math.abs(d));
    if (a < 2) return { cls: "ok", txt: "Рухається за розкладом" };
    return d > 0 ? { cls: "late", txt: "Запізнюється на " + a + " хв" } : { cls: "early", txt: "Випереджає розклад на " + a + " хв" };
  }

  /* найближчий приїзд автобуса на обрану зупинку, з урахуванням запізнення */
  function nextMine() {
    if (!st.mine) return null;
    var n = nowMin(), best = null;
    ["am", "pm"].forEach(function (key) {
      SCHED[key].forEach(function (r, j) {
        if (r[0] !== st.mine) return;
        var t = toMin(r[1]), onRun = st.live && st.est && st.est.key === key, d = onRun ? st.est.delay : 0;
        if (onRun && j <= st.est.leg) return;
        var eff = t + d;
        if (eff >= n - 1 && (!best || eff < best.eff)) best = { key: key, j: j, t: t, eff: eff, onRun: onRun };
      });
    });
    return best;
  }

  var notified = {};
  function notify(title, body) {
    var opt = { body: body, icon: "icon-192.png", badge: "icon-192.png", tag: "bus", vibrate: [200, 100, 200] };
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg && reg.showNotification) reg.showNotification(title, opt); else new Notification(title, opt);
        }).catch(function () { try { new Notification(title, opt); } catch (e) {} });
      } else new Notification(title, opt);
    } catch (e) {}
  }
  function notifyOn() { return store("bus.notify") === "1" && window.Notification && Notification.permission === "granted"; }

  function renderMine(nm) {
    var el = $("mine");
    if (ring) { map.removeLayer(ring); ring = null; }
    if (!st.mine) { el.textContent = "Оберіть зупинку, і сайт покаже, коли до неї приїде автобус."; return; }
    var s = STOPS[st.mine];
    ring = L.circleMarker(s.ll, { radius: 15, color: "#F5B800", weight: 3, fill: false }).addTo(map);
    if (!nm) { el.innerHTML = "<b>" + s.n + "</b>: на сьогодні рейсів більше немає."; return; }
    var left = nm.eff - nowMin(), txt = "<b>" + s.n + "</b>: автобус буде о <b>" + fmt(nm.eff) + "</b>";
    if (nm.onRun) {
      var m = remainM(st.est, nm.j);
      txt += ", їде до вас " + kmTxt(m) + " дорогою";
      if (Math.abs(nm.eff - nm.t) >= 2) txt += " (за розкладом " + fmt(nm.t) + ")";
      txt += left < 1 ? ". Він уже біля вас." : ". Приблизно через " + Math.ceil(left) + " хв.";
      if (notifyOn() && (left <= 5 || m <= 1500)) {
        var nk = new Date().toDateString() + nm.key + nm.j;
        if (!notified[nk]) { notified[nk] = 1; notify("Автобус поруч", s.n + ": буде приблизно через " + Math.max(1, Math.ceil(left)) + " хв (" + kmTxt(m) + ")."); }
      }
    } else {
      txt += " за розкладом" + (left >= 1 ? " (через " + Math.ceil(left) + " хв)" : "") + ".";
    }
    el.innerHTML = txt;
  }

  function renderNotice() {
    var n = st.notice, box = $("notice");
    if (n && n.text && n.ts && Date.now() - n.ts < 18 * 3600 * 1000) {
      $("noticetxt").textContent = n.text;
      var d = new Date(n.ts); $("noticetime").textContent = "Повідомлено о " + fmt(d.getHours() * 60 + d.getMinutes());
      box.hidden = false;
    } else box.hidden = true;
  }

  function refresh() {
    st.est = st.live ? estimate([st.live.lat, st.live.lng]) : null;
    drawList();
    var seq = SCHED[st.key], ni = viewNext(), live = !!st.live;
    $("pill").className = "pill" + (live ? " on" : "");
    $("pilltxt").textContent = live ? "Автобус у рейсі" : "Автобус не в рейсі";
    var di = delayInfo(st.est), dl = $("delay");
    if (di) { dl.hidden = false; dl.className = "delay " + di.cls; dl.textContent = di.txt; } else dl.hidden = true;
    var off = live && !st.est && routed[activeKey()];
    if (ni === -1 && live) { $("big").textContent = "Автобус ще в дорозі"; $("sub").textContent = "Це вже після запланованого розкладу."; }
    else if (ni === -1) { $("big").textContent = "Рейси на сьогодні завершено"; $("sub").textContent = "Наступний рейс: " + (st.key === "am" ? "після уроків" : "завтра зранку") + "."; }
    else {
      var nx = seq[ni], eta = toMin(nx[1]) - nowMin();
      $("big").textContent = (live ? "Наступна зупинка: " : "Найближча зупинка: ") + STOPS[nx[0]].n;
      var s = "За розкладом о " + nx[1] + (eta >= 1 ? ", через " + Math.ceil(eta) + " хв." : ", вже зараз.");
      if (live && st.est && st.est.key === st.key) s += " До неї " + kmTxt(remainM(st.est, ni)) + " дорогою.";
      else if (live) s += " Автобус за " + km([st.live.lat, st.live.lng], STOPS[nx[0]].ll).toFixed(1).replace(".", ",") + " км по прямій.";
      $("sub").textContent = s;
    }
    $("mystop").value = st.mine || "";
    renderMine(nextMine());
    renderNotice();
  }

  function setMine(code) {
    st.mine = code || null;
    store("bus.mine", st.mine);
    refresh();
  }

  /* справжній GPS */
  function setLive(d) {
    st.live = d;
    if (d) moveBus(snap([d.lat, d.lng])); else removeBus();
    refresh();
  }
  function poll() {
    var C = window.CONFIG;
    if (!C || String(C.dbUrl).indexOf("ВАШ") !== -1) return;
    fetch(C.dbUrl + "/bus/" + C.key + ".json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var pos = null, notice = null;
        if (d) {
          var p = d.pos || (d.lat !== undefined ? d : null);
          if (p && p.ts && Date.now() - p.ts < 90000) pos = p;
          if (d.notice && d.notice.text) notice = d.notice;
        }
        st.notice = notice;
        setLive(pos);
      })
      .catch(function () {});
  }

  /* демонстрація: адреса сайту з #demo (або #demo-late), автобус їде по дорогах за розкладом */
  function demoPos(t) {
    var seq = SCHED[st.key], legs = legsData[st.key], i;
    if (!legs) return null;
    for (i = 0; i < seq.length - 1; i++) if (t < toMin(seq[i + 1][1])) break;
    if (i >= seq.length - 1) i = seq.length - 2;
    var leg = legs[i].pts;
    var t0 = toMin(seq[i][1]), t1 = toMin(seq[i + 1][1]), f = Math.max(0, Math.min(1, (t - t0) / (t1 - t0)));
    var cum = legs[i].cum, target = legs[i].len * f, k;
    for (k = 1; k < cum.length; k++) if (cum[k] >= target) break;
    if (k >= cum.length) return leg[leg.length - 1];
    var seg = cum[k] - cum[k - 1], u = seg ? (target - cum[k - 1]) / seg : 0;
    return [leg[k - 1][0] + (leg[k][0] - leg[k - 1][0]) * u, leg[k - 1][1] + (leg[k][1] - leg[k - 1][1]) * u];
  }
  function startDemo() {
    $("badge").hidden = false; $("badge").className = "badge demo"; $("badge").textContent = DEMO_LATE ? "Демонстрація: автобус запізнюється" : "Демонстрація: час прискорено";
    st.notice = { text: "Це приклад об’яви: сьогодні автобус може затримуватись на 10 хв.", ts: Date.now() };
    var seq = SCHED[st.key], last = performance.now(), tick = 0;
    demoT = toMin(seq[0][1]) + DEMO_LATE;
    (function loop(now) {
      var sq = SCHED[st.key], end = toMin(sq[sq.length - 1][1]);
      if (demoT === null) demoT = toMin(sq[0][1]) + DEMO_LATE;
      demoT += (now - last) / 1000 * 2; last = now;
      if (demoT > end + DEMO_LATE) demoT = toMin(sq[0][1]) + DEMO_LATE;
      var p = demoPos(demoT - DEMO_LATE);
      if (p) { st.live = { lat: p[0], lng: p[1], ts: Date.now() }; moveBus(p); }
      if (now - tick > 500) { tick = now; refresh(); }
      requestAnimationFrame(loop);
    })(last);
  }

  /* вибір зупинки */
  (function () {
    var sel = $("mystop"), o = document.createElement("option");
    o.value = ""; o.textContent = "Оберіть зупинку"; sel.appendChild(o);
    Object.keys(STOPS).forEach(function (c) {
      if (STOPS[c].school) return;
      var op = document.createElement("option"); op.value = c; op.textContent = STOPS[c].n; sel.appendChild(op);
    });
    sel.onchange = function () { setMine(sel.value); };
  })();

  /* сповіщення */
  function syncNotifyUi() {
    var b = $("notifybtn"), h = $("notifyhint");
    if (!window.Notification) { b.hidden = true; h.hidden = false; h.textContent = "Цей браузер не показує сповіщень."; return; }
    if (Notification.permission === "denied") { b.hidden = true; h.hidden = false; h.textContent = "Сповіщення заблоковані в налаштуваннях браузера для цього сайту."; return; }
    b.hidden = false; h.hidden = false;
    if (notifyOn()) { b.textContent = "Вимкнути сповіщення"; b.className = "btn ghost"; h.textContent = "Телефон сповістить за 5 хвилин до вашої зупинки, поки сайт відкритий у браузері. Якщо закрити вкладку, сповіщення не прийде."; }
    else { b.textContent = "Сповістити, коли автобус буде поруч"; b.className = "btn"; h.textContent = "Працює, поки сайт відкритий у браузері."; }
  }
  $("notifybtn").onclick = function () {
    if (notifyOn()) { store("bus.notify", "0"); syncNotifyUi(); return; }
    if (!st.mine) { $("notifyhint").hidden = false; $("notifyhint").textContent = "Спочатку оберіть свою зупинку."; return; }
    Notification.requestPermission().then(function (p) {
      if (p === "granted") { store("bus.notify", "1"); notify("Сповіщення увімкнено", "Я попереджу, коли автобус буде поруч із вашою зупинкою."); }
      syncNotifyUi(); refresh();
    });
  };
  syncNotifyUi();

  /* додати на головний екран */
  var standalone = window.matchMedia && (matchMedia("(display-mode: standalone)").matches || navigator.standalone);
  var deferred = null;
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; if (!standalone) { $("installbtn").hidden = false; $("installhint").hidden = true; } });
  window.addEventListener("appinstalled", function () { $("installbtn").hidden = true; $("installhint").hidden = true; });
  $("installbtn").onclick = function () { if (!deferred) return; deferred.prompt(); deferred = null; $("installbtn").hidden = true; };
  if (!standalone) setTimeout(function () {
    if (!deferred) { var h = $("installhint"); h.hidden = false; h.textContent = "Щоб відкривати сайт одним дотиком: у Chrome натисніть меню ⋮ і виберіть «Додати на головний екран»."; }
  }, 2500);

  $("tab-am").onclick = function () { st.key = "am"; demoT = null; drawRoute(); refresh(); if (DEMO) startDemoRestart(); };
  $("tab-pm").onclick = function () { st.key = "pm"; demoT = null; drawRoute(); refresh(); if (DEMO) startDemoRestart(); };
  function startDemoRestart() { demoT = toMin(SCHED[st.key][0][1]) + DEMO_LATE; }

  drawList(); refresh();
  loadKey(st.key).then(function () {
    drawRoute(); refresh();
    if (DEMO) startDemo();
    return loadKey(st.key === "am" ? "pm" : "am");
  }).then(function () { refresh(); });
  if (!DEMO) { poll(); setInterval(poll, 4000); setInterval(refresh, 30000); }
  window.__bus = { st: st, STOPS: STOPS, SCHED: SCHED, estimate: estimate, remainM: remainM, nextMine: nextMine, refresh: refresh, legsData: legsData, setLive: setLive, nowMin: nowMin };
})();
</script>
</body>
</html>
