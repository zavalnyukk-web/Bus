<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Автобус Кунівського ліцею</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
:root { --bg:#F2F4F1; --surface:#fff; --ink:#13201B; --muted:#5A6A63; --line:#D5DDD8; --route:#2F7D68; --leg:#A9B8B0; --bus:#F4B400; --bus-ink:#1A1A12; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0E1512; --surface:#16201B; --ink:#E8EFEA; --muted:#93A39B; --line:#2A3731; --route:#4FBF9F; --leg:#3B4A43; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 "Onest", system-ui, sans-serif; padding: 20px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 16px; }
.eyebrow { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
h1 { font-family:"Unbounded", system-ui, sans-serif; font-size:clamp(24px,6vw,34px); line-height:1.1; margin:4px 0 0; }
.tabs { display:flex; gap:8px; }
.tab { font:inherit; font-weight:500; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:9px 18px; cursor:pointer; }
.tab[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.grid { display:grid; gap:16px; grid-template-columns:1fr; }
@media (min-width:840px) { .grid { grid-template-columns:1.25fr 1fr; align-items:start; } }
#map { height: 56vh; min-height: 320px; border:1px solid var(--line); border-radius:10px; z-index:0; }
.side { display:grid; gap:12px; min-width:0; }
.status { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; display:grid; gap:8px; }
.live { margin:0; font-weight:600; }
.live::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--muted); margin-right:8px; }
.live.on::before { background:#2FB172; }
.mine { margin:0; color:var(--muted); font-size:14px; }
.mine strong { color:var(--ink); }
.list { list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.list li + li { border-top:1px solid var(--line); }
.row { width:100%; display:grid; grid-template-columns:18px 1fr auto; gap:12px; align-items:center; padding:11px 14px; background:transparent; border:0; color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
.row .dot { width:12px; height:12px; border-radius:50%; border:2px solid var(--route); }
.row.school .dot { background:var(--route); }
.row .t { color:var(--muted); font-variant-numeric:tabular-nums; }
.row.done { color:var(--muted); }
.row.done .dot { background:var(--leg); border-color:var(--leg); }
.row.next { background:var(--bus); color:var(--bus-ink); font-weight:600; }
.row.next .t { color:var(--bus-ink); }
.row.sel { box-shadow: inset 3px 0 0 var(--ink); }
.note { font-size:13px; color:var(--muted); margin:0; }
.stop-tip { background:var(--surface); color:var(--ink); border:1px solid var(--line); font:500 12px "Onest", sans-serif; box-shadow:none; padding:2px 6px; }
.leaflet-container { font-family: "Onest", system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Кунівський ліцей · шкільний автобус</div>
    <h1>Де зараз автобус</h1>
  </header>
  <div class="tabs">
    <button class="tab" id="tab-am" aria-pressed="true">Ранок</button>
    <button class="tab" id="tab-pm" aria-pressed="false">Після уроків</button>
  </div>
  <div class="grid">
    <div id="map" role="region" aria-label="Карта маршруту"></div>
    <div class="side">
      <section class="status" aria-live="polite">
        <p class="live" id="live">Перевіряю…</p>
        <p class="mine" id="mine"></p>
      </section>
      <ul class="list" id="list"></ul>
    </div>
  </div>
  <p class="note">Місце автобуса оновлюється кожні кілька секунд, коли вихователь розпочав рейс. Відстань рахується по прямій.</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var STOPS = {
    S: { n: "Кунівський ліцей", ll: [50.2445463, 26.363379], school: true },
    M: { n: "Межиріч (Стійло)", ll: [50.263439, 26.4431041] },
    K: { n: "Кам'янка", ll: [50.2534069, 26.4157811] },
    A: { n: "Антонівка", ll: [50.254399, 26.3685611] },
    B: { n: "Болотківці", ll: [50.2207911, 26.327576] },
    D: { n: "Долочче", ll: [50.1965789, 26.298524] },
    V: { n: "Вілія", ll: [50.1778141, 26.299162] }
  };
  var SCHED = {
    am: [["M","07:25"],["K","07:28"],["A","07:32"],["S","07:40"],["B","07:50"],["S","08:00"],["V","08:22"],["D","08:40"],["S","08:53"]],
    pm: [["A","13:37"],["K","13:42"],["M","13:45"],["S","13:55"],["D","14:10"],["S","14:20"],["B","14:50"],["S","15:25"],["A","15:30"],["K","15:32"],["M","15:35"],["S","15:50"],["D","16:00"],["V","16:16"],["S","16:40"]]
  };
  var $ = function (id) { return document.getElementById(id); };
  function toMin(s) { var p = s.split(":"); return +p[0] * 60 + +p[1]; }
  var map = L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap" }).addTo(map);
  var bounds = L.latLngBounds(Object.keys(STOPS).map(function (c) { return STOPS[c].ll; }));
  map.fitBounds(bounds.pad(0.15));
  var stopLayer = L.layerGroup().addTo(map), legLayer = L.layerGroup().addTo(map);
  Object.keys(STOPS).forEach(function (c) {
    var s = STOPS[c];
    L.circleMarker(s.ll, { radius: s.school ? 9 : 7, color: "#2F7D68", weight: 3, fillColor: s.school ? "#2F7D68" : "#fff", fillOpacity: 1 })
      .bindTooltip(s.n, { permanent: true, direction: "right", offset: [8, 0], className: "stop-tip" }).addTo(stopLayer);
  });
  var busSvg = '<svg width="38" height="26" viewBox="0 0 34 24"><rect x="1" y="1" width="32" height="17" rx="4" fill="#F4B400" stroke="#1A1A12" stroke-width="2"/><rect x="5" y="5" width="6" height="5" fill="#1A1A12"/><rect x="14" y="5" width="6" height="5" fill="#1A1A12"/><rect x="23" y="5" width="6" height="5" fill="#1A1A12"/><circle cx="9" cy="20" r="3" fill="#1A1A12"/><circle cx="25" cy="20" r="3" fill="#1A1A12"/></svg>';
  var busIcon = L.divIcon({ html: busSvg, className: "", iconSize: [38, 26], iconAnchor: [19, 13] });
  var bus = null, ring = null;
  var st = { key: new Date().getHours() < 11 ? "am" : "pm", mine: null, live: null };

  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function km(a, b) {
    var R = 6371, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function draw() {
    var seq = SCHED[st.key];
    legLayer.clearLayers();
    var seen = {};
    for (var i = 0; i < seq.length - 1; i++) {
      var a = seq[i][0], b = seq[i + 1][0], k = [a, b].sort().join("");
      if (seen[k]) continue; seen[k] = 1;
      L.polyline([STOPS[a].ll, STOPS[b].ll], { color: "#2F7D68", weight: 4, opacity: 0.6, dashArray: "6 8" }).addTo(legLayer);
    }
    var n = nowMin(), nextIdx = -1;
    for (var j = 0; j < seq.length; j++) if (toMin(seq[j][1]) >= n) { nextIdx = j; break; }
    $("list").innerHTML = "";
    seq.forEach(function (r, idx) {
      var li = document.createElement("li"), b = document.createElement("button");
      b.type = "button";
      b.className = "row" + (STOPS[r[0]].school ? " school" : "") + (nextIdx === -1 || idx < nextIdx ? " done" : "") + (idx === nextIdx ? " next" : "") + (st.mine === r[0] ? " sel" : "");
      b.innerHTML = '<span class="dot"></span><span></span><span class="t"></span>';
      b.children[1].textContent = STOPS[r[0]].n; b.children[2].textContent = r[1];
      b.onclick = function () { st.mine = st.mine === r[0] ? null : r[0]; draw(); renderMine(); };
      li.appendChild(b); $("list").appendChild(li);
    });
    $("tab-am").setAttribute("aria-pressed", st.key === "am");
    $("tab-pm").setAttribute("aria-pressed", st.key === "pm");
  }
  function renderMine() {
    var el = $("mine");
    if (ring) { map.removeLayer(ring); ring = null; }
    if (!st.mine) { el.textContent = "Натисніть свою зупинку в списку."; return; }
    var s = STOPS[st.mine], seq = SCHED[st.key], n = nowMin(), t = null;
    ring = L.circleMarker(s.ll, { radius: 15, color: "#13201B", weight: 2, fill: false, dashArray: "3 3" }).addTo(map);
    for (var i = 0; i < seq.length; i++) if (seq[i][0] === st.mine && toMin(seq[i][1]) >= n) { t = seq[i][1]; break; }
    var txt = "<strong>" + s.n + "</strong>: " + (t ? "за розкладом о " + t : "на сьогодні рейсів більше немає");
    if (st.live) txt += "; автобус зараз за " + km([st.live.lat, st.live.lng], s.ll).toFixed(1) + " км";
    el.innerHTML = txt + ".";
  }
  function setLive(d) {
    st.live = d;
    var el = $("live");
    if (d) {
      var ago = Math.max(0, Math.round((Date.now() - d.ts) / 1000));
      el.className = "live on"; el.textContent = "Автобус у рейсі, оновлено " + ago + " с тому";
      var ll = [d.lat, d.lng];
      if (!bus) bus = L.marker(ll, { icon: busIcon, zIndexOffset: 1000 }).addTo(map); else bus.setLatLng(ll);
    } else {
      el.className = "live"; el.textContent = "Автобус зараз не в рейсі. Дивіться розклад.";
      if (bus) { map.removeLayer(bus); bus = null; }
    }
    renderMine();
  }
  function poll() {
    var C = window.CONFIG;
    if (!C || C.dbUrl.indexOf("ВАШ") !== -1) { $("live").textContent = "Місце автобуса ще не підключено."; return; }
    fetch(C.dbUrl + "/bus/" + C.key + ".json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { setLive(d && d.ts && Date.now() - d.ts < 90000 ? d : null); })
      .catch(function () { $("live").textContent = "Немає зв'язку. Спробую ще раз."; });
  }
  $("tab-am").onclick = function () { st.key = "am"; draw(); renderMine(); };
  $("tab-pm").onclick = function () { st.key = "pm"; draw(); renderMine(); };
  draw(); renderMine(); poll(); setInterval(poll, 4000); setInterval(draw, 60000);
})();
</script>
</body>
</html>
