<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2B705">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Шкільний автобус</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: one-column phone tool. Sticky top block with the "in the bus" counter and a route line of stop markers;
   below it the children of the current stop with large tap targets; bottom tab bar switches trip / lists. */
:root{
  --bg:#EDEFEA;
  --surface:#FFFFFF;
  --ink:#14181F;
  --muted:#59626D;
  --line:#D3D8D0;
  --accent:#F2B705;
  --on-accent:#14181F;
  --ok:#1B7F46;
  --ok-bg:#DCEFE3;
  --bad:#B82A2A;
  --bad-bg:#FBE0DC;
  --warn-bg:#FFF0BD;
  --f-display:'Oswald','Arial Narrow',Impact,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1317;--surface:#1A2027;--ink:#ECEFF2;--muted:#9AA4AF;--line:#2B333C;
    --accent:#F2B705;--on-accent:#14181F;--ok:#4CC587;--ok-bg:#16301F;--bad:#FF7A6E;--bad-bg:#3A1714;--warn-bg:#3A3110;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1317;--surface:#1A2027;--ink:#ECEFF2;--muted:#9AA4AF;--line:#2B333C;
  --accent:#F2B705;--on-accent:#14181F;--ok:#4CC587;--ok-bg:#16301F;--bad:#FF7A6E;--bad-bg:#3A1714;--warn-bg:#3A3110;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:560px;margin:0 auto}
h1,h2,h3,p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* sticky head */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:8px 4px}
.count-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.count{font:600 48px/1 var(--f-display);font-variant-numeric:tabular-nums}
.count small{font:500 18px var(--f-display);color:var(--muted);margin-left:6px}
.mode-tag{font:500 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase;text-align:right;color:var(--muted)}

/* route line */
.route{display:flex;overflow-x:auto;padding-block:10px 6px;scrollbar-width:none}
.route::-webkit-scrollbar{display:none}
.pt{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;background:none;border:0;color:var(--ink);padding:0;cursor:pointer;min-width:0}
.pt::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line)}
.pt:first-child::before{display:none}
.pt.done::before,.pt.cur::before{background:var(--ink)}
.dot{width:32px;height:32px;border-radius:50%;border:3px solid var(--ink);background:var(--bg);display:grid;place-items:center;font:600 14px var(--f-display);position:relative;z-index:1}
.pt.done .dot{background:var(--ink);color:var(--bg)}
.pt.cur .dot{background:var(--accent);color:var(--on-accent);transform:scale(1.15)}
.nm{font-size:11px;line-height:1.2;text-align:center;max-width:72px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.pt.cur .nm{color:var(--ink);font-weight:600}

/* segmented mode switch */
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin-top:14px}
.seg button{min-height:48px;border:0;background:transparent;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* current stop */
.stop-title{margin-top:18px;display:flex;flex-direction:column;gap:2px}
.stop-title h2{font:600 30px/1.1 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.stop-title .cap{color:var(--muted);font-size:15px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.kid{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:68px}
.kid.on{border-color:var(--ok);background:var(--ok-bg)}
.kid.abs{opacity:.75}
.who{flex:1;min-width:0}
.who .n{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.who .s{font-size:13px;color:var(--muted)}
.kid.on .who .s{color:var(--ok);font-weight:600}
.acts{display:flex;gap:8px;flex:0 0 auto}

.btn{min-height:48px;padding:0 16px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;font-size:16px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.solid-bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn.wide{width:100%}

.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px}
.alert{margin-top:16px;border:2px solid var(--ink);background:var(--warn-bg);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.alert.sev{border-color:var(--bad);background:var(--bad-bg)}
.alert b{font-weight:600}
.alert .row{display:flex;gap:8px;flex-wrap:wrap}
.alert .row .btn{flex:1 1 140px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;min-height:44px;cursor:pointer;margin-top:10px;padding:0}
details.more{margin-top:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.more summary{min-height:48px;display:flex;align-items:center;padding:0 12px;font-weight:600;cursor:pointer}
details.more .list{padding:0 10px 10px;margin-top:0}
.banner{margin-top:14px;border:2px dashed var(--ink);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.empty{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.empty h2{font:600 26px/1.15 var(--f-display)}
.empty p{color:var(--muted)}

/* summary */
.sum{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.sum h2{font:600 30px/1.1 var(--f-display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
textarea.rep{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:14px/1.5 var(--f-body);padding:10px;resize:vertical}

/* setup */
.card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card h3{font:600 20px/1.1 var(--f-display)}
.field{width:100%;min-height:48px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px var(--f-body);padding:0 12px}
.field:focus{border-color:var(--ink);outline:none}
.srow{display:flex;gap:6px;align-items:center}
.srow .num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 14px var(--f-display)}
.srow .field{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding-left:12px}
.chip button{width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.addrow{display:flex;gap:8px}
.addrow .field{flex:1;min-width:0}
.hint{font-size:13px;color:var(--muted)}
.ord{display:flex;gap:4px}
.ord button{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px;cursor:pointer}
.ord button:disabled{opacity:.35;cursor:default}

.cl{font:500 12px var(--f-body);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.notify{margin-top:14px}
textarea.rep.msg{min-height:96px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}
.tabs button{min-height:52px;border:2px solid transparent;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;line-height:1.15;padding:0 4px;cursor:pointer}
.chip .nm{min-height:40px;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:0 4px 0 0;cursor:pointer;text-align:left}
.edit{flex:1 1 100%;display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:10px;padding:10px;background:var(--surface)}
.hrec{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hrec>button{width:100%;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;color:var(--ink);padding:8px 12px;text-align:left;cursor:pointer;font-size:16px}
.hrec .t{font-weight:600}.hrec .m{font-size:13px;color:var(--muted)}
.hrec .in{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.pill{font:600 13px var(--f-body);border-radius:999px;padding:2px 10px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.hline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.hline span:last-child{color:var(--muted);text-align:right}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.bc{margin-top:14px;display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--surface)}
.bc.on{border-color:var(--ok);background:var(--ok-bg)}
.bc-t{flex:1;min-width:0}
.bc-h{font:600 16px var(--f-display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.bc-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.bc.on .bc-dot{background:var(--ok)}
.bc-s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.bc.on .bc-s{color:var(--ok);font-weight:600}
.bc .btn{flex:none}
@media (prefers-reduced-motion:no-preference){.pt .dot{transition:transform .15s}.bc.on .bc-dot{animation:bcp 1.6s infinite}@keyframes bcp{50%{opacity:.35}}}
</style>

</head>
<body>
<div id="app"></div>
<nav class="tabs" aria-label="Розділи"><div>
  <button type="button" data-act="tab" data-v="trip" id="tab-trip">Рейс</button>
  <button type="button" data-act="tab" data-v="hist" id="tab-hist">Історія</button>
  <button type="button" data-act="tab" data-v="setup" id="tab-setup">Діти й зупинки</button>
</div></nav>

<script>
(function(){
'use strict';
var KEY='zhurnal-posadky-v2';
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function newTrip(mode){return {id:uid(),mode:mode||'morning',idx:0,st:{},done:false};}
var SEED=[{"n": "Межиріч (Підсобне)", "k": [["Урбан Христина", "4"], ["Урбан Вікторія", "8"]]}, {"n": "Кам’янка", "k": [["Курачик Катерина", "1"], ["Юр’єв Станіслав", "5"], ["Турчинська Діана", "6"], ["Семенюк Володимир", "7"], ["Коваль Марта", "8"], ["Дмитрук Марія", "10"], ["Тарасюк Олександра", "5"], ["Галімська Вероніка", "6"], ["Зелінський Адріан", "7"], ["Дацюк Софія", "8"], ["Сивук Костянтин", "9"], ["Зелінська Аріанна", "10"], ["Сивук Марія", "10"], ["Лук’янчук Назар", "11"]]}, {"n": "Антонівка", "k": [["Антіпов Богдан", "1"], ["Криницька Варвара", "1"], ["Фаєнко Мілана", "1"], ["Ступак Анастасія", "3"], ["Ліщук Ілля", "4"], ["Новоградська Ірина", "4"], ["Фабричнов Ілля", "5"], ["Антіпова Марія", "7"], ["Новоградська Оксана", "7"], ["Свирида Артур", "7"], ["Свирида Максим", "9"], ["Сакал Яна", "10"], ["Соколовський Максим", "10"], ["Антіпова Дарія", "11"], ["Новоградський Михайло", "11"], ["Марчук Вероніка", "11"]]}, {"n": "Болотківці", "k": [["Данилюк Костянтин", "6"], ["Оропай Ксенія", "7"], ["Бондар Ольга", "9"], ["Рибак Яна", "9"], ["Москалюк Микола", "10"], ["Шостак Наталія", "11"]]}, {"n": "Вілія", "k": [["Добровольська Єва", "4"], ["Дем’янчук Софія", "7"], ["Добровольська Уляна", "8"], ["Добровольський Ілля", "10"], ["Момотюк Олександр", "10"], ["Зарічна Віка", "10"], ["Хоменчук Софія", "10"], ["Третяк Анастасія", "10"], ["Мельниченко Олег", "11"], ["Семенюк Дар’я", "11"], ["Хоменчук Вікторія", "11"]]}, {"n": "Долочче", "k": [["Галімський Стас", "3"], ["Ткаченко Давид", "3"], ["Балабей Михайло", "4"], ["Андрієвська Діана", "4"], ["Ілючок Вікторія", "4"], ["Андрієвський Кирило", "6"], ["Гончар Христина", "7"], ["Рябіцький Дмитро", "7"], ["Стратюк Анатолій", "7"], ["Андрієвська Ангеліна", "8"], ["Балабей Марія", "9"], ["Стратюк Захар", "9"], ["Гончар Анастасія", "9"], ["Коваленко Андрій", "9"], ["Мукосієнко Каріна", "10"], ["Рачковська Соломія", "7"], ["Перчук Єлизавета", "8"], ["Ричківський Артем", "10"]]}];
function seed(){
  var stops=[],kids=[];
  SEED.forEach(function(g){var id=uid();stops.push({id:id,name:g.n});g.k.forEach(function(x){kids.push({id:uid(),name:x[0],cls:x[1],stop:id});});});
  return {data:{school:'Школа',stops:stops,kids:kids,example:false,names:true},trip:newTrip('morning')};
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var o=JSON.parse(r);if(o&&o.data&&o.trip&&Array.isArray(o.data.stops)&&Array.isArray(o.data.kids))return o;}
  }catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}try{syncSoon();}catch(e){}}
var DM={};
var S=load();
if(!Array.isArray(S.hist))S.hist=[];
if(!S.trip.id)S.trip.id=uid();
var ui={shr:null,imp:'',impMsg:null,edit:null,hq:'',hopen:null,hdel:null,hclear:false,hcopied:null,tab:'trip',warn:null,confirm:null,delStop:null,copied:false,msg:null,copied2:false};
var app=document.getElementById('app');

function now(){return new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});}
function stopById(id){return S.data.stops.filter(function(s){return s.id===id;})[0];}
var DEF_KEYS={morning:['меж','кам','ант','S','бол','S','віл','дол','S'],afternoon:['S','ант','кам','меж','S','дол','S','бол','S','ант','кам','меж','S','дол','віл','G']};
function sKey(n){return nkey(n).replace(/[’'`ʼ]/g,'');}
function defaultRoute(mode){
  var st=S.data.stops,hit=0,out=[];
  DEF_KEYS[mode].forEach(function(k){
    if(k==='S'){out.push('school');return;}
    if(k==='G'){out.push('garage');return;}
    var f=st.filter(function(x){return sKey(x.name).indexOf(k)===0;})[0];
    if(f){out.push(f.id);hit++;}
  });
  if(hit<3){
    var ids=st.map(function(x){return x.id;});
    return mode==='morning'?ids.concat(['school']):['school'].concat(ids.slice().reverse());
  }
  return out;
}
function routeTokens(mode){
  var r=S.data.routes&&S.data.routes[mode];
  if(!Array.isArray(r))return defaultRoute(mode);
  r=r.filter(function(t){return t==='school'||t==='garage'||!!stopById(t);});
  return r.length?r:defaultRoute(mode);
}
function ensureRoutes(){
  if(!S.data.routes||!Array.isArray(S.data.routes.morning)||!Array.isArray(S.data.routes.afternoon)){
    S.data.routes={morning:routeTokens('morning'),afternoon:routeTokens('afternoon')};
    if(!S.data.school||S.data.school==='Школа')S.data.school='Кунівський ліцей';
    save();
  }
}
function tripTokens(){
  var t=S.trip;
  if(Array.isArray(t.rt)){var r=t.rt.filter(function(x){return x==='school'||x==='garage'||!!stopById(x);});if(r.length)return r;}
  return routeTokens(t.mode);
}
function routeKids(){
  if(!Array.isArray(S.trip.rt))return S.data.kids;
  var pl=plan();return S.data.kids.filter(function(k){return pl[k.id]&&pl[k.id].b>=0;});
}
function routeName(){
  var t=S.trip;if(!Array.isArray(t.rt))return 'Звичайний маршрут';
  var nm=t.rt.filter(function(x){return x!=='school'&&x!=='garage';}).map(function(x){var q=stopById(x);return q?q.name:'';}).filter(function(x,i,a){return x&&a.indexOf(x)===i;});
  return 'Особливий: '+(nm.join(', ')||'без зупинок');
}
function buildRoute(mode,ids,ordered){
  if(ordered){var pk=ids.filter(function(x,i){return stopById(x)&&ids.indexOf(x)===i;});return mode==='morning'?pk.concat(['school']):['school'].concat(pk).concat(['garage']);}
  var base=routeTokens(mode),seen={},order=[];
  base.forEach(function(x){if(x!=='school'&&x!=='garage'&&!seen[x]){seen[x]=1;order.push(x);}});
  var pick=order.filter(function(x){return ids.indexOf(x)>=0;});
  ids.forEach(function(x){if(pick.indexOf(x)<0&&stopById(x))pick.push(x);});
  return mode==='morning'?pick.concat(['school']):['school'].concat(pick).concat(['garage']);
}
function rtApply(v){
  var t=S.trip,ids;
  if(v==='def')delete t.rt;
  else{
    ids=v.indexOf('s:')===0?[v.slice(2)]:v.slice(2).split(',');
    t.rt=buildRoute(t.mode,ids,v.indexOf('m:')===0);
  }
  t.st={};t.idx=0;t.done=false;t.taken=null;
  ui.rtOpen=false;ui.rtOrder=[];ui.warn=null;save();
}
function routeHtml(){
  var t=S.trip,d=S.data,h='<div class="card"><div class="lbl">Маршрут</div><div class="addrow" style="align-items:center"><div style="flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere">'+esc(routeName())+'</div><button type="button" class="btn sm'+(ui.rtOpen?'':' pri')+'" data-act="rtopen">'+(ui.rtOpen?'Закрити':'Змінити маршрут')+'</button></div>';

  if(ui.rtOpen){

function kidPass(k){
  if(k.run==='1')return 1;
  if(k.run==='2')return 2;

  return c>=5?2:1;
}
function plan(){
  var pts=pointsList(),m=S.trip.mode,res={};
  S.data.kids.forEach(function(k){
    var b=-1,e=-1,i,j;
    if(m==='morning'){
      for(i=0;i<pts.length;i++)if(pts[i].id===k.stop){b=i;break;}
      if(b>=0)for(i=b+1;i<pts.length;i++)if(pts[i].school){e=i;break;}
    }else{
      var segs=[];
      for(i=0;i<pts.length;i++){
        if(!pts[i].school)continue;
        for(j=i+1;j<pts.length&&!pts[j].school;j++)if(pts[j].id===k.stop){segs.push([i,j]);break;}
      }
      var bat=kst(k.id).bAt,pick=null;
      if(typeof bat==='number'){
        for(i=0;i<segs.length;i++)if(segs[i][0]===bat)pick=segs[i];
        if(!pick&&bat>=0){for(j=bat+1;j<pts.length&&!pts[j].school;j++)if(pts[j].id===k.stop){pick=[bat,j];break;}}
      }
      if(!pick&&segs.length)pick=kidPass(k)===2?segs[segs.length-1]:segs[0];
      if(pick){b=pick[0];e=pick[1];}
    }
    res[k.id]={b:b,e:e};
  });
  return res;
}

function shareFile(name,text,mime){
  var C=window.Capacitor,P=C&&C.Plugins;
  if(P&&P.Filesystem&&P.Share){
    return P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'}).then(function(r){
      return P.Share.share({title:name,dialogTitle:'Надіслати файл',files:[r.uri]});
    }).then(function(){return 'ok';});
  }
  try{
    var b=new Blob([text],{type:mime}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){if(a.remove)a.remove();},500);
    return Promise.resolve('dl');
  }catch(e){return Promise.reject(e);}
}

function monthKey(ts){var d=new Date(ts),m=d.getMonth()+1;return d.getFullYear()+'-'+(m<10?'0':'')+m;}
function monthLabel(k){var a=k.split('-');return new Date(+a[0],+a[1]-1,1).toLocaleDateString('uk-UA',{month:'long',year:'numeric'});}
function histMonths(){
  var seen={},out=[];
  S.hist.slice().sort(function(a,b){return b.ts-a.ts;}).forEach(function(r){var k=monthKey(r.ts);if(!seen[k]){seen[k]=1;out.push(k);}});
  return out;
}
function csvCell(v){v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function csvRow(a){return a.map(csvCell).join(';');}
function monthCsv(mk){
  var recs=S.hist.filter(function(r){return monthKey(r.ts)===mk;}).sort(function(a,b){return a.ts-b.ts;});
  var sum={};
  S.data.kids.forEach(function(k){var st=stopById(k.stop);sum[nkey(k.name)]={n:k.name,c:k.cls||'',p:st?st.name:'',rode:0,abs:0,wait:0};});
  var det=[];
  recs.forEach(function(r){
    r.kids.forEach(function(x){
      var key=nkey(x.n),o=sum[key];
      if(!o)o=sum[key]={n:x.n,c:x.c||'',p:x.p||'',rode:0,abs:0,wait:0};
      var lab;
      if(x.s==='on'||x.s==='off'){o.rode++;lab='Їхав';}else if(x.s==='abs'){o.abs++;lab='Немає';}else{o.wait++;lab='Без відмітки';}
      det.push([new Date(r.ts).toLocaleDateString('uk-UA'),r.label||modeName(r.mode),modeName(r.mode),r.who||'',x.n,x.c||'',x.p||'',lab,x.i||'',x.o||'']);
    });
  });
  var L=[csvRow(['Звіт за '+monthLabel(mk)]),csvRow(['Рейсів у записах',recs.length]),'',
    csvRow(['Прізвище та ім’я','Клас','Зупинка','Рейсів їхав','Немає','Без відмітки'])];
  Object.keys(sum).map(function(k){return sum[k];}).sort(function(a,b){return a.n.localeCompare(b.n,'uk');}).forEach(function(o){
    L.push(csvRow([o.n,o.c,o.p,o.rode,o.abs,o.wait]));
  });
  L.push('');L.push(csvRow(['Деталі']));
  L.push(csvRow(['Дата','Рейс','Напрямок','Супроводжуючий','Прізвище та ім’я','Клас','Зупинка','Статус','Зайшов','Вийшов']));
  det.forEach(function(r){L.push(csvRow(r));});
  return L.join('\r\n');
}

function ptName(mode,i,rt){
  var tk=Array.isArray(rt)&&rt.length?rt:routeTokens(mode),t=tk[i];if(t===undefined)return '';
  if(t==='garage')return 'Гараж';
  if(t==='school'){var n=0;for(var j=0;j<=i;j++)if(tk[j]==='school')n++;return (S.data.school||'Школа')+(mode==='afternoon'?' · '+n+'-й рейс':'');}
  var st=stopById(t);return st?st.name:'';
}
function takeoverCand(){
  if(!syncOn()||S.trip.done)return null;
  for(var id in S.trip.st){if(S.trip.st[id]&&S.trip.st[id].s&&S.trip.st[id].s!=='wait')return null;}
  var best=null,dk=dayKey(Date.now());
  S.hist.forEach(function(r){
    if(r.imp&&r.live&&r.id!==S.trip.id&&dayKey(r.ts)===dk&&Date.now()-(r.upd||r.ts)<8*3600000&&(!best||(r.upd||0)>(best.upd||0)))best=r;
  });
  return best;
}
function banKey(){var c=takeoverCand();return (c?c.id+':'+c.upd:'')+'|'+(S.trip.taken||'')+'|'+(ui.gpsWarn?'g':'');}

  return '<div class="card"><h3>'+title+'</h3><label class="hint" for="rt-'+mode+'">Один пункт на рядок, у порядку руху. Пункт може повторюватись (наприклад, школа кілька разів). Можна писати назву зупинки, назву школи або слово «Гараж».</label>'+
    '<textarea class="rep" id="rt-'+mode+'" data-field="route" data-mode="'+mode+'" style="min-height:'+(60+routeTokens(mode).length*24)+'px">'+esc(ui.routeTxt&&ui.routeTxt[mode]!=null?ui.routeTxt[mode]:routeText(mode))+'</textarea>'+
    (er?'<div class="alert sev"><b>'+esc(er)+'</b></div>':'<div class="hint">'+(ui.routeOk===mode?'Збережено.':'Зміни зберігаються, коли ви виходите з поля.')+'</div>')+
    '<div><button type="button" class="btn sm" data-act="routereset" data-v="'+mode+'">Стандартний маршрут</button></div></div>';
}
function parseRoute(text){
  var out=[],bad=[],sn=sKey(S.data.school||'Школа');
  text.split(/\r?\n/).forEach(function(ln){
    var k=sKey(ln);if(!k)return;
    if(k===sn||k==='школа'||k==='ліцей'){out.push('school');return;}
    if(k==='гараж'){out.push('garage');return;}
    var st=S.data.stops.filter(function(x){return sKey(x.name)===k;})[0];
    if(!st){var c=S.data.stops.filter(function(x){return sKey(x.name).indexOf(k)===0||k.indexOf(sKey(x.name))===0;});if(c.length===1)st=c[0];}
    if(st)out.push(st.id);else bad.push(ln.trim());
  });
  return {tokens:out,bad:bad};
}

function keepDays(){var n=parseInt(S.data.keepDays,10);return n>0?n:90;}
function buildRec(){
  var t=S.trip;
  var sn=function(id){var s=stopById(id);return s?s.name:'';};
  var me=(S.data.me||'').trim();
  return {id:t.id,ts:Date.now(),mode:t.mode,idx:t.idx,label:tripLabel(),rt:Array.isArray(t.rt)?t.rt.slice():undefined,who:t.who0?(t.who0+' → '+me):me,kids:S.data.kids.map(function(k){var s=kst(k.id);return {n:k.name,c:k.cls||'',p:sn(k.stop),s:s.s,i:s.tin||'',o:s.tout||'',b:(typeof s.bAt==='number'?s.bAt:'')};})};
}
function putRec(rec){
  var at=-1;S.hist.forEach(function(r,j){if(r.id===rec.id)at=j;});
  if(at>=0)S.hist[at]=rec;else S.hist.push(rec);
}
function saveHist(){
  var rec=buildRec(),at=-1;
  S.hist.forEach(function(r,j){if(r.id===rec.id)at=j;});
  if(at>=0)rec.ts=S.hist[at].ts;
  putRec(rec);
  var cut=Date.now()-keepDays()*86400000;
  S.hist=S.hist.filter(function(r){return r.ts>=cut;});
  syncPush(rec,false);
  save();
}

/* ===== Синхронізація через інтернет (Firebase Realtime Database, REST) ===== */
var sync={st:'off',err:'',at:0,sent:{},ts:{},busy:false,tm:null,pt:null};
function syncOn(){var d=S.data;return !!(d.syncUrl&&d.syncRoom&&/^https:\/\//.test(d.syncUrl)&&String(d.syncRoom).length>=6);}
function syncBase(){return S.data.syncUrl.replace(/\/+$/,'');}
function syncRoom(){return String(S.data.syncRoom).replace(/[^A-Za-z0-9_-]/g,'');}
function devId(){if(!S.data.dev){S.data.dev=uid()+uid();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}return S.data.dev;}
function kcode(name){
  var s=nkey(name),a=2166136261,b=5381,i,c;
  for(i=0;i<s.length;i++){c=s.charCodeAt(i);a^=c;a=Math.imul(a,16777619)>>>0;b=(Math.imul(b,33)+c)>>>0;}
  return a.toString(36)+b.toString(36);
}
function syncPayload(rec,live){
  var k={};
  rec.kids.forEach(function(x){if(x.s==='on'||x.s==='off'||x.s==='abs')k[kcode(x.n)]=x.s+'|'+(x.i||'')+'|'+(x.o||'')+'|'+(typeof x.b==='number'?x.b:'');});
  var ts=(S.trip.id===rec.id&&S.trip.ts0)||sync.ts[rec.id]||(sync.ts[rec.id]=rec.ts);
  return {ts:ts,mode:rec.mode,pt:(typeof rec.idx==='number'?rec.idx:0),label:rec.label||'',who:rec.who||'',dev:devId(),live:!!live,upd:Date.now(),k:k};
}
function syncFetch(method,path,body){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},12000);
  return fetch(syncBase()+path,{method:method,body:body?JSON.stringify(body):undefined,headers:body?{'Content-Type':'application/json'}:undefined,signal:ctl?ctl.signal:undefined}).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();},function(e){clearTimeout(to);throw e;});
}
function syncPush(rec,live){
  if(!syncOn()||!rec)return;
  if(rec.id===S.trip.id&&S.trip.taken)return;
  var pl=syncPayload(rec,live),key=JSON.stringify([pl.k,pl.live,pl.who,pl.label,pl.mode,pl.pt]);
  if(sync.sent[rec.id]===key)return;
  syncFetch('PUT','/r/'+syncRoom()+'/'+rec.id+'.json',pl).then(function(){sync.sent[rec.id]=key;sync.st='ok';sync.at=Date.now();sync.err='';syncShow();},function(e){sync.st='err';sync.err=String(e&&e.message||e);syncShow();});
}
function syncSoon(){
  if(!syncOn())return;
  clearTimeout(sync.tm);
  sync.tm=setTimeout(function(){
    var t=S.trip,any=false;
    for(var id in t.st){if(t.st[id]&&t.st[id].s&&t.st[id].s!=='wait'){any=true;break;}}
    if(any&&!t.taken)syncPush(buildRec(),!t.done);
  },1200);
}
function syncPull(){
  if(!syncOn()||sync.busy)return Promise.resolve();
  sync.busy=true;
  return syncFetch('GET','/r/'+syncRoom()+'.json').then(function(data){
    sync.busy=false;sync.st='ok';sync.at=Date.now();sync.err='';
    var ch=syncMerge(data||{});
    syncShow(ch);
  },function(e){sync.busy=false;sync.st='err';sync.err=String(e&&e.message||e);syncShow();});
}
function syncMerge(data){
  var map={},ch=false,me=devId(),cut=Date.now()-keepDays()*86400000;
  S.data.kids.forEach(function(k){map[kcode(k.name)]=k;});
  Object.keys(data).forEach(function(id){
    var r=data[id];
    if(!r||typeof r!=='object'||r.dev===me||!r.k||!r.ts||r.ts<cut)return;
    if(id===S.trip.id){if(S.trip.taken!==String(r.who||'?')){S.trip.taken=String(r.who||'?');ch=true;}return;}
    var kids=[];
    Object.keys(r.k).forEach(function(c){
      var l=map[c];if(!l)return;
      var f=String(r.k[c]).split('|');
      if(['on','off','abs'].indexOf(f[0])<0)return;
      var st=stopById(l.stop);
      kids.push({n:l.name,c:l.cls||'',p:st?st.name:'',s:f[0],i:f[1]||'',o:f[2]||'',b:(f[3]!==undefined&&f[3]!==''?parseInt(f[3],10):'')});
    });
    if(!kids.length)return;
    var rec={id:id,ts:r.ts,mode:r.mode==='afternoon'?'afternoon':'morning',label:String(r.label||''),who:String(r.who||''),imp:true,live:!!r.live,upd:r.upd||0,idx:(typeof r.pt==='number'?r.pt:0),kids:kids};
    var at=-1;S.hist.forEach(function(x,j){if(x.id===id)at=j;});
    if(at>=0){if(JSON.stringify(S.hist[at])===JSON.stringify(rec))return;S.hist[at]=rec;}else S.hist.push(rec);
    ch=true;
  });
  if(ch)save();
  return ch;
}
function syncStatusText(){
  if(!syncOn())return 'Вимкнено: вкажіть адресу бази й код кімнати.';
  if(sync.st==='err')return 'Немає зв’язку ('+sync.err+'). Дані збережені на телефоні й надішлються, коли з’явиться інтернет.';
  if(sync.st==='ok')return 'Працює. Остання перевірка о '+fmtHm(sync.at)+'.';
  return 'Підключення…';
}
function syncShow(ch){
  var a=document.activeElement,typing=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');
  var el=document.getElementById('syncst');if(el)el.textContent=syncStatusText();
  if(ch&&!typing){
    if(ui.tab==='hist'&&!ui.hopen)render();
    else if(ui.tab==='trip'&&banKey()!==ui.banKey)render();
  }
}
function syncRestart(){
  sync.sent={};sync.st='off';clearInterval(sync.pt);
  if(!syncOn()){syncShow();return;}
  sync.st='';
  syncPull().then(function(){syncSoon();});
  sync.pt=setInterval(function(){if(document.visibilityState==='visible'){syncPull();syncSoon();}},8000);
}

/* ===== GPS: сигнал, якщо проїхали зупинку, а діти ще в автобусі ===== */
var gps={wid:null,last:null,near:{},knear:{},err:'',actx:null,bt:null};
function gdist(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r*Math.cos((a+c)/2*r);return Math.sqrt(x*x+y*y)*R;}
function gpsLearn(kind,kidId,solo){
  if(!S.data.gpsOn||!gps.last||Date.now()-gps.last.t>45000||gps.last.acc>80)return;
  var t=S.trip,p=pointsList()[t.idx];if(!p||p.school||p.garage)return;
  var k=null;S.data.kids.forEach(function(x){if(x.id===kidId)k=x;});
  if(!k||k.stop!==p.id)return;
  if(kind==='board'&&t.mode!=='morning')return;
  if(kind==='exit'&&t.mode!=='afternoon')return;
  S.data.gps=S.data.gps||{};
  var g=S.data.gps[p.id];
  if(!g){g={lat:gps.last.lat,lon:gps.last.lon,n:1};}
  else if(gdist(g.lat,g.lon,gps.last.lat,gps.last.lon)>400){g={lat:gps.last.lat,lon:gps.last.lon,n:1};}
  else{var n=Math.min(g.n,9);g={lat:(g.lat*n+gps.last.lat)/(n+1),lon:(g.lon*n+gps.last.lon)/(n+1),n:Math.min(g.n+1,10)};}
  S.data.gps[p.id]=g;
  /* окреме місце кожної дитини: діти одного села сідають і виходять у різних місцях */
  if(solo!==false){
    S.data.kgps=S.data.kgps||{};
    var h=S.data.kgps[kidId];
    if(!h){h={lat:gps.last.lat,lon:gps.last.lon,n:1};}
    else if(gdist(h.lat,h.lon,gps.last.lat,gps.last.lon)>400){h={lat:gps.last.lat,lon:gps.last.lon,n:1};}
    else{var m=Math.min(h.n,9);h={lat:(h.lat*m+gps.last.lat)/(m+1),lon:(h.lon*m+gps.last.lon)/(m+1),n:Math.min(h.n+1,10)};}
    S.data.kgps[kidId]=h;
  }
}
function gpsBeep(){
  try{
    if(!gps.actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)gps.actx=new AC();}
    var c=gps.actx;if(!c)return;
    if(c.resume)c.resume();
    [0,0.35,0.7].forEach(function(dt){
      var o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=880;g.gain.value=0.25;
      o.connect(g);g.connect(c.destination);o.start(c.currentTime+dt);o.stop(c.currentTime+dt+0.22);
    });
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([300,150,300,150,300]);}catch(e){}
}
function gpsBeepStop(){if(gps.bt){clearInterval(gps.bt);gps.bt=null;}}
function gpsAlarm(stopName,list){
  ui.gpsWarn={stop:stopName,names:names(list)};
  gpsBeep();gpsBeepStop();gps.bt=setInterval(function(){if(ui.gpsWarn)gpsBeep();else gpsBeepStop();},5000);
  if(ui.tab==='trip')render();
}
function gpsCheck(){
  var t=S.trip;
  if(!S.data.gpsOn||t.mode!=='afternoon'||t.done||!gps.last||gps.last.acc>100)return;
  var kg=S.data.kgps||{},alarm=[];
  /* діти, чиє місце вже запам'ятоване: перевіряємо кожну окремо */
  S.data.kids.forEach(function(k){
    var g=kg[k.id];if(!g)return;
    if(kst(k.id).s!=='on'){delete gps.knear[k.id];return;}
    var d=gdist(g.lat,g.lon,gps.last.lat,gps.last.lon);
    if(d<=100)gps.knear[k.id]=true;
    else if(gps.knear[k.id]&&d>=220){gps.knear[k.id]=false;alarm.push(k);}
  });
  /* решта дітей: за місцем зупинки */
  if(S.data.gps)S.data.stops.forEach(function(st){
    var g=S.data.gps[st.id];if(!g)return;
    var d=gdist(g.lat,g.lon,gps.last.lat,gps.last.lon);
    if(d<=100)gps.near[st.id]=true;
    else if(gps.near[st.id]&&d>=220){
      gps.near[st.id]=false;
      S.data.kids.forEach(function(k){if(k.stop===st.id&&!kg[k.id]&&kst(k.id).s==='on')alarm.push(k);});
    }
  });
  if(alarm.length){
    var seen={},nm=[];
    alarm.forEach(function(k){var s=stopById(k.stop);if(s&&!seen[s.id]){seen[s.id]=1;nm.push(s.name);}});
    gpsAlarm(nm.join(', '),alarm);
  }
}
function gpsOnPos(pos){
  gps.err='';
  gps.last={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy||999,t:Date.now()};
  gpsCheck();
  var el=document.getElementById('gpsst');if(el)el.textContent=gpsStatusText();
}
function gpsOnErr(e){
  gps.err=(e&&e.code===1)?'Немає дозволу на місцезнаходження. Дозвольте його в налаштуваннях телефону для цього застосунку.':'Не вдається визначити місцезнаходження.';
  var el=document.getElementById('gpsst');if(el)el.textContent=gpsStatusText();
}
function gpsStart(){
  if(gps.wid!==null||!S.data.gpsOn)return;
  if(!navigator.geolocation){gps.err='Цей пристрій не підтримує геолокацію.';return;}
  try{gps.wid=navigator.geolocation.watchPosition(gpsOnPos,gpsOnErr,{enableHighAccuracy:true,maximumAge:3000,timeout:30000});}catch(e){gpsOnErr(e);}
}
function gpsStop(){
  if(gps.wid!==null){try{navigator.geolocation.clearWatch(gps.wid);}catch(e){}gps.wid=null;}
  gps.last=null;gpsBeepStop();
}
function gpsStatusText(){
  if(!S.data.gpsOn)return 'Вимкнено.';
  var n=0;for(var id in (S.data.gps||{}))if(stopById(id))n++;
  var kn=0;for(var kid in (S.data.kgps||{}))kn++;
  var base='Запам’ятано зупинок: '+n+' з '+S.data.stops.length+(kn?', місць дітей: '+kn:'')+'. ';
  if(gps.err)return base+gps.err;
  if(!gps.last)return base+'Визначаю місцезнаходження…';

function render(){
  document.getElementById('tab-trip').setAttribute('aria-current',ui.tab==='trip'?'page':'false');
  document.getElementById('tab-hist').setAttribute('aria-current',ui.tab==='hist'?'page':'false');
  document.getElementById('tab-setup').setAttribute('aria-current',ui.tab==='setup'?'page':'false');
  app.innerHTML=ui.tab==='trip'?renderTrip():(ui.tab==='hist'?renderHist():renderSetup());
  var r=document.getElementById('route');
  if(r){var c=r.querySelector('.cur');if(c)r.scrollLeft=c.offsetLeft-r.clientWidth/2+c.offsetWidth/2;}
}

function markAbsent(list){list.forEach(function(k){setK(k.id,{s:'abs'});});}
function advance(){
  var pts=pointsList();
  ui.warn=null;
  if(S.trip.idx>=pts.length-1){S.trip.done=true;ui.copied=false;saveHist();if(bc.on)bcStop();}
  else S.trip.idx++;
  save();render();window.scrollTo(0,0);
}

app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v');
  if(a!=='delstop')ui.delStop=null;
  if(a!=='hdel')ui.hdel=null;
  if(a!=='hcopy')ui.hcopied=null;
  if(a!=='hclear')ui.hclear=false;
  if(['notify','copymsg','closemsg','notifysum'].indexOf(a)<0)ui.msg=null;
  if(['tshare','hshare','copyshr','closeshr'].indexOf(a)<0){ui.shr=null;ui.shrId=null;ui.shrOk=false;}
  if(a!=='import')ui.impMsg=null;
  if(a!=='copymsg')ui.bcMsg=false;
  var t=S.trip,d=S.data;
  if(a==='sharesite'){
    ui.msg='Шановні батьки та учні! Автобус виїхав у рейс. Відвідайте сайт і слідкуйте за ним на карті: '+BC_SITE;
    ui.copied2=false;ui.bcMsg=true;render();copyMsg();return;
  }
  if(a==='lostopen'){ui.lostOpen=true;ui.lostStatus='';render();lostLoad();return;}
  if(a==='lostclose'){ui.lostOpen=false;render();return;}
  if(a==='lostadd'){lostAdd();return;}
  if(a==='lostnophoto'){ui.lostPhoto='';render();return;}
  if(a==='lostdel'){lostDel(v);return;}
  if(a==='bcnote'){ui.bcNote=true;ui.bcNoteStatus='';render();return;}
  if(a==='bcnoteclose'){ui.bcNote=false;render();return;}
  if(a==='bcpreset'){ui.bcNoteText=BC_PRESETS[+v]||'';ui.bcNoteStatus='';render();return;}
  if(a==='bcnotepub'){bcNotePublish();return;}
  if(a==='bcnoteclear'){bcNoteClear();return;}
  if(a==='bcstart'){bcStart();return;}
  if(a==='bcstop'){bcStop();return;}
  if(a==='mode'){
    if(v===t.mode)return;
    if(Object.keys(t.st).length){ui.confirm='mode:'+v;}
    else{S.trip=newTrip(v);save();}
    render();return;
  }
  if(a==='rttog'){ui.rtOrder=ui.rtOrder||[];var ix=ui.rtOrder.indexOf(id);if(ix>=0)ui.rtOrder.splice(ix,1);else ui.rtOrder.push(id);render();return;}
  if(a==='rtrev'){ui.rtOrder=(ui.rtOrder||[]).slice().reverse();render();return;}
  if(a==='rtclr'){ui.rtOrder=[];render();return;}
  if(a==='rtopen'){ui.rtOpen=!ui.rtOpen;render();return;}
  if(a==='rtset'){
    if(Object.keys(t.st).length&&ui.confirm!=='rt:'+v){ui.confirm='rt:'+v;}
    else{ui.confirm=null;rtApply(v);}
    render();return;
  }
  if(a==='rtapply'){
    var ids=(ui.rtOrder||[]).slice();
    if(!ids.length)return;
    rtApply('m:'+ids.join(','));render();return;
  }
  if(a==='reset'){ui.confirm='reset';render();return;}
  if(a==='cno'){ui.confirm=null;render();return;}
  if(a==='cyes'){
    var mm=ui.confirm&&ui.confirm.indexOf('mode:')===0?ui.confirm.slice(5):t.mode;
    S.trip=newTrip(mm);ui.confirm=null;ui.warn=null;save();render();return;
  }
  if(a==='jump'){t.idx=+el.getAttribute('data-i');ui.warn=null;save();render();return;}
  if(a==='takeover'){
    var rc=null;S.hist.forEach(function(r){if(r.id===id)rc=r;});if(!rc)return;
    var nt=newTrip(rc.mode);nt.id=rc.id;nt.idx=rc.idx||0;nt.label=rc.label;if(Array.isArray(rc.rt)){nt.rt=rc.rt.filter(function(x){return x==='school'||x==='garage'||!!stopById(x);});if(!nt.rt.length)delete nt.rt;}nt.who0=rc.who;nt.ts0=rc.ts;
    var byN={};S.data.kids.forEach(function(k){byN[nkey(k.name)]=k;});
    rc.kids.forEach(function(x){var l=byN[nkey(x.n)];if(l)nt.st[l.id]={s:x.s,tin:x.i||null,tout:x.o||null,bAt:(typeof x.b==='number'?x.b:null)};});
    S.hist=S.hist.filter(function(r){return r.id!==id;});
    S.trip=nt;ui.warn=null;save();render();window.scrollTo(0,0);return;
  }
  if(a==='gpsok'){ui.gpsWarn=null;gpsBeepStop();render();return;}
  if(a==='gpsreset'){S.data.gps={};S.data.kgps={};gps.near={};gps.knear={};save();render();return;}
  if(a==='boardall'||a==='exitall'){
    var pp=pointsList()[t.idx],rr=rowsFor(pp),first=null,tm=now();
    rr.forEach(function(k){
      var c=kst(k.id);
      if(a==='boardall'&&c.s==='wait'){if(!first)first=k;t.st[k.id]={s:'on',tin:tm};}
      if(a==='exitall'&&c.s==='on'){if(!first)first=k;var o2={};for(var q in c)o2[q]=c[q];o2.s='off';o2.tout=tm;t.st[k.id]=o2;}
    });
    if(first)gpsLearn(a==='boardall'?'board':'exit',first.id,false);
    save();render();return;
  }
  if(a==='bksave'){
    var nm='shkilnyi-avtobus-kopiya-'+bkDate()+'.json';
    ui.bkMsg={t:'Готую файл…',ok:true};render();
    shareFile(nm,backupText(),'application/json').then(function(r){ui.bkMsg={t:r==='dl'?'Файл завантажено.':'Файл копії готовий. Оберіть, куди його надіслати.',ok:true};render();},function(){ui.bkMsg={t:'Не вдалося створити файл. Натисніть «Скопіювати текстом».',ok:false};render();});
    return;
  }
  if(a==='bkcopy'){copyText(backupText(),function(){ui.bkMsg={t:'Копію скопійовано. Вставте її у чат Viber із самим собою.',ok:true};render();},function(){ui.bkMsg={t:'Не вдалося скопіювати.',ok:false};render();});return;}
  if(a==='bkrestoretxt'){
    var bx=document.getElementById('bktxt'),bo=parseBackup(bx?bx.value:'');
    if(!bo){ui.bkMsg={t:'Не вдалося прочитати копію. Вставте весь текст файлу.',ok:false};ui.bkPending=null;}else{ui.bkMsg=null;ui.bkPending=bo;}
    render();return;
  }
  if(a==='bkyes'){if(ui.bkPending){applyBackup(ui.bkPending);ui.bkPending=null;ui.bkMsg={t:'Копію відновлено.',ok:true};}render();return;}
  if(a==='bkno'){ui.bkPending=null;render();return;}
  if(a==='csvshare'||a==='csvcopy'){
    var mk=ui.rm||histMonths()[0];if(!mk)return;
    var csv=monthCsv(mk),fn='zvit-'+mk+'.csv';
    if(a==='csvcopy'){copyText(csv,function(){ui.csvMsg={t:'Скопійовано. Можна вставити в таблицю чи повідомлення.',ok:true};render();},function(){ui.csvMsg={t:'Не вдалося скопіювати.',ok:false};render();});return;}
    shareFile(fn,'\ufeff'+csv,'text/csv').then(function(r){ui.csvMsg={t:r==='dl'?'Файл завантажено.':'Таблиця готова. Оберіть, куди її надіслати.',ok:true};render();},function(){ui.csvMsg={t:'Не вдалося створити файл. Натисніть «Скопіювати текстом».',ok:false};render();});
    return;
  }
  if(a==='board'){gpsLearn('board',id);setK(id,{s:'on',tin:now()});render();return;}
  if(a==='boardhere'){setK(id,{s:'on',tin:now(),bAt:t.idx});render();return;}
  if(a==='absent'){setK(id,{s:'abs'});render();return;}
  if(a==='exit'){gpsLearn('exit',id);setK(id,{s:'off',tout:now()});render();return;}
  if(a==='undo'){
    var cur=kst(id);
    if(cur.s==='off')setK(id,{s:'on',tout:null});
    else setK(id,{s:'wait',tin:null,tout:null,bAt:null});
    render();return;
  }
  if(a==='prev'){if(t.idx>0){t.idx--;ui.warn=null;save();render();window.scrollTo(0,0);}return;}
  if(a==='next'){
    var iss=issues();
    if(iss){ui.warn=iss;render();return;}
    advance();return;
  }
  if(a==='wstay'){ui.warn=null;render();return;}
  if(a==='wabs'){markAbsent(ui.warn.list);advance();return;}
  if(a==='wgo'){advance();return;}
  if(a==='notify'){ui.msg=parentMsg();ui.copied2=false;render();copyMsg();return;}
  if(a==='notifysum'){ui.msg=parentSum();ui.copied2=false;render();copyMsg();return;}
  if(a==='copymsg'){copyMsg();return;}
  if(a==='closemsg'){ui.msg=null;render();return;}
  if(a==='reopen'){t.done=false;ui.warn=null;save();render();return;}
  if(a==='editkid'){ui.edit=id;render();var en=document.getElementById('e-name');if(en&&en.focus)en.focus();return;}
  if(a==='cancelkid'){ui.edit=null;render();return;}
  if(a==='savekid'){
    var kk=null;d.kids.forEach(function(x){if(x.id===id)kk=x;});
    var nm2=document.getElementById('e-name').value.trim();
    if(kk&&nm2){kk.name=nm2;kk.cls=document.getElementById('e-cls').value.trim();var es=document.getElementById('e-stop').value;if(stopById(es))kk.stop=es;var ea=document.getElementById('e-away');if(ea){if(ea.value)kk.away=ea.value;else delete kk.away;}var er=document.getElementById('e-run');if(er){if(er.value==='1'||er.value==='2')kk.run=er.value;else delete kk.run;}var eg=document.getElementById('e-g');if(eg&&(eg.value==='f'||eg.value==='m'))kk.g=eg.value;save();}
    ui.edit=null;render();return;
  }
  if(a==='tshare'){ui.shr=recText(buildRec());ui.shrId='trip';ui.shrOk=false;render();copyShr();return;}
  if(a==='hshare'){var rr=null;S.hist.forEach(function(r){if(r.id===id)rr=r;});if(!rr)return;ui.shr=recText(rr);ui.shrId=id;ui.shrOk=false;render();copyShr();return;}
  if(a==='copyshr'){copyShr();return;}
  if(a==='closeshr'){ui.shr=null;ui.shrId=null;render();return;}
  if(a==='import'){
    var box=document.getElementById('imp');ui.imp=box?box.value:'';
    var rec=parseShare(ui.imp);
    if(!rec){ui.impMsg='Не вдалося прочитати. Скопіюйте весь текст рейсу, починаючи зі слова ШКАВТ1.';ui.impOk=false;render();return;}
    var had=S.hist.some(function(r){return r.id===rec.id;});
    putRec(rec);save();
    ui.impMsg=(had?'Рейс оновлено: ':'Рейс додано: ')+(rec.label||'')+(rec.who?', '+rec.who:'')+', '+rec.kids.length+' записів.';ui.impOk=true;ui.imp='';render();return;
  }
  if(a==='hopen'){ui.hopen=ui.hopen===id?null:id;ui.hdel=null;render();return;}
  if(a==='hcopy'){
    var rec=null;S.hist.forEach(function(r){if(r.id===id)rec=r;});if(!rec)return;
    var hta=document.getElementById('hrep-'+id);
    var hsel=function(){if(hta){hta.focus();hta.select();}};
    try{navigator.clipboard.writeText(histReport(rec)).then(function(){ui.hcopied=id;render();},hsel);}catch(er){hsel();}
    return;
  }
  if(a==='hdel'){if(ui.hdel===id){S.hist=S.hist.filter(function(r){return r.id!==id;});ui.hdel=null;ui.hopen=null;save();}else ui.hdel=id;render();return;}
  if(a==='hclear'){ui.hclear=true;render();return;}
  if(a==='hclearno'){ui.hclear=false;render();return;}
  if(a==='hclearyes'){S.hist=[];ui.hclear=false;ui.hopen=null;save();render();return;}
  if(a==='newtrip'){S.trip=newTrip(t.mode);ui.gpsWarn=null;ui.warn=null;save();render();window.scrollTo(0,0);return;}
  if(a==='copy'){
    var txt=reportText();
    var ta=document.getElementById('rep');
    var fallback=function(){if(ta){ta.focus();ta.select();}};
    try{
      navigator.clipboard.writeText(txt).then(function(){ui.copied=true;render();},fallback);
    }catch(err){fallback();}
    return;
  }
  if(a==='tab'){ui.edit=null;ui.tab=v;ui.hopen=null;ui.warn=null;render();window.scrollTo(0,0);return;}
  if(a==='clearex'){d.stops=[];d.routes=null;d.kids=[];d.example=false;S.trip=newTrip(t.mode);save();ui.tab='setup';render();return;}
  if(a==='routereset'){ensureRoutes();S.data.routes[v]=defaultRoute(v);ui.routeErr={};ui.routeTxt={};ui.routeOk=v;save();render();return;}
  if(a==='addstop'){
    var inp=document.getElementById('newstop'),nm=inp.value.trim();
    if(!nm)return;
    var nid=uid();d.stops.push({id:nid,name:nm});ensureRoutes();['morning','afternoon'].forEach(function(mo){var r=d.routes[mo];r.splice(Math.max(0,r.length-1),0,nid);});save();render();return;
  }
  if(a==='addkids'){
    var box=document.getElementById('add-'+id);
    var list=box.value.split(/[,;\n]+/).map(function(x){return x.trim();}).filter(Boolean);
    if(!list.length)return;
    list.forEach(function(n){d.kids.push({id:uid(),name:n,stop:id});});
    save();render();return;
  }
  if(a==='delkid'){
    d.kids=d.kids.filter(function(k){return k.id!==id;});
    delete t.st[id];save();render();return;
  }
  if(a==='delstop'){
    if(ui.delStop===id){
      d.kids.filter(function(k){return k.stop===id;}).forEach(function(k){delete t.st[k.id];});
      d.kids=d.kids.filter(function(k){return k.stop!==id;});
      d.stops=d.stops.filter(function(s){return s.id!==id;});
      if(d.routes){['morning','afternoon'].forEach(function(mo){d.routes[mo]=(d.routes[mo]||[]).filter(function(x){return x!==id;});});}
      ui.delStop=null;t.idx=0;save();render();
    }else{ui.delStop=id;render();}
    return;
  }
});

app.addEventListener('change',function(e){if(e.target&&e.target.id==='lost-f')lostPhotoPick(e.target.files&&e.target.files[0]);});
app.addEventListener('input',function(e){if(e.target&&e.target.id==='bcnote-t')ui.bcNoteText=e.target.value;if(e.target&&e.target.id==='lost-t')ui.lostText=e.target.value;});
app.addEventListener('change',function(e){
  var el=e.target,f=el.getAttribute&&el.getAttribute('data-field');
  if(!f)return;
  if(f==='me'){S.data.me=el.value.trim();save();}
  if(f==='tlabel'){S.trip.label=el.value;save();}
  if(f==='keep'){var kd=parseInt(el.value,10);S.data.keepDays=(kd>0&&kd<=365)?kd:90;save();}
  if(f==='group'){S.data.group=el.value.trim();save();}
  if(f==='rm'){ui.rm=el.value;ui.csvMsg=null;render();return;}
  if(f==='bkfile'){
    var fl=el.files&&el.files[0];if(!fl)return;
    var fr=new FileReader();
    fr.onload=function(){var bo=parseBackup(String(fr.result||''));if(!bo){ui.bkMsg={t:'Не вдалося прочитати файл копії.',ok:false};ui.bkPending=null;}else{ui.bkMsg=null;ui.bkPending=bo;}render();};
    fr.onerror=function(){ui.bkMsg={t:'Не вдалося відкрити файл.',ok:false};render();};
    fr.readAsText(fl);return;
  }
  if(f==='gpson'){S.data.gpsOn=!!el.checked;save();if(S.data.gpsOn)gpsStart();else gpsStop();render();return;}
  if(f==='route'){
    var md=el.getAttribute('data-mode'),pr=parseRoute(el.value);
    ui.routeTxt=ui.routeTxt||{};ui.routeErr=ui.routeErr||{};ui.routeOk=null;
    if(pr.bad.length||pr.tokens.length<2){ui.routeErr[md]=pr.bad.length?'Не знайдено: '+pr.bad.join('; ')+'. Напишіть назву так, як у списку зупинок.':'У маршруті має бути хоча б два пункти.';ui.routeTxt[md]=el.value;}
    else{ensureRoutes();S.data.routes[md]=pr.tokens;ui.routeErr[md]=null;ui.routeTxt[md]=null;ui.routeOk=md;if(S.trip.mode===md&&S.trip.idx>=pr.tokens.length)S.trip.idx=0;save();}
    render();return;
  }
  if(f==='surl'||f==='sroom'){var sv=el.value.trim();if(f==='sroom')sv=sv.replace(/[^A-Za-z0-9_-]/g,'');S.data[f==='surl'?'syncUrl':'syncRoom']=sv;el.value=sv;save();syncRestart();}
  if(f==='names'){S.data.showNames=el.checked;save();}
  if(f==='school'){S.data.school=el.value.trim()||'Школа';save();}
  if(f==='stop'){
    var s=stopById(el.getAttribute('data-id'));
    if(s&&el.value.trim()){s.name=el.value.trim();save();}
  }
});
app.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!e.target.hasAttribute||!e.target.hasAttribute('data-enter'))return;
  var b=e.target.parentNode.querySelector('button[data-act]');
  if(b)b.click();
});

function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
async function wake(){
  if(bc.on&&bc.bg){releaseWake();return;}
  try{if(navigator.wakeLock&&document.visibilityState==='visible')wakeLock=await navigator.wakeLock.request('screen');}catch(err){}
}
wake();
document.addEventListener('visibilitychange',wake);
document.getElementById('tab-trip').addEventListener('click',function(){ui.tab='trip';render();});
document.getElementById('tab-setup').addEventListener('click',function(){ui.tab='setup';render();});
document.getElementById('tab-hist').addEventListener('click',function(){ui.tab='hist';ui.hopen=null;render();});
app.addEventListener('input',function(e){
  if(e.target.id==='hq'){ui.hq=e.target.value;var r=document.getElementById('hres');if(r)r.innerHTML=histResults();}
});
try{ensureRoutes();}catch(e){}
gpsStart();
render();
syncRestart();
})();
