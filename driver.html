<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Автобус: передача місця</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #0E1512; color: #E8EFEA; font: 16px/1.4 system-ui, sans-serif; display: grid; place-items: center; padding: 20px; }
  main { width: 100%; max-width: 420px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 22px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 18px; cursor: pointer; background: #F4B400; color: #1A1A12; }
  button.stop { background: #2A3731; color: #E8EFEA; }
  button[hidden] { display: none; }
  .box { background: #16201B; border: 1px solid #2A3731; border-radius: 12px; padding: 14px; display: grid; gap: 6px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #93A39B; margin-right: 8px; }
  .dot.on { background: #4FBF9F; }
  .err { color: #FF8A80; }
  small { color: #93A39B; }
</style>
</head>
<body>
<main>
  <h1>Передача місця автобуса</h1>
  <button id="start">Почати рейс</button>
  <button id="stop" class="stop" hidden>Завершити рейс</button>
  <div class="box">
    <div><span class="dot" id="dot"></span><span id="state">Рейс не розпочато</span></div>
    <small id="last"></small>
    <small class="err" id="err"></small>
  </div>
  <small>Тримайте цю сторінку відкритою, а екран увімкненим: так телефон не припинить передавати місце. Не забудьте завершити рейс.</small>
</main>
<script src="config.js"></script>
<script>
(function () {
  var C = window.CONFIG, url = C.dbUrl + "/bus/" + C.key + ".json";
  var watchId = null, timer = null, latest = null, wake = null;
  var $ = function (id) { return document.getElementById(id); };
  function setErr(t) { $("err").textContent = t || ""; }
  function send() {
    if (!latest) { $("last").textContent = "Чекаю на сигнал GPS…"; return; }
    var c = latest.coords;
    fetch(url, { method: "PUT", body: JSON.stringify({ lat: c.latitude, lng: c.longitude, speed: c.speed || 0, heading: c.heading || 0, ts: Date.now() }) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); setErr(""); $("last").textContent = "Останнє оновлення: " + new Date().toLocaleTimeString("uk-UA"); })
      .catch(function (e) { setErr("Не вдалося надіслати: " + e.message); });
  }
  $("start").onclick = function () {
    if (!navigator.geolocation) { setErr("Цей браузер не підтримує GPS."); return; }
    watchId = navigator.geolocation.watchPosition(function (p) { latest = p; }, function (e) { setErr("GPS: " + e.message + ". Дозвольте доступ до місця."); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    timer = setInterval(send, 4000);
    if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (w) { wake = w; }).catch(function () {});
    $("start").hidden = true; $("stop").hidden = false;
    $("dot").className = "dot on"; $("state").textContent = "Рейс іде, місце передається";
  };
  $("stop").onclick = function () {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    clearInterval(timer); watchId = null; latest = null;
    if (wake) { wake.release(); wake = null; }
    fetch(url, { method: "DELETE" }).catch(function () {});
    $("start").hidden = false; $("stop").hidden = true;
    $("dot").className = "dot"; $("state").textContent = "Рейс завершено"; $("last").textContent = "";
  };
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && watchId !== null && navigator.wakeLock) navigator.wakeLock.request("screen").then(function (w) { wake = w; }).catch(function () {});
  });
})();
</script>
</body>
</html>
