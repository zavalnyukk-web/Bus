<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b2a22">
<title>Фізрук ловить м’ячі</title>
<style>
  :root { --y:#ffd23f; --g:#5fb08f; --ink:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; background:#0b130f; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; touch-action:none; }
  body { display:flex; flex-direction:column; align-items:center; padding:8px 12px 10px; gap:8px; }
  header { width:100%; max-width:440px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; font-weight:700; }
  header a { color:var(--y); text-decoration:none; white-space:nowrap; }
  header span { font-size:13px; text-align:center; }
  .wrap { position:relative; width:min(100%, 440px, calc((100vh - 170px) * 360 / 480)); aspect-ratio:360/480; min-width:240px; }
  @supports (height:100dvh) { .wrap { width:min(100%, 440px, calc((100dvh - 170px) * 360 / 480)); } }
  canvas { position:absolute; inset:0; width:100%; height:100%; border-radius:14px; display:block; touch-action:none; background:#000; }
  .ov { position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:9px; text-align:center; padding:14px; border-radius:14px; background:linear-gradient(rgba(8,14,10,.8),rgba(8,14,10,.9)), url(gym.jpg) center/cover; }
  .ov[hidden] { display:none; }
  .ov img.hero { width:auto; height:118px; border:0; border-radius:0; object-fit:contain; filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
  .ov img { width:120px; height:120px; border-radius:16px; object-fit:cover; object-position:top; border:2px solid var(--y); }
  .ov h1 { margin:0; font-size:22px; color:var(--y); } .ov p { margin:0; font-size:14px; line-height:1.4; max-width:300px; }
  .lv { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; max-width:300px; }
  .lv button, .go { font:inherit; font-weight:700; border:0; border-radius:12px; cursor:pointer; }
  .lv button { padding:10px 6px; font-size:14px; background:var(--y); color:#2a2200; line-height:1.25; }
  .lv button small { display:block; font-weight:600; font-size:11px; opacity:.75; }
  .go { font-size:18px; padding:12px 28px; background:var(--y); color:#2a2200; }
  .snd { font:inherit; font-size:12px; font-weight:700; padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff; cursor:pointer; }
  .pad { width:100%; max-width:440px; display:flex; justify-content:space-between; gap:10px; }
  .pad div { display:flex; gap:10px; }
  .pad button { width:76px; height:68px; font-size:28px; border:0; border-radius:14px; background:rgba(255,255,255,.14); color:#fff; touch-action:none; }
  .pad button.on { background:var(--y); color:#222; }
</style>
</head>
<body>
<header><a href="./">← На сайт</a><span id="lvlname">Фізрук ловить м’ячі</span><button class="snd" id="snd" type="button" aria-label="Звук"></button></header>
<div class="wrap">
  <canvas id="c" width="720" height="960" aria-label="Фізрук ловить м’ячі, що скочуються з чотирьох жолобів. Кнопки внизу або дотик до кутів екрана."></canvas>
  <div class="ov" id="ov">
    <img class="hero" src="art-win.png" alt="Фізрук Артурович">
    <h1 id="h">Фізрук ловить м’ячі</h1>
    <p id="txt">М’ячі скочуються з чотирьох жолобів. Переставляй Артуровича (кнопки або дотик до кутів екрана) і ловіть кошиком. Три пропущені м’ячі, і урок закінчено. Обери швидкість:</p>
    <div class="lv" id="lv"></div>
  </div>
</div>
<div class="pad" aria-label="Керування">
  <div><button data-p="0" type="button" aria-label="Вгору ліворуч">↖</button><button data-p="1" type="button" aria-label="Вниз ліворуч">↙</button></div>
  <div><button data-p="2" type="button" aria-label="Вгору праворуч">↗</button><button data-p="3" type="button" aria-label="Вниз праворуч">↘</button></div>
</div>
<script src="sfx.js"></script>
<script src="diff.js"></script>
<script src="config.js"></script>
<script src="track.js"></script>
<script src="meta.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var cv = $("c"), g = cv.getContext("2d"), W = 360, H = 480, FL = 440;
  var LEVELS = [
    { n: "Розминка", d: "повільно", tr: 3.4, iv: 1.6 },
    { n: "Урок", d: "середньо", tr: 2.7, iv: 1.25 },
    { n: "Змагання", d: "швидко", tr: 2.1, iv: 0.98 },
    { n: "Олімпіада", d: "дуже швидко", tr: 1.6, iv: 0.78 },
    { n: "Золоті м’ячі", d: "золотий = +3 очки", tr: 2.4, iv: 1.05, gold: 0.18 },
    { n: "Обережно, бомби!", d: "бомбу ловити не можна", tr: 2.3, iv: 1.0, bad: 0.2 },
    { n: "Гарячий день", d: "швидко, золото й бомби", tr: 1.9, iv: 0.85, gold: 0.15, bad: 0.2 },
    { n: "Марафон Артуровича", d: "найшвидший, усе разом", tr: 1.5, iv: 0.72, gold: 0.14, bad: 0.25 }
  ];
  var BALLS = ["⚽", "🏀", "🏐", "🎾", "🏈", "🥎"];
  // жолоби: початок -> кінець; потім падіння до кошика
  var CH = [
    { x0: -14, y0: 112, x1: 112, y1: 190, bx: 112, by: 292 },
    { x0: -14, y0: 232, x1: 112, y1: 300, bx: 112, by: 378 },
    { x0: 374, y0: 112, x1: 248, y1: 190, bx: 248, by: 292 },
    { x0: 374, y0: 232, x1: 248, y1: 300, bx: 248, by: 378 }
  ];
  var DROP = 0.5;
  function maxMiss() { return DIFF.pick(5, 3, 2) + (perk.life ? 1 : 0); }
  function ivK() { return DIFF.pick(1.25, 1, 0.85); }
  function trK() { return DIFF.pick(1.15, 1, 0.88); }
  
  var lvl = 0, st = "menu", pos = 0, balls = [], score = 0, miss = 0, tm = 0, spawn = 0, fx = [], flash = 0, speedK = 1, best = [0, 0, 0, 0, 0, 0, 0, 0], shock = 0, joy = 0, perk = { life: 0 }, coinsRun = 0, lastR = null;
  try { best = JSON.parse(localStorage.getItem("bus.egg.best") || "[]"); } catch (e) {} while (best.length < 8) best.push(0);
  var started = false;

  DIFF.mount($("ov"), $("lv"));
  DIFF.on(function () { if (st === "menu") menu(); });
  function menu() {
    st = "menu"; META.clear($("ov")); var lv = $("lv"); lv.innerHTML = "";
    LEVELS.forEach(function (L, i) {
      var b = document.createElement("button"); b.type = "button"; b.innerHTML = (i + 1) + ". " + L.n + "<small>" + L.d + " · рекорд " + (best[i] || 0) + "</small>";
      b.onclick = function () { SFXLIB.ac(); start(i); }; lv.appendChild(b);
    });
    $("ov").hidden = false;
  }
  function start(i) {
    perk = META.begin("egg"); coinsRun = 0; lvl = i; score = 0; miss = 0; balls = []; fx = []; spawn = 1; tm = 0; speedK = DIFF.pick(0.9, 1, 1.12); pos = 0; flash = 0; shock = 0; joy = 0; st = "play"; $("ov").hidden = true;
    $("lvlname").textContent = LEVELS[i].n;
    if (!started) { started = true; try { if (window.trackPlay) window.trackPlay("egg"); } catch (e) {} }
  }
  function landings(ch) { return balls.filter(function (b) { return !b.done; }).map(function (b) { return { t: b.t0 + b.tr + DROP, c: b.c }; }); }
  function trySpawn() {
    var L = LEVELS[lvl], tr = L.tr * trK() / speedK, c = Math.floor(Math.random() * 4), land = tm + tr + DROP, ok = true, gap = Math.max(0.45, 0.8 / speedK);
    landings().forEach(function (l) { if (Math.abs(l.t - land) < (l.c === c ? 0.35 : gap)) ok = false; });
    if (!ok) return false;
    var bad = Math.random() < (L.bad || 0), gold = !bad && Math.random() < (L.gold || 0);
    balls.push({ bad: bad, gold: gold, c: c, k: Math.floor(Math.random() * 5), t0: tm, tr: tr, rot: 0, done: false, ph: "roll", fy: 0, vx: 0, vy: 0, x: 0, y: 0 });
    return true;
  }
  function update(dt) {
    if (st !== "play") return;
    tm += dt; var L = LEVELS[lvl]; if (flash > 0) flash -= dt; if (shock > 0) shock -= dt; if (joy > 0) joy -= dt;
    spawn -= dt;
    if (spawn <= 0) { if (trySpawn()) spawn = L.iv * ivK() / speedK * (0.75 + Math.random() * 0.5); else spawn = 0.12; }
    balls.forEach(function (b) {
      var C = CH[b.c], el = tm - b.t0;
      if (b.ph === "roll") {
        var k = Math.min(1, el / b.tr); b.x = C.x0 + (C.x1 - C.x0) * k; b.y = C.y0 + (C.y1 - C.y0) * k - 10; b.rot += dt * (C.x1 > C.x0 ? 1 : -1) * (6 + 3 * speedK);
        if (k >= 1) { b.ph = "drop"; b.dt = 0; }
      } else if (b.ph === "drop") {
        b.dt += dt; var q = Math.min(1, b.dt / DROP); b.x = C.x1; b.y = C.y1 - 10 + (C.by - 16 - (C.y1 - 10)) * q * q; b.rot += dt * 4;
        if (b.dt >= DROP) {
          if (pos === b.c && b.bad) { b.ph = "done"; b.done = true; miss++; flash = 0.4; shock = 0.6; SFXLIB.noise(0.4, 0.4, 300); SFXLIB.tone(120, 0.4, "sawtooth", 0.25, 0, 40); fx.push({ x: C.bx, y: C.by - 30, t: 0, s: "БУМ!", c: "#ff5060" }); if (miss >= maxMiss()) over(); }
          else if (b.bad) { b.ph = "done"; b.done = true; fx.push({ x: C.bx, y: C.by - 30, t: 0, s: "ухилився", c: "#9ad0ff" }); }
          else if (pos === b.c) { b.ph = "done"; b.done = true; var gp = b.gold ? 3 : 1; score += gp; if (b.gold) coinsRun += 2; joy = 0.35; SFXLIB.seq(b.gold ? [988, 1319, 1760] : [740, 988], 0.05, "triangle", 0.2); fx.push({ x: C.bx, y: C.by - 30, t: 0, s: "+" + gp, c: b.gold ? "#ffec6a" : "#ffd23f" });
            if (score % 10 === 0) { speedK = Math.min(2.4, speedK + 0.08); SFXLIB.seq([523, 659, 784], 0.07, "square", 0.12); fx.push({ x: 180, y: 120, t: 0, s: "Швидше!", c: "#5fb08f" }); } }
          else { b.ph = "fall"; b.vx = (C.x1 < 180 ? -1 : 1) * 60; b.vy = -140; }
        }
      } else if (b.ph === "fall") {
        b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += dt * 8;
        if (b.y >= FL - 10) { b.y = FL - 10; b.vy = -b.vy * 0.45; b.vx *= 0.8; if (!b.hit) { b.hit = 1; miss++; flash = 0.4; shock = 0.6; SFXLIB.tone(200, 0.35, "sawtooth", 0.18, 0, 70); fx.push({ x: b.x, y: FL - 30, t: 0, s: "ОЙ!", c: "#ff5060" }); if (miss >= maxMiss()) over(); } }
        if (b.x < -30 || b.x > W + 30) { b.ph = "done"; b.done = true; }
      }
    });
    balls = balls.filter(function (b) { return b.ph !== "done" || false; }).concat([]);
    fx.forEach(function (f) { f.t += dt; }); fx = fx.filter(function (f) { return f.t < 0.9; });
  }
  function over() {
    st = "over"; SFXLIB.seq([400, 330, 260, 200], 0.14, "sawtooth", 0.15);
    var rEnd = META.end("egg", { pts: Math.round(score * 5 * (1 + lvl * 0.3) * DIFF.pick(0.7, 1, 1.4)), coins: Math.floor(score / 4) + coinsRun }); lastR = rEnd;
    var nb = score > (best[lvl] || 0); if (nb) { best[lvl] = score; try { localStorage.setItem("bus.egg.best", JSON.stringify(best)); } catch (e) {} }
    setTimeout(function () {
      $("h").textContent = "Урок закінчено!";
      $("txt").textContent = "Піймано м’ячів: " + score + (nb ? ". Новий рекорд! 🎉" : ". Рекорд рівня: " + best[lvl] + ".") + " Обери швидкість для нової гри:";
      menu(); META.gain(lastR, $("ov"));
    }, 900);
  }

  /* ---------- малювання (32-біт: градієнти, тіні, згладжування) ---------- */
  function lg(x0, y0, x1, y1, st) { var gr = g.createLinearGradient(x0, y0, x1, y1); st.forEach(function (q) { gr.addColorStop(q[0], q[1]); }); return gr; }
  function rg(x, y, r0, r1, st) { var gr = g.createRadialGradient(x, y, r0, x, y, r1); st.forEach(function (q) { gr.addColorStop(q[0], q[1]); }); return gr; }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function el(x, y, rx, ry, f, rot) { g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, 7); g.fillStyle = f; g.fill(); }
  function seg(x0, y0, x1, y1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }

  var bgc = null;
  function makeBg() {
    bgc = document.createElement("canvas"); bgc.width = 720; bgc.height = 960; var b = bgc.getContext("2d"), t = g; g = b; g.scale(2, 2);
    g.fillStyle = lg(0, 0, 0, 250, [[0, "#c9c6ba"], [1, "#f1efe6"]]); g.fillRect(0, 0, 360, 252);
    g.fillStyle = lg(0, 250, 0, 392, [[0, "#78c7a4"], [1, "#3f8f70"]]); g.fillRect(0, 250, 360, 142);
    g.fillStyle = "rgba(255,255,255,.7)"; g.fillRect(0, 248, 360, 4); g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(0, 252, 360, 3);
    g.fillStyle = "rgba(0,0,0,.08)"; for (var i = 1; i < 6; i++) g.fillRect(i * 60, 252, 1.5, 140);
    g.fillStyle = "#2d3b34"; g.fillRect(0, 384, 360, 8);
    g.fillStyle = "#6a6258"; g.fillRect(0, 0, 360, 12); g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(0, 12, 360, 10);
    [28, 150, 272].forEach(function (x) {
      g.fillStyle = "#55595f"; rr(g, x - 3, 33, 66, 62, 3); g.fill();
      g.fillStyle = lg(0, 36, 0, 92, [[0, "#9fd2f5"], [1, "#eaf7ff"]]); g.fillRect(x, 36, 60, 56);
      g.fillStyle = "rgba(255,255,255,.45)"; g.beginPath(); g.moveTo(x + 6, 92); g.lineTo(x + 24, 36); g.lineTo(x + 36, 36); g.lineTo(x + 18, 92); g.fill();
      g.fillStyle = "#55595f"; g.fillRect(x + 28, 36, 4, 56); g.fillRect(x, 62, 60, 4);
    });
    // кошик на стіні
    g.fillStyle = "#4a4f57"; g.fillRect(177, 22, 6, 100);
    g.fillStyle = "rgba(0,0,0,.2)"; rr(g, 153, 124, 60, 44, 3); g.fill();
    g.fillStyle = "#f8f8f6"; rr(g, 150, 120, 60, 44, 3); g.fill(); g.strokeStyle = "#9aa0a8"; g.lineWidth = 2; g.stroke();
    g.strokeStyle = "#e0561c"; g.lineWidth = 2; g.strokeRect(166, 140, 28, 20);
    g.strokeStyle = "#e0561c"; g.lineWidth = 3.5; g.beginPath(); g.ellipse(180, 168, 15, 4.5, 0, 0, 7); g.stroke();
    g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 1; for (var n = -12; n <= 12; n += 6) { g.beginPath(); g.moveTo(180 + n, 169); g.lineTo(180 + n * 0.6, 190); g.stroke(); } g.beginPath(); g.moveTo(170, 178); g.lineTo(190, 178); g.stroke();
    // банер
    g.fillStyle = lg(0, 206, 0, 236, [[0, "#2f63c4"], [1, "#1b3f8f"]]); rr(g, 104, 206, 152, 30, 4); g.fill(); g.strokeStyle = "#ffd23f"; g.lineWidth = 2; g.stroke();
    g.fillStyle = "#ffd23f"; g.font = "bold 12px system-ui,sans-serif"; g.textAlign = "center"; g.fillText("КУНІВСЬКИЙ ЛІЦЕЙ", 180, 226); g.textAlign = "left";
    // підлога
    g.fillStyle = lg(0, 392, 0, 480, [[0, "#d7a05a"], [1, "#a8672f"]]); g.fillRect(0, 392, 360, 88);
    g.lineWidth = 1; g.strokeStyle = "rgba(70,35,8,.28)"; for (var k = 1; k <= 8; k++) { var yy = 392 + 88 * Math.pow(k / 8, 1.6); g.beginPath(); g.moveTo(0, yy); g.lineTo(360, yy); g.stroke(); }
    for (var xx = -360; xx <= 720; xx += 40) { g.beginPath(); g.moveTo(180 + (xx - 180) * 0.2, 392); g.lineTo(xx, 480); g.stroke(); }
    g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 2.5; g.beginPath(); g.ellipse(180, 486, 140, 30, 0, Math.PI, 2 * Math.PI); g.stroke();
    g.fillStyle = lg(0, 392, 0, 480, [[0, "rgba(255,255,255,.28)"], [0.4, "rgba(255,255,255,0)"]]); g.fillRect(0, 392, 360, 88);
    g.fillStyle = "rgba(0,0,0,.28)"; g.fillRect(0, 389, 360, 3);
    g.fillStyle = rg(180, 250, 120, 330, [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,.5)"]]); g.fillRect(0, 0, 360, 480);
    g = t;
  }
  makeBg();

  function drawBomb(x, y, rot) {
    g.save(); g.translate(x, y); g.fillStyle = "rgba(0,0,0,.25)"; g.beginPath(); g.ellipse(2, 3, 12, 12, 0, 0, 7); g.fill();
    g.beginPath(); g.arc(0, 0, 12, 0, 7); g.fillStyle = rg(-4, -4, 1, 14, [[0, "#6b6f78"], [1, "#14161a"]]); g.fill(); g.strokeStyle = "#e63946"; g.lineWidth = 2.2; g.lineCap = "round"; g.beginPath(); g.moveTo(-4, -4); g.lineTo(4, 4); g.moveTo(4, -4); g.lineTo(-4, 4); g.stroke();
    g.strokeStyle = "#c8a96a"; g.lineWidth = 2; g.beginPath(); g.moveTo(5, -10); g.quadraticCurveTo(10, -16, 14, -13); g.stroke(); g.fillStyle = (Math.floor(tm * 12) % 2) ? "#ffd23f" : "#ff7a1a"; g.beginPath(); g.arc(14.5, -13.5, 3, 0, 7); g.fill(); g.restore();
  }
  function drawGold(x, y, rot) {
    g.save(); g.translate(x, y); g.fillStyle = "rgba(255,225,90,.35)"; g.beginPath(); g.arc(0, 0, 18, 0, 7); g.fill(); g.beginPath(); g.arc(0, 0, 12, 0, 7); g.fillStyle = rg(-4, -4, 1, 14, [[0, "#fff8b0"], [0.55, "#ffd700"], [1, "#a8780a"]]); g.fill(); g.strokeStyle = "#8b6914"; g.lineWidth = 1.2; g.stroke();
    g.rotate(rot); g.fillStyle = "#8b6914"; g.font = "bold 13px system-ui"; g.textAlign = "center"; g.fillText("★", 0, 4.5); g.restore();
  }
  function drawBall(k, x, y, rot, r) {
    r = r || 12; g.save(); g.translate(x, y); g.scale(r / 12, r / 12);
    g.fillStyle = "rgba(0,0,0,.22)"; g.beginPath(); g.ellipse(2, 3, 12, 12, 0, 0, 7); g.fill();
    if (k === 4) {
      g.rotate(rot * 0.5); g.beginPath(); g.ellipse(0, 0, 14, 8.5, 0, 0, 7); g.fillStyle = lg(0, -8, 0, 8, [[0, "#c98446"], [1, "#6a3814"]]); g.fill(); g.strokeStyle = "rgba(0,0,0,.55)"; g.lineWidth = 1.2; g.stroke();
      g.strokeStyle = "#f4f4f0"; g.lineWidth = 1.6; g.beginPath(); g.moveTo(-3, 0); g.lineTo(3, 0); g.stroke(); for (var q = -2; q <= 2; q += 2) { g.beginPath(); g.moveTo(q, -2); g.lineTo(q, 2); g.stroke(); }
      g.beginPath(); g.moveTo(-9, -6); g.quadraticCurveTo(-11, 0, -9, 6); g.moveTo(9, -6); g.quadraticCurveTo(11, 0, 9, 6); g.stroke();
    } else {
      var base = [["#ffffff", "#c9ced6"], ["#ffb25e", "#cf5a14"], ["#fff6d2", "#e4d9a8"], ["#ecff62", "#9cc218"]][k];
