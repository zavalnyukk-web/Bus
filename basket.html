<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1209">
<title>Бульдозер: баскетбол</title>
<style>
  :root { --amber:#FF9F1C; --ink:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; background:#0c0804; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; touch-action:none; }
  body { display:flex; flex-direction:column; align-items:center; padding:8px 12px 12px; gap:8px; }
  header { width:100%; max-width:440px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; font-weight:700; }
  header a { color:var(--amber); text-decoration:none; white-space:nowrap; }
  header span { white-space:nowrap; font-size:13px; }
  .wrap { position:relative; width:min(100%, 440px, calc((100vh - 110px) * 360 / 560)); aspect-ratio:360/560; min-width:240px; }
  @supports (height:100dvh) { .wrap { width:min(100%, 440px, calc((100dvh - 110px) * 360 / 560)); } }
  canvas { position:absolute; inset:0; width:100%; height:100%; border-radius:14px; display:block; touch-action:none; }
  .ov { position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:10px; text-align:center; padding:18px; background:rgba(10,6,2,.86); border-radius:14px; }
  .ov[hidden] { display:none; }
  .ov img { width:150px; height:150px; border-radius:16px; object-fit:cover; }
  .ov h1 { margin:0; font-size:22px; color:var(--amber); } .ov p { margin:0; font-size:14.5px; line-height:1.4; max-width:290px; }
  .lvl { font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--amber); font-weight:700; }
  .go { font:inherit; font-size:18px; font-weight:700; padding:13px 28px; border:0; border-radius:12px; background:var(--amber); color:#2a1700; cursor:pointer; }
</style>
</head>
<body>
<header><a href="./">← На сайт</a><span id="lvlname"></span></header>
<div class="wrap">
  <canvas id="c" width="360" height="560" aria-label="Гра у баскетбол: потягніть м’яч назад і відпустіть"></canvas>
  <div class="ov" id="ov">
    <img src="buldozer-logo.jpg" alt="Бульдозер, Кунівський ліцей">
    <div class="lvl" id="lvl"></div>
    <h1 id="h">Бульдозер</h1>
    <p id="txt"></p>
    <button class="go" id="go" type="button">Грати</button>
  </div>
</div>
<script>
(function () {
  var cv = document.getElementById("c"), g = cv.getContext("2d"), W = 360, H = 560, FLOOR = 520, R = 14, G = 0.35, BX = 60, BY = 470;
  var $ = function (i) { return document.getElementById(i); };
  var LV = [
    { name: "Розминка", goal: 3, shots: 8, hx: 250, hy: 240, move: 0, rnd: 0, txt: "Тягніть м’яч назад і відпускайте: чим довше потягнули, тим сильніше кидок. Заб’йте 3 з 8." },
    { name: "Штрафні", goal: 4, shots: 8, hx: 265, hy: 205, move: 0, rnd: 50, txt: "Кільце вище, а м’яч щоразу з іншого місця. Заб’йте 4 з 8." },
    { name: "Рухоме кільце", goal: 5, shots: 8, hx: 235, hy: 215, move: 38, rnd: 60, txt: "Кільце їздить вліво-вправо. Заб’йте 5 з 8." },
    { name: "Фінал", goal: 6, shots: 8, hx: 225, hy: 195, move: 60, rnd: 70, txt: "Високо, далеко й швидко. Заб’йте 6 з 8, і ліцей святкуватиме!" }
  ];
  var logo = new Image(); logo.src = "buldozer-logo.jpg";
  var lvl = 0, saved = 0, run = false, makes = 0, used = 0, pts = 0, ball, state, hoopX, hoopY, tm = 0, drag = null, msg = "", msgT = 0, rimTouched = false, bounces = 0, age = 0, bx0 = BX, scored = false;
  try { saved = +localStorage.getItem("bus.basket.level") || 0; } catch (e) {}
  var RW = 54;
  function hud() { $("lvlname").textContent = "Рів. " + (lvl + 1) + " · " + makes + "/" + LV[lvl].goal + " · кидків " + (LV[lvl].shots - used) + " · очок " + pts; }
  function curHX() { var L = LV[lvl]; return L.hx + (L.move ? Math.sin(tm / 60) * L.move : 0); }
  function newLevel(l) { lvl = l; makes = 0; used = 0; pts = l === 0 ? 0 : pts; tm = 0; nextShot(); }
  function nextShot() {
    var L = LV[lvl]; bx0 = BX + (L.rnd ? Math.random() * L.rnd : 0);
    ball = { x: bx0, y: BY, vx: 0, vy: 0 }; state = "aim"; rimTouched = false; bounces = 0; age = 0; scored = false; hoopX = curHX(); hoopY = L.hy; hud();
  }
  function circ(px, py, r) {
    var dx = ball.x - px, dy = ball.y - py, d = Math.hypot(dx, dy);
    if (d < R + r && d > 0) {
      var nx = dx / d, ny = dy / d; ball.x = px + nx * (R + r); ball.y = py + ny * (R + r);
      var dot = ball.vx * nx + ball.vy * ny; if (dot < 0) { ball.vx -= 1.6 * dot * nx; ball.vy -= 1.6 * dot * ny; ball.vx *= 0.9; ball.vy *= 0.9; rimTouched = true; }
    }
  }
  function physics(b, hx, hy) {
    var prevY = b.y; b.vy += G; b.x += b.vx; b.y += b.vy;
    var xB = hx + RW, bbx = xB + 6;
    // щит
    if (b.x + R > bbx && b.x - R < bbx + 8 && b.y > hy - 78 && b.y < hy + 12) {
      if (b.vx > 0) { b.x = bbx - R; b.vx = -b.vx * 0.6; rimTouched = true; }
    }
    circ(hx, hy, 4); circ(xB, hy, 4);
    var sc = false;
    if (prevY < hy && b.y >= hy && b.vy > 0 && b.x > hx + 6 && b.x < xB - 2) sc = true;
    return sc;
  }
  function shoot(vx, vy) { if (state !== "aim") return; ball.vx = vx; ball.vy = vy; state = "fly"; used++; hud(); }
  function update() {
    tm++;
    var L = LV[lvl];
    if (state === "aim") { hoopX = curHX(); return; }
    if (state === "fly") {
      hoopX = curHX(); age++;
      if (physics(ball, hoopX, hoopY) && !scored) { scored = true; makes++; var p = rimTouched ? 2 : 3; pts += p; msg = rimTouched ? "Є! +2" : "Чисто! +3"; msgT = 60; hud(); }
      if (ball.y > FLOOR - R && ball.vy > 0) { ball.y = FLOOR - R; ball.vy *= -0.55; ball.vx *= 0.8; bounces++; }
      if (ball.x < -30 || ball.x > W + 30 || bounces >= 2 || age > 420) endShot();
    } else if (state === "pause") { if (--wait <= 0) afterShot(); }
  }
  var wait = 0;
  function endShot() {
    if (!scored) { msg = "Мимо"; msgT = 40; }
    state = "pause"; wait = 36;
  }
  function afterShot() {
    var L = LV[lvl];
    if (makes >= L.goal) return win();
    if (used >= L.shots) return lose();
    nextShot();
  }
  function draw() {
    var L = LV[lvl];
    var gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#2a1a0a"); gr.addColorStop(1, "#150d05"); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = "rgba(255,159,28,.07)"; for (var i = 0; i < 6; i++) g.fillRect(i * 64, 0, 30, FLOOR);
    g.fillStyle = "#b9722e"; g.fillRect(0, FLOOR, W, H - FLOOR); g.fillStyle = "#e8d6b8"; g.fillRect(0, FLOOR, W, 3);
    var hx = hoopX, hy = hoopY, xB = hx + RW;
    // щит з логотипом
    g.fillStyle = "#f2f2f2"; g.fillRect(xB + 6, hy - 78, 8, 90);
    g.fillStyle = "#fff"; g.fillRect(xB + 14, hy - 78, 4, 90);
    g.fillStyle = "#fff"; g.fillRect(xB - 6, hy - 70, 12, 3);
    // стійка
    g.fillStyle = "#555"; g.fillRect(xB + 16, hy + 12, 10, FLOOR - hy - 12);
    // кільце
    g.strokeStyle = "#ff5a1f"; g.lineWidth = 6; g.lineCap = "round"; g.beginPath(); g.moveTo(hx, hy); g.lineTo(xB, hy); g.stroke();
    // сітка
    g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 1.5;
    for (var k = 0; k <= 4; k++) { g.beginPath(); g.moveTo(hx + k * RW / 4, hy + 3); g.lineTo(hx + 8 + k * (RW - 16) / 4, hy + 38); g.stroke(); }
    g.beginPath(); g.moveTo(hx + 4, hy + 18); g.lineTo(xB - 4, hy + 18); g.stroke();
    // логотип на щиті (вертикально, на стійці)
    if (logo.complete && logo.naturalWidth) g.drawImage(logo, 10, 10, 64, 64);
    // прицілювання
    if (state === "aim" && drag) {
      var v = dragV(); var b = { x: ball.x, y: ball.y, vx: v.x, vy: v.y }, saveRim = rimTouched;
      g.fillStyle = "rgba(255,255,255,.7)";
      for (var s = 0; s < 40; s++) { b.vy += G; b.x += b.vx; b.y += b.vy; if (s % 3 === 0) { g.beginPath(); g.arc(b.x, b.y, 2.5, 0, 7); g.fill(); } if (b.y > FLOOR) break; }
      rimTouched = saveRim;
    }
    // тінь, м'яч
    g.fillStyle = "rgba(0,0,0,.3)"; g.beginPath(); g.ellipse(ball.x, FLOOR + 8, 12, 4, 0, 0, 7); g.fill();
    g.fillStyle = "#ff8a1f"; g.beginPath(); g.arc(ball.x, ball.y, R, 0, 7); g.fill();
    g.strokeStyle = "#3a1c05"; g.lineWidth = 1.5; g.beginPath(); g.arc(ball.x, ball.y, R, 0, 7); g.moveTo(ball.x - R, ball.y); g.lineTo(ball.x + R, ball.y); g.moveTo(ball.x, ball.y - R); g.lineTo(ball.x, ball.y + R); g.stroke();
    if (msgT > 0) { msgT--; g.textAlign = "center"; g.font = "bold 28px system-ui,sans-serif"; g.fillStyle = "#FF9F1C"; g.fillText(msg, W / 2, 120); }
  }
  function dragV() {
    var dx = drag.sx - drag.x, dy = drag.sy - drag.y, m = Math.hypot(dx, dy), k = 0.16, mx = 17;
    var vx = dx * k, vy = dy * k, sp = Math.hypot(vx, vy); if (sp > mx) { vx *= mx / sp; vy *= mx / sp; }
    if (vy > -1) vy = -1; return { x: vx, y: vy };
  }
  var acc = 0, last = 0;
  function loop(now) {
    if (!run) return;
    acc += Math.min(50, now - last); last = now;
    while (acc >= 1000 / 60) { acc -= 1000 / 60; update(); if (!run) return; }
    draw(); requestAnimationFrame(loop);
  }
  function pt(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  cv.addEventListener("pointerdown", function (e) { if (!run || state !== "aim") return; var p = pt(e); drag = { sx: p.x, sy: p.y, x: p.x, y: p.y }; cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener("pointermove", function (e) { if (!drag) return; var p = pt(e); drag.x = p.x; drag.y = p.y; });
  function release() { if (!drag) return; var d = Math.hypot(drag.sx - drag.x, drag.sy - drag.y); var v = dragV(); drag = null; if (d > 18) shoot(v.x, v.y); }
  cv.addEventListener("pointerup", release); cv.addEventListener("pointercancel", function () { drag = null; });
  function show(l, h, txt, btn) { $("lvl").textContent = l; $("h").textContent = h; $("txt").textContent = txt; $("go").textContent = btn; $("ov").hidden = false; }
  function win() {
    run = false; draw();
    if (lvl + 1 < LV.length) { saved = Math.max(saved, lvl + 1); try { localStorage.setItem("bus.basket.level", String(saved)); } catch (e) {} show("Очок: " + pts, "Рівень пройдено!", "Далі: " + LV[lvl + 1].name + ". " + LV[lvl + 1].txt, "Наступний рівень"); $("go").dataset.n = "next"; }
    else { saved = 0; try { localStorage.setItem("bus.basket.level", "0"); } catch (e) {} show("Усього очок: " + pts, "Бульдозер переміг!", "Ви пройшли всі рівні. Кунівський ліцей пишається вами!", "Грати ще раз"); $("go").dataset.n = "again"; }
  }
  function lose() { run = false; draw(); show("Закинуто " + makes + " з " + LV[lvl].goal, "Кидки закінчилися", "Трохи не вистачило. Спробуйте ще раз цей рівень.", "Ще раз"); $("go").dataset.n = "retry"; }
  function start() { $("ov").hidden = true; run = true; acc = 0; last = performance.now(); requestAnimationFrame(loop); }
  $("go").onclick = function () { var n = $("go").dataset.n; $("go").dataset.n = ""; if (n === "next") newLevel(lvl + 1); else if (n === "again") { pts = 0; newLevel(0); } else newLevel(lvl); start(); };
  var l0 = saved > 0 && saved < LV.length ? saved : 0;
  pts = 0; newLevel(l0); draw();
  show("Рівень " + (l0 + 1) + " з " + LV.length + ": " + LV[l0].name, "Бульдозер: баскетбол", LV[l0].txt, "Грати");
  window.__b = { shoot: shoot, st: function () { return { makes: makes, used: used, state: state, run: run, pts: pts }; },
    find: function () { var L = LV[lvl]; for (var vy = -17; vy < -6; vy += 0.25) for (var vx = 2; vx < 12; vx += 0.1) { var b = { x: ball.x, y: ball.y, vx: vx, vy: vy }, ok = false, rt = rimTouched; for (var s = 0; s < 400; s++) { if (physics(b, curHX(), L.hy)) { ok = true; break; } if (b.y > FLOOR) break; } rimTouched = rt; if (ok) return { vx: vx, vy: vy }; } return null; } };
})();
</script>
</body>
</html>
